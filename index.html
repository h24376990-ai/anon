<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>つながり</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone">

    <div class="logo">
        <h1>つながり</h1>
        <p>SNS & Chat</p>
    </div>

    <div class="card">

        <div class="tabs">
            <button id="loginTab" class="active">ログイン</button>
            <button id="registerTab">新規登録</button>
        </div>

        <!-- ログイン -->

        <div id="loginPage">

            <input
                type="text"
                placeholder="ユーザーID"
                id="loginId"
            >

            <input
                type="password"
                placeholder="パスワード"
                id="loginPassword"
            >

            <button class="mainButton">
                ログイン
            </button>

        </div>

        <!-- 新規登録 -->

        <div id="registerPage" class="hidden">

            <input
                type="text"
                placeholder="ユーザーID"
            >

            <input
                type="password"
                placeholder="パスワード"
            >

            <input
                type="password"
                placeholder="パスワード確認"
            >

            <button class="mainButton">
                新規登録
            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
