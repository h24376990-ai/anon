<!DOCTYPE html>
<html lang="ja">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>つながり - ホーム</title>

    <link rel="stylesheet" href="home.css">

</head>
<body>

<div class="app">

    <!-- ヘッダー -->

    <header>

        <div>
            <h2>こんにちは！</h2>
            <p id="userName">ユーザー</p>
        </div>

        <div class="icon">
            👤
        </div>

    </header>

    <!-- 検索 -->

    <div class="search">

        <input
            type="text"
            placeholder="ユーザーを検索..."
        >

    </div>

    <!-- プロフィールカード -->

    <div class="profileCard">

        <div class="avatar">
            👤
        </div>

        <div>

            <h3 id="profileName">
                ユーザー
            </h3>

            <p>
                今日も楽しくチャットしよう！
            </p>

        </div>

    </div>

    <!-- フレンド募集 -->

    <h3 class="title">
        フレンド募集
    </h3>

    <div class="friendCard">

        <h4>ゆうき</h4>

        <p>
            高校生です！
            一緒に話せる人募集😊
        </p>

        <button>
            申請する
        </button>

    </div>

    <div class="friendCard">

        <h4>あや</h4>

        <p>
            ゲーム好きです！
        </p>

        <button>
            申請する
        </button>

    </div>

    <!-- タイムライン -->

    <h3 class="title">
        タイムライン
    </h3>

    <div class="post">

        <h4>ゆうき</h4>

        <p>
            今日から始めました！
        </p>

    </div>

    <div class="post">

        <h4>あや</h4>

        <p>
            おはよう☀
        </p>

    </div>

</div>

<!-- 下メニュー -->

<nav>

    <button>🏠</button>

    <button>👥</button>

    <button>💬</button>

    <button>🔔</button>

    <button>⚙️</button>

</nav>

<script src="home.js"></script>

</body>
</html>
