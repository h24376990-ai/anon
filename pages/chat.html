<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>チャット | つながり</title>

    <link rel="stylesheet" href="chat.css">

</head>

<body>

<div class="app">

    <header>

        <h2>チャット</h2>

        <button class="newChat">
            ＋
        </button>

    </header>

    <div class="search">

        <input
            type="text"
            placeholder="チャットを検索">

    </div>

    <!-- チャット一覧 -->

    <div class="chatCard">

        <div class="avatar">

            M

            <span class="online"></span>

        </div>

        <div class="chatInfo">

            <h3>もか</h3>

            <p>こんにちは！</p>

        </div>

        <div class="right">

            <small>19:25</small>

            <span class="badge">
                2
            </span>

        </div>

    </div>

    <div class="chatCard">

        <div class="avatar">

            A

        </div>

        <div class="chatInfo">

            <h3>あや</h3>

            <p>ゲームしよう！</p>

        </div>

        <div class="right">

            <small>昨日</small>

        </div>

    </div>

    <div class="chatCard">

        <div class="avatar">

            Y

        </div>

        <div class="chatInfo">

            <h3>ゆうき</h3>

            <p>よろしく！</p>

        </div>

        <div class="right">

            <small>月曜日</small>

        </div>

    </div>

</div>

<nav>

<button>🏠</button>

<button>👥</button>

<button class="active">💬</button>

<button>🔔</button>

<button>⚙️</button>

</nav>

<script src="chat.js"></script>

</body>

</html>
