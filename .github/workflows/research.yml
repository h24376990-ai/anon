name: Math Research Lab

on:
  workflow_dispatch:

  schedule:
    # GitHub Actionsの最小スケジュール間隔
    # 実際の開始時刻はGitHub側の混雑等で遅れる場合があります
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: math-research-worker
  cancel-in-progress: false

jobs:

  research:

    name: AI Research Worker

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # =========================================================
      # 1. 基本環境
      # =========================================================

      - name: Prepare environment
        run: |
          set -e

          python3 --version
          curl --version

          mkdir -p /tmp/research

          echo "Research worker initialized."


      # =========================================================
      # 2. キュー取得
      #
      # 最大3件まで取得
      #
      # これにより
      #
      # job A
      # job B
      # job C
      #
      # を1回のActions起動で処理できる
      # =========================================================

      - name: Get queued research jobs
        id: get_jobs

        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |

          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/research/jobs.json \
            --write-out "%{http_code}" \
            --request GET \
            --url "${BASE_URL}/rest/v1/research_jobs?select=*&status=eq.queued&order=priority.desc,created_at.asc&limit=3" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json")

          echo "HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" != "200" ]; then
            cat /tmp/research/jobs.json
            exit 1
          fi

          python3 <<'PY'

          import json

          path = "/tmp/research/jobs.json"

          with open(path, "r", encoding="utf-8") as f:
              jobs = json.load(f)

          print("Queued jobs:", len(jobs))

          with open(
              "/tmp/research/job_exists",
              "w",
              encoding="utf-8"
          ) as f:
              f.write("true" if jobs else "false")

          with open(
              "/tmp/research/jobs_selected.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  jobs,
                  f,
                  ensure_ascii=False
              )

          PY

          echo "job_exists=$(cat /tmp/research/job_exists)" >> "$GITHUB_OUTPUT"


      # =========================================================
      # 3. ジョブ処理開始
      # =========================================================

      - name: Process research queue
        if: steps.get_jobs.outputs.job_exists == 'true'

        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

        run: |

          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          python3 <<'PY'

          import json
          import os
          import subprocess
          import urllib.parse
          import urllib.request
          import urllib.error
          import re
          import hashlib
          from datetime import datetime, timezone


          BASE_URL = os.environ["SUPABASE_URL"].rstrip("/")

          if BASE_URL.endswith("/rest/v1"):
              BASE_URL = BASE_URL[:-8]

          SERVICE_KEY = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          OPENROUTER_KEY = os.environ["OPENROUTER_API_KEY"]


          # =====================================================
          # HTTP helper
          # =====================================================

          def supabase_request(
              method,
              table,
              query="",
              data=None
          ):

              url = f"{BASE_URL}/rest/v1/{table}"

              if query:
                  url += "?" + query

              headers = {
                  "apikey": SERVICE_KEY,
                  "Authorization": f"Bearer {SERVICE_KEY}",
                  "Content-Type": "application/json",
              }

              if data is not None:
                  body = json.dumps(
                      data,
                      ensure_ascii=False
                  ).encode("utf-8")
              else:
                  body = None

              request = urllib.request.Request(
                  url,
                  data=body,
                  headers=headers,
                  method=method
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      raw = response.read().decode(
                          "utf-8"
                      )

                      if not raw:
                          return []

                      return json.loads(raw)

              except urllib.error.HTTPError as e:

                  error_body = e.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  raise RuntimeError(
                      f"Supabase HTTP {e.code}: {error_body}"
                  )


          # =====================================================
          # JSON safe helper
          # =====================================================

          def safe_json(value):

              if value is None:
                  return {}

              if isinstance(value, dict):
                  return value

              if isinstance(value, list):
                  return value

              if isinstance(value, str):

                  try:
                      return json.loads(value)

                  except Exception:
                      return {
                          "text": value
                      }

              return value


          # =====================================================
          # 研究ルート正規化
          #
          # 同じ数学記号の表記揺れをある程度吸収
          # =====================================================

          def normalize_route(text):

              text = str(text or "").lower()

              replacements = {
                  "　": " ",
                  "\n": " ",
                  "\r": " ",
                  "⇒": "->",
                  "→": "->",
                  "⇔": "<->",
              }

              for a, b in replacements.items():
                  text = text.replace(a, b)

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              # 長すぎる情報を除去して
              # 「研究ルート」の特徴を抽出
              text = re.sub(
                  r"\d+(\.\d+)?",
                  "#",
                  text
              )

              return text.strip()


          def route_fingerprint(
              hypothesis,
              approach,
              proof_strategy,
              question
          ):

              raw = "|".join([
                  normalize_route(question),
                  normalize_route(hypothesis),
                  normalize_route(approach),
                  normalize_route(proof_strategy),
              ])

              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:24]


          # =====================================================
          # OpenAlex / Crossref
          #
          # 論文検索はAI自身の記憶だけに任せない
          # =====================================================

          def search_openalex(query):

              encoded = urllib.parse.quote(
                  str(query)[:300]
              )

              url = (
                  "https://api.openalex.org/works"
                  f"?search={encoded}"
                  "&per-page=5"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                      "ResearchAILab/1.0"
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=15
                  ) as response:

                      data = json.loads(
                          response.read().decode(
                              "utf-8"
                          )
                      )

                  results = []

                  for work in data.get(
                      "results",
                      []
                  ):

                      results.append({

                          "title":
                              work.get(
                                  "display_name"
                              ),

                          "year":
                              work.get(
                                  "publication_year"
                              ),

                          "doi":
                              work.get(
                                  "doi"
                              ),

                          "type":
                              work.get(
                                  "type"
                              )

                      })

                  return results

              except Exception as e:

                  print(
                      "OpenAlex unavailable:",
                      e
                  )

                  return []


          def search_crossref(query):

              encoded = urllib.parse.quote(
                  str(query)[:300]
              )

              url = (
                  "https://api.crossref.org/works"
                  f"?query.bibliographic={encoded}"
                  "&rows=5"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                      "ResearchAILab/1.0"
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=15
                  ) as response:

                      data = json.loads(
                          response.read().decode(
                              "utf-8"
                          )
                      )

                  results = []

                  for item in data.get(
                      "message",
                      {}
                  ).get(
                      "items",
                      []
                  ):

                      title = (
                          item.get(
                              "title",
                              [""]
                          ) or [""]
                      )[0]

                      results.append({

                          "title":
                              title,

                          "year":
                              (
                                  item.get(
                                      "published-print"
                                  )
                                  or
                                  item.get(
                                      "published-online"
                                  )
                                  or
                                  {}
                              ).get(
                                  "date-parts",
                                  [[None]]
                              )[0][0],

                          "doi":
                              item.get(
                                  "DOI"
                              )

                      })

                  return results

              except Exception as e:

                  print(
                      "Crossref unavailable:",
                      e
                  )

                  return []


          # =====================================================
          # OpenRouter
          # =====================================================

          def call_ai(
              system_prompt,
              user_prompt
          ):

              payload = {

                  "model":
                      "nvidia/nemotron-3-ultra-550b-a55b:free",

                  "messages": [

                      {
                          "role":
                              "system",

                          "content":
                              system_prompt
                      },

                      {
                          "role":
                              "user",

                          "content":
                              user_prompt
                      }

                  ],

                  "temperature":
                      0.15,

                  "max_tokens":
                      12000
              }


              request = urllib.request.Request(

                  "https://openrouter.ai/api/v1/chat/completions",

                  data=json.dumps(
                      payload,
                      ensure_ascii=False
                  ).encode("utf-8"),

                  headers={

                      "Authorization":
                          f"Bearer {OPENROUTER_KEY}",

                      "Content-Type":
                          "application/json",

                      "HTTP-Referer":
                          "https://github.com",

                      "X-Title":
                          "Research AI Lab"

                  },

                  method="POST"
              )


              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=240
                  ) as response:

                      raw = response.read().decode(
                          "utf-8"
                      )

              except urllib.error.HTTPError as e:

                  body = e.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  raise RuntimeError(
                      f"OpenRouter HTTP {e.code}: {body}"
                  )


              data = json.loads(raw)

              try:

                  content = (
                      data["choices"][0]
                      ["message"]
                      ["content"]
                  )

              except Exception:

                  raise RuntimeError(
                      "Invalid OpenRouter response: "
                      + json.dumps(
                          data,
                          ensure_ascii=False
                      )[:3000]
                  )


              content = content.strip()

              content = re.sub(
                  r"^```(?:json)?\s*",
                  "",
                  content,
                  flags=re.I
              )

              content = re.sub(
                  r"\s*```$",
                  "",
                  content
              )

              try:

                  return json.loads(
                      content
                  )

              except json.JSONDecodeError:

                  match = re.search(
                      r"\{.*\}",
                      content,
                      re.S
                  )

                  if not match:
                      raise RuntimeError(
                          "AI returned invalid JSON."
                      )

                  return json.loads(
                      match.group(0)
                  )


          # =====================================================
          # キュー
          # =====================================================

          with open(
              "/tmp/research/jobs_selected.json",
              "r",
              encoding="utf-8"
          ) as f:

              jobs = json.load(f)


          print(
              f"Processing {len(jobs)} queued job(s)."
          )


          # =====================================================
          # 各ジョブ
          # =====================================================

          for index, job in enumerate(jobs):

              job_id = job["id"]

              project_id = job["project_id"]

              payload = safe_json(
                  job.get("payload")
              )

              theme = str(
                  payload.get(
                      "theme",
                      ""
                  )
              ).strip()


              if not theme:

                  print(
                      f"[{job_id}] Theme empty."
                  )

                  supabase_request(
                      "PATCH",
                      "research_jobs",
                      f"id=eq.{job_id}&status=eq.queued",
                      {
                          "status":
                              "failed",

                          "error_message":
                              "Research theme is empty.",

                          "finished_at":
                              datetime.now(
                                  timezone.utc
                              ).isoformat()
                      }
                  )

                  continue


              print(
                  f"\n========== JOB {index + 1}/{len(jobs)} =========="
              )

              print(
                  "JOB:",
                  job_id
              )

              print(
                  "THEME:",
                  theme
              )


              # =================================================
              # runningへ変更
              #
              # status=queued条件付きなので
              # 同じジョブの二重取得をある程度防止
              # =================================================

              started = datetime.now(
                  timezone.utc
              ).isoformat()


              started_rows = supabase_request(

                  "PATCH",

                  "research_jobs",

                  f"id=eq.{job_id}&status=eq.queued",

                  {
                      "status":
                          "running",

                      "started_at":
                          started
                  }
              )


              if not started_rows:

                  print(
                      "Job was already claimed. Skipping."
                  )

                  continue


              try:

                  # =============================================
                  # 過去研究取得
                  # =============================================

                  previous_results = supabase_request(

                      "GET",

                      "research_results",

                      (
                          "select="
                          "id,title,hypothesis,"
                          "content,evaluation,"
                          "confidence_level,created_at"
                          f"&project_id=eq.{project_id}"
                          "&order=created_at.desc"
                          "&limit=100"
                      )
                  )


                  # =============================================
                  # AIメモ取得
                  # =============================================

                  memos = supabase_request(

                      "GET",

                      "research_memos",

                      (
                          "select="
                          "id,title,content,"
                          "created_at,updated_at"
                          f"&project_id=eq.{project_id}"
                          "&order=created_at.desc"
                          "&limit=100"
                      )
                  )


                  print(
                      "Previous results:",
                      len(previous_results)
                  )

                  print(
                      "Research memos:",
                      len(memos)
                  )


                  # =============================================
                  # 過去研究を圧縮
                  # =============================================

                  previous_context = []

                  for r in previous_results:

                      content = safe_json(
                          r.get("content")
                      )

                      previous_context.append({

                          "id":
                              r.get("id"),

                          "title":
                              r.get("title"),

                          "hypothesis":
                              r.get("hypothesis"),

                          "evaluation":
                              r.get("evaluation"),

                          "confidence":
                              r.get(
                                  "confidence_level"
                              ),

                          "approach":
                              content.get(
                                  "approach"
                              ) if isinstance(
                                  content,
                                  dict
                              ) else None,

                          "proof_strategy":
                              content.get(
                                  "proof_strategy"
                              ) if isinstance(
                                  content,
                                  dict
                              ) else None,

                          "critical_gap":
                              content.get(
                                  "critical_gap"
                              ) if isinstance(
                                  content,
                                  dict
                              ) else None

                      })


                  # =============================================
                  # 既存ルートの fingerprint
                  # =============================================

                  route_counts = {}

                  for r in previous_results:

                      content = safe_json(
                          r.get("content")
                      )

                      if not isinstance(
                          content,
                          dict
                      ):
                          continue

                      fp = route_fingerprint(

                          r.get(
                              "hypothesis",
                              ""
                          ),

                          content.get(
                              "approach",
                              ""
                          ),

                          content.get(
                              "proof_strategy",
                              ""
                          ),

                          content.get(
                              "research_question",
                              theme
                          )

                      )

                      route_counts[fp] = (
                          route_counts.get(
                              fp,
                              0
                          ) + 1
                      )


                  # =============================================
                  # 論文検索
                  #
                  # AIが「知っているつもり」で
                  # 論文名を捏造しないようにする
                  # =============================================

                  academic_query = (
                      f"{theme} "
                      "mathematical proof theorem conjecture"
                  )


                  openalex_results = search_openalex(
                      academic_query
                  )

                  crossref_results = search_crossref(
                      academic_query
                  )


                  # =============================================
                  # 研究メモ
                  # =============================================

                  memo_context = []

                  for memo in memos:

                      memo_context.append({

                          "title":
                              memo.get(
                                  "title"
                              ),

                          "content":
                              memo.get(
                                  "content"
                              )

                      })


                  # =============================================
                  # AI SYSTEM
                  # =============================================

                  system_prompt = r"""
You are the core research engine of an autonomous
mathematical research laboratory.

Your objective is NOT to merely explain known mathematics.

Your objective is to search for genuinely useful mathematical
progress while remaining extremely conservative about claims.

NON-NEGOTIABLE RULES:

1. Never call a conjecture a theorem.

2. Never claim a proof exists unless every logical step has
   actually been justified.

3. Never invent a paper, author, theorem, DOI, citation,
   numerical result, or historical claim.

4. If an academic source is supplied, distinguish:
   - source existence
   - source relevance
   - what the source actually establishes.

5. Numerical experiments are evidence only.
   They are never proof by themselves.

6. Separate:
   - established mathematical facts
   - assumptions
   - observations
   - conjectures
   - proposed deductions.

7. Search for counterexamples before accepting a proposed claim.

8. Attempt multiple proof perspectives where appropriate:
   - direct proof
   - contradiction
   - contrapositive
   - mathematical induction
   - construction
   - invariant
   - extremal argument
   - algebraic transformation
   - analytic argument
   - probabilistic argument
   - computational experiment.

9. Do not use a proof method merely because it sounds sophisticated.
   Explain why it is logically applicable.

10. If a strategy fails, identify exactly where it fails.

11. Prefer a new research direction over repeating a previously
    attempted direction.

12. A result marked promising or high confidence is NOT automatically
    mathematically correct.

13. Any proposed breakthrough must survive an adversarial critique.

14. Explicitly identify the strongest remaining gap.

15. If the user asks about an unresolved problem such as the Riemann
    Hypothesis, do NOT simply answer "unproved, therefore cannot answer."
    Instead:
      - state its established status,
      - identify known structural facts,
      - inspect the user's research context,
      - propose concrete research questions,
      - attempt original mathematical exploration,
      - clearly label speculation.

16. Do not merely reproduce textbook mathematics unless it is required
    as a foundation for a genuinely new deduction.

17. When previous research exists, actively compare the new route against
    previous routes.

18. A route that has already failed three or more times must be treated
    as blocked unless the new proposal contains a materially different
    mathematical mechanism.

19. If a promising result was previously marked ⭕, treat it as a
    hypothesis requiring independent re-verification, not as established
    truth.

20. Think adversarially against your own proposed proof.

21. Look for hidden assumptions, domain restrictions, quantifier mistakes,
    circular reasoning, invalid limits, unjustified interchange of
    operations, and missing cases.

22. Do not optimize for sounding intelligent.
    Optimize for mathematical correctness.

23. If there is insufficient information, say exactly what is missing.

24. A genuinely negative result is valuable if it eliminates a research
    route.

25. The final answer must be valid JSON only.
"""


                  # =============================================
                  # USER PROMPT
                  # =============================================

                  user_prompt = f"""

RESEARCH THEME:

{theme}


============================================================
USER / CLAUDE RESEARCH MEMOS
============================================================

These notes may contain useful ideas from previous research
or from another AI such as Claude.

They are NOT authoritative mathematical facts.

Treat them as hypotheses and verify them.

{json.dumps(
    memo_context,
    ensure_ascii=False,
    indent=2
)}


============================================================
PREVIOUS RESEARCH RESULTS
============================================================

The following results come from this laboratory.

Do NOT blindly repeat them.

Use them to identify:
- failed approaches
- promising approaches
- contradictions
- missing cases
- unexplored directions
- repeated routes

{json.dumps(
    previous_context,
    ensure_ascii=False,
    indent=2
)}


============================================================
ACADEMIC SEARCH RESULTS
============================================================

These results came from external academic metadata services.

They are evidence that records exist, not proof of their contents.

OPENALEX:

{json.dumps(
    openalex_results,
    ensure_ascii=False,
    indent=2
)}


CROSSREF:

{json.dumps(
    crossref_results,
    ensure_ascii=False,
    indent=2
)}


============================================================
RESEARCH ROUTE BLOCKING
============================================================

Previously observed route fingerprints:

{json.dumps(
    route_counts,
    ensure_ascii=False,
    indent=2
)}


A route repeated three or more times is BLOCKED.

Do not simply rename the same strategy.

A new route must contain a materially different mathematical mechanism.


============================================================
MANDATORY ORIGINALITY CHECK
============================================================

Before proposing the main approach, perform these internal checks:

A. Known-mathematics check
   Is this merely a standard theorem or textbook argument?

B. Previous-lab check
   Has this laboratory already attempted essentially the same route?

C. Route similarity check
   Is this just a renamed version of a failed approach?

D. Literature check
   Does the supplied academic metadata suggest that the central idea
   is already well known?

E. Novel mechanism check
   What mathematical mechanism is actually different?

F. Counterexample check
   What would falsify the proposed statement?

G. Proof-gap check
   What is the single most dangerous unproven step?

H. Adversarial check
   Try to destroy your own argument.


============================================================
MANDATORY PROOF STRATEGY COMPARISON
============================================================

Consider at least three applicable strategies when possible.

For each:

- method
- why applicable
- strongest step
- weakest step
- possible counterexample
- whether it genuinely differs from previous work


============================================================
MANDATORY MATHEMATICAL MODEL / EXPERIMENT
============================================================

If the problem benefits from visualization or computation,
describe a mathematical model that could be:

- transformed
- parameterized
- visualized in 3D
- tested numerically
- subjected to physical-style simulation

However:

physical-style simulation is exploratory evidence only.

Never convert simulation behavior into proof.


============================================================
MANDATORY OUTPUT
============================================================

Return ONLY JSON with this structure:

{{
  "title": "",
  "hypothesis": "",

  "research_question": "",

  "novelty_assessment": {{
    "known_mathematics_risk": "",
    "previous_route_risk": "",
    "literature_overlap_risk": "",
    "new_mechanism": ""
  }},

  "known_facts": [],

  "assumptions": [],

  "observations": [],

  "approach": [],

  "proof_strategy": [],

  "alternative_proof_strategies": [],

  "counterexample_strategy": [],

  "counterexample_results": [],

  "cross_domain_connection": [],

  "mathematical_model": {{

    "model_type": "",

    "equations": [],

    "parameters": [],

    "transformations": [],

    "visualization": "",

    "physical_simulation_idea": ""

  }},

  "literature_check": {{

    "potentially_relevant_sources": [],

    "what_is_verified": [],

    "what_is_not_verified": []

  }},

  "previous_research_comparison": [],

  "route_status": "",

  "critical_gap": "",

  "adversarial_critique": [],

  "next_steps": [],

  "status": "",

  "confidence": 0,

  "requires_independent_reverification": true
}}

Allowed status:

candidate
promising
uncertain
rejected
needs_verification
reverification_required

IMPORTANT:

Even if the argument appears extremely strong,
do not state that an unresolved problem has been solved.

For unresolved problems, the default should be
needs_verification or reverification_required
unless a complete independently checkable proof has
actually been established.
"""


                  # =============================================
                  # AI CALL
                  # =============================================

                  print(
                      "Calling OpenRouter..."
                  )


                  result = call_ai(
                      system_prompt,
                      user_prompt
                  )


                  # =============================================
                  # AI result validation
                  # =============================================

                  if not isinstance(
                      result,
                      dict
                  ):

                      raise RuntimeError(
                          "AI result is not an object."
                      )


                  required_keys = [

                      "title",
                      "hypothesis",
                      "research_question",
                      "known_facts",
                      "assumptions",
                      "approach",
                      "proof_strategy",
                      "counterexample_strategy",
                      "critical_gap",
                      "next_steps",
                      "status",
                      "confidence"

                  ]


                  missing = [

                      key

                      for key in required_keys

                      if key not in result

                  ]


                  if missing:

                      raise RuntimeError(
                          "Missing AI fields: "
                          + ", ".join(
                              missing
                          )
                      )


                  # =============================================
                  # Confidence
                  # =============================================

                  try:

                      confidence = float(
                          result.get(
                              "confidence",
                              0
                          )
                      )

                  except Exception:

                      confidence = 0


                  confidence = max(
                      0,
                      min(
                          1,
                          confidence
                      )
                  )


                  # =============================================
                  # Status
                  # =============================================

                  status = str(
                      result.get(
                          "status",
                          "needs_verification"
                      )
                  ).lower().strip()


                  allowed_statuses = {

                      "candidate",
                      "promising",
                      "uncertain",
                      "rejected",
                      "needs_verification",
                      "reverification_required"

                  }


                  if status not in allowed_statuses:

                      status = (
                          "needs_verification"
                      )


                  # =============================================
                  # 重要:
                  #
                  # AIが「⭕」を出しても
                  # 未解決問題なら自動的に
                  # 再検証要求へ戻す
                  # =============================================

                  requires_reverification = (
                      bool(
                          result.get(
                              "requires_independent_reverification",
                              True
                          )
                      )
                  )


                  # =============================================
                  # route fingerprint
                  # =============================================

                  fp = route_fingerprint(

                      result.get(
                          "hypothesis",
                          ""
                      ),

                      result.get(
                          "approach",
                          ""
                      ),

                      result.get(
                          "proof_strategy",
                          ""
                      ),

                      result.get(
                          "research_question",
                          theme
                      )

                  )


                  previous_count = route_counts.get(
                      fp,
                      0
                  )


                  # =============================================
                  # 3回以上の同一ルート遮断
                  # =============================================

                  if previous_count >= 3:

                      result[
                          "route_blocked"
                      ] = True

                      result[
                          "route_block_reason"
                      ] = (
                          "Essentially the same research route "
                          "has already been attempted at least "
                          "three times."
                      )

                      status = "rejected"

                      confidence = 0


                  else:

                      result[
                          "route_blocked"
                      ] = False


                  # =============================================
                  # originality score
                  # =============================================

                  novelty = result.get(
                      "novelty_assessment",
                      {}
                  )


                  if not isinstance(
                      novelty,
                      dict
                  ):

                      novelty = {}


                  # =============================================
                  # ⭕判定
                  #
                  # 「promising + 0.8」だけでは
                  # ⭕にしない
                  # =============================================

                  evaluation = "△"


                  if status == "rejected":

                      evaluation = "❌"

                  elif (

                      status == "promising"

                      and confidence >= 0.8

                      and not requires_reverification

                      and previous_count < 3

                      and result.get(
                          "critical_gap"
                      )

                  ):

                      # ここではなお△寄りにする。
                      # 数学的証明をAIだけで確定しない。
                      evaluation = "△"

                  else:

                      evaluation = "△"


                  # =============================================
                  # confidence level
                  # =============================================

                  confidence_level = round(
                      confidence * 5
                  )


                  # =============================================
                  # content
                  # =============================================

                  content = {

                      "research_question":
                          result.get(
                              "research_question"
                          ),

                      "known_facts":
                          result.get(
                              "known_facts",
                              []
                          ),

                      "assumptions":
                          result.get(
                              "assumptions",
                              []
                          ),

                      "observations":
                          result.get(
                              "observations",
                              []
                          ),

                      "approach":
                          result.get(
                              "approach",
                              []
                          ),

                      "proof_strategy":
                          result.get(
                              "proof_strategy",
                              []
                          ),

                      "alternative_proof_strategies":
                          result.get(
                              "alternative_proof_strategies",
                              []
                          ),

                      "counterexample_strategy":
                          result.get(
                              "counterexample_strategy",
                              []
                          ),

                      "counterexample_results":
                          result.get(
                              "counterexample_results",
                              []
                          ),

                      "cross_domain_connection":
                          result.get(
                              "cross_domain_connection",
                              []
                          ),

                      "mathematical_model":
                          result.get(
                              "mathematical_model",
                              {}
                          ),

                      "literature_check":
                          result.get(
                              "literature_check",
                              {}
                          ),

                      "previous_research_comparison":
                          result.get(
                              "previous_research_comparison",
                              []
                          ),

                      "route_fingerprint":
                          fp,

                      "route_previous_count":
                          previous_count,

                      "route_blocked":
                          result.get(
                              "route_blocked",
                              False
                          ),

                      "critical_gap":
                          result.get(
                              "critical_gap"
                          ),

                      "adversarial_critique":
                          result.get(
                              "adversarial_critique",
                              []
                          ),

                      "next_steps":
                          result.get(
                              "next_steps",
                              []
                          ),

                      "novelty_assessment":
                          novelty,

                      "requires_independent_reverification":
                          requires_reverification,

                      "source_job_id":
                          job_id,

                      "research_configuration":
                          payload

                  }


                  # =============================================
                  # 保存レコード
                  # =============================================

                  record = {

                      "project_id":
                          project_id,

                      "title":
                          str(
                              result.get(
                                  "title",
                                  "AI数学研究"
                              )
                          ),

                      "hypothesis":
                          str(
                              result.get(
                                  "hypothesis",
                                  ""
                              )
                          ),

                      "content":
                          json.dumps(
                              content,
                              ensure_ascii=False
                          ),

                      "status":
                          "pending",

                      "evaluation":
                          evaluation,

                      "confidence_level":
                          confidence_level,

                      "is_human_saved":
                          False

                  }


                  # =============================================
                  # ⭕候補の扱い
                  #
                  # 現段階ではAI単独で「証明済み」
                  # とは扱わない。
                  #
                  # 将来的に独立検証workerを追加する
                  # 前提の安全な設計。
                  # =============================================

                  if evaluation == "⭕":

                      content[
                          "requires_independent_reverification"
                      ] = True

                      content[
                          "verification_stage"
                      ] = "independent_reverification"

                      record[
                          "evaluation"
                      ] = "△"


                  # =============================================
                  # 保存
                  # =============================================

                  saved = supabase_request(

                      "POST",

                      "research_results",

                      "",

                      record

                  )


                  print(
                      "Research result saved:",
                      job_id
                  )


                  # =============================================
                  # ジョブ結果
                  # =============================================

                  finished = datetime.now(
                      timezone.utc
                  ).isoformat()


                  job_result = {

                      "result_id":
                          saved[0]["id"]
                          if saved
                          and isinstance(
                              saved,
                              list
                          )
                          and saved[0].get("id")
                          else None,

                      "evaluation":
                          record[
                              "evaluation"
                          ],

                      "status":
                          status,

                      "confidence":
                          confidence,

                      "route_fingerprint":
                          fp,

                      "route_previous_count":
                          previous_count,

                      "route_blocked":
                          result.get(
                              "route_blocked",
                              False
                          )

                  }


                  supabase_request(

                      "PATCH",

                      "research_jobs",

                      (
                          f"id=eq.{job_id}"
                          "&status=eq.running"
                      ),

                      {

                          "status":
                              "completed",

                          "result":
                              job_result,

                          "finished_at":
                              finished

                      }

                  )


                  print(
                      "JOB COMPLETED:",
                      job_id
                  )


              except Exception as e:

                  # =============================================
                  # 個別ジョブ失敗
                  #
                  # 他のキューを巻き込まない
                  # =============================================

                  print(
                      "JOB FAILED:",
                      job_id
                  )

                  print(
                      repr(e)
                  )


                  try:

                      supabase_request(

                          "PATCH",

                          "research_jobs",

                          (
                              f"id=eq.{job_id}"
                              "&status=eq.running"
                          ),

                          {

                              "status":
                                  "failed",

                              "error_message":
                                  str(e)[
                                      :4000
                                  ],

                              "finished_at":
                                  datetime.now(
                                      timezone.utc
                                  ).isoformat()

                          }

                      )

                  except Exception as save_error:

                      print(
                          "Failed to mark job:",
                          save_error
                      )


          print(
              "\nAll selected research jobs processed."
          )

          PY


      # =========================================================
      # 4. 最終確認
      # =========================================================

      - name: Worker finished
        if: always()

        run: |

          echo "======================================"
          echo "Math Research Lab worker finished."
          echo "======================================"
