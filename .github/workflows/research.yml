name: Math Research Lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-cycle:
    name: AI Mathematics Research Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # ==========================================================
      # STEP 10-1
      # Repository
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # STEP 10-2
      # Check secrets
      # ==========================================================

      - name: Check required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail

          echo "Checking required secrets..."

          test -n "${SUPABASE_URL}" || {
            echo "ERROR: SUPABASE_URL is missing."
            exit 1
          }

          test -n "${SUPABASE_SERVICE_ROLE_KEY}" || {
            echo "ERROR: SUPABASE_SERVICE_ROLE_KEY is missing."
            exit 1
          }

          test -n "${OPENROUTER_API_KEY}" || {
            echo "ERROR: OPENROUTER_API_KEY is missing."
            exit 1
          }

          echo "Required secrets are available."


      # ==========================================================
      # STEP 10-3
      # Normalize Supabase URL
      # ==========================================================

      - name: Prepare Supabase URL
        id: supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail

          URL="${SUPABASE_URL}"

          URL="${URL%/}"

          # Prevent accidental duplication:
          # /rest/v1/rest/v1
          URL="${URL%/rest/v1}"

          URL="${URL%/}"

          echo "Supabase base URL prepared."

          {
            echo "base_url=${URL}"
          } >> "$GITHUB_OUTPUT"


      # ==========================================================
      # STEP 10-4
      # Find one running job
      # ==========================================================

      - name: Find running research job
        id: find_job
        env:
          SUPABASE_BASE_URL: ${{ steps.supabase.outputs.base_url }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          echo "Searching for a running research job..."

          API_URL="${SUPABASE_BASE_URL}/rest/v1/research_jobs"

          RESPONSE_FILE="$(mktemp)"

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --output "${RESPONSE_FILE}" \
              --write-out "%{http_code}" \
              --request GET \
              --url "${API_URL}" \
              --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Content-Type: application/json" \
              --get \
              --data-urlencode "select=id,project_id,job_type,status,priority,payload,created_at,started_at" \
              --data-urlencode "status=eq.running" \
              --data-urlencode "order=started_at.asc" \
              --data-urlencode "limit=1"
          )"

          echo "Supabase HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "ERROR: Could not read research_jobs."
            cat "${RESPONSE_FILE}"
            exit 1
          fi

          python3 - "${RESPONSE_FILE}" <<'PY'
          import json
          import sys

          filename = sys.argv[1]

          with open(filename, "r", encoding="utf-8") as f:
              data = json.load(f)

          if not data:
              print("NO_JOB")
              sys.exit(0)

          job = data[0]

          print("JOB_FOUND")

          print(
              json.dumps(
                  job,
                  ensure_ascii=False,
                  indent=2
              )
          )
          PY

          JOB_DATA="$(cat "${RESPONSE_FILE}")"

          if [ "${JOB_DATA}" = "[]" ]; then
            echo "No running research job exists."

            echo "job_found=false" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          JOB_ID="$(
            python3 - "${RESPONSE_FILE}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as f:
              data = json.load(f)

          print(data[0]["id"])
          PY
          )"

          JOB_TYPE="$(
            python3 - "${RESPONSE_FILE}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as f:
              data = json.load(f)

          print(data[0].get("job_type") or "")
          PY
          )"

          PROJECT_ID="$(
            python3 - "${RESPONSE_FILE}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as f:
              data = json.load(f)

          print(data[0].get("project_id") or "")
          PY
          )"

          PAYLOAD="$(
            python3 - "${RESPONSE_FILE}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as f:
              data = json.load(f)

          payload = data[0].get("payload")

          if payload is None:
              payload = {}

          print(
              json.dumps(
                  payload,
                  ensure_ascii=False
              )
          )
          PY
          )"

          echo "job_found=true" >> "$GITHUB_OUTPUT"
          echo "job_id=${JOB_ID}" >> "$GITHUB_OUTPUT"
          echo "job_type=${JOB_TYPE}" >> "$GITHUB_OUTPUT"
          echo "project_id=${PROJECT_ID}" >> "$GITHUB_OUTPUT"

          {
            echo "payload<<PAYLOAD_EOF"
            echo "${PAYLOAD}"
            echo "PAYLOAD_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Research job found."
          echo "Job type: ${JOB_TYPE}"


      # ==========================================================
      # STEP 10-5
      # Build research prompt
      # ==========================================================

      - name: Build research prompt
        if: steps.find_job.outputs.job_found == 'true'
        env:
          JOB_TYPE: ${{ steps.find_job.outputs.job_type }}
          JOB_PAYLOAD: ${{ steps.find_job.outputs.payload }}
        run: |
          set -euo pipefail

          cat > research_prompt.txt <<EOF
You are the research engine of an autonomous mathematics research laboratory.

PRIMARY RESEARCH THEME:
Riemann Hypothesis.

CURRENT JOB TYPE:
${JOB_TYPE}

CURRENT JOB PAYLOAD:
${JOB_PAYLOAD}

============================================================
RESEARCH RULES
============================================================

The purpose is mathematical research, not conversational speculation.

Never claim that the Riemann Hypothesis has been proven unless
a complete mathematical proof has actually been established.

Strictly distinguish:

- established mathematical facts
- known theorems
- published claims
- numerical evidence
- hypotheses
- speculative ideas
- unverified deductions

Never turn numerical evidence into a proof.

Never invent:
- papers
- authors
- theorem names
- citations
- experimental results

============================================================
RESEARCH STRATEGY
============================================================

Generate a mathematically meaningful research candidate.

Consider, where appropriate:

1. Direct proof
2. Proof by contradiction
3. Contrapositive
4. Special cases
5. Boundary cases
6. Extreme cases
7. Counterexample search
8. Numerical experimentation
9. Analytic number theory
10. Complex analysis
11. Spectral theory
12. Operator theory
13. Geometry
14. Probability
15. Dynamical systems
16. Mathematical physics
17. Information theory
18. Cross-domain structural analogies

Cross-domain analogies are hypothesis-generation tools only.

Do not claim that a physical analogy proves a mathematical statement.

Try to falsify your own idea.

Identify the weakest unresolved step.

Explain what would have to be proven for the approach to succeed.

Prefer a genuinely different research direction instead of merely
rephrasing an already failed approach.

============================================================
OUTPUT
============================================================

Return ONLY valid JSON.

Use exactly these fields:

{
  "title": "string",
  "research_question": "string",
  "approach": "string",
  "known_facts": [],
  "hypotheses": [],
  "assumptions": [],
  "proof_strategy": [],
  "counterexample_strategy": [],
  "numerical_experiments": [],
  "critical_gap": "string",
  "failure_conditions": [],
  "next_steps": [],
  "confidence": 0.0,
  "status": "candidate"
}

confidence must be between 0 and 1.

Allowed status values:

candidate
promising
uncertain
rejected
needs_verification

Do not use "proven" unless a complete mathematical proof is actually
present and verified.

Produce ONE research candidate.
EOF

          echo "Research prompt created."


      # ==========================================================
      # STEP 10-6
      # Call OpenRouter
      # ==========================================================

      - name: Run research AI
        id: ai
        if: steps.find_job.outputs.job_found == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail

          echo "Preparing OpenRouter request..."

          python3 - <<'PY'
          import json

          prompt = open(
              "research_prompt.txt",
              "r",
              encoding="utf-8"
          ).read()

          body = {
              "model": "deepseek/deepseek-r1:free",
              "messages": [
                  {
                      "role": "system",
                      "content": (
                          "You are a rigorous mathematics research "
                          "engine. Return JSON only."
                      )
                  },
                  {
                      "role": "user",
                      "content": prompt
                  }
              ],
              "temperature": 0.2,
              "max_tokens": 12000
          }

          with open(
              "openrouter_request.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  body,
                  f,
                  ensure_ascii=False
              )

          PY

          RESPONSE_FILE="$(mktemp)"

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --output "${RESPONSE_FILE}" \
              --write-out "%{http_code}" \
              --request POST \
              --url "https://openrouter.ai/api/v1/chat/completions" \
              --header "Authorization: Bearer ${OPENROUTER_API_KEY}" \
              --header "Content-Type: application/json" \
              --header "HTTP-Referer: https://github.com/" \
              --header "X-Title: Autonomous Mathematics Research Lab" \
              --data-binary "@openrouter_request.json"
          )"

          echo "OpenRouter HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            echo "ERROR: OpenRouter request failed."
            cat "${RESPONSE_FILE}"
            exit 1
          fi

          python3 - "${RESPONSE_FILE}" <<'PY'
          import json
          import sys

          filename = sys.argv[1]

          with open(
              filename,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          choices = data.get("choices") or []

          if not choices:
              raise RuntimeError(
                  "OpenRouter returned no choices."
              )

          message = choices[0].get("message") or {}

          content = message.get("content")

          if not content:
              raise RuntimeError(
                  "OpenRouter returned empty content."
              )

          with open(
              "ai_result_raw.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(content)

          print("AI response received.")

          PY


      # ==========================================================
      # STEP 10-7
      # Validate AI result
      # ==========================================================

      - name: Validate AI research result
        if: steps.find_job.outputs.job_found == 'true'
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import re

          raw = open(
              "ai_result_raw.txt",
              "r",
              encoding="utf-8"
          ).read().strip()

          # Remove optional markdown fences.
          raw = re.sub(
              r"^```json\s*",
              "",
              raw,
              flags=re.IGNORECASE
          )

          raw = re.sub(
              r"^```\s*",
              "",
              raw
          )

          raw = re.sub(
              r"\s*```$",
              "",
              raw
          )

          data = json.loads(raw)

          required = [
              "title",
              "research_question",
              "approach",
              "known_facts",
              "hypotheses",
              "assumptions",
              "proof_strategy",
              "counterexample_strategy",
              "numerical_experiments",
              "critical_gap",
              "failure_conditions",
              "next_steps",
              "confidence",
              "status"
          ]

          for field in required:
              if field not in data:
                  raise RuntimeError(
                      f"Missing field: {field}"
                  )

          confidence = float(
              data["confidence"]
          )

          if confidence < 0 or confidence > 1:
              raise RuntimeError(
                  "confidence must be between 0 and 1"
              )

          allowed_status = {
              "candidate",
              "promising",
              "uncertain",
              "rejected",
              "needs_verification"
          }

          if data["status"] not in allowed_status:
              raise RuntimeError(
                  f"Invalid status: {data['status']}"
              )

          with open(
              "research_result.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("AI research result is valid.")
          print("Title:", data["title"])
          print("Status:", data["status"])
          print("Confidence:", data["confidence"])

          PY


      # ==========================================================
      # STEP 10-8
      # Save result to Supabase
      # ==========================================================

      - name: Save research result
        if: steps.find_job.outputs.job_found == 'true'
        env:
          SUPABASE_BASE_URL: ${{ steps.supabase.outputs.base_url }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ steps.find_job.outputs.job_id }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          with open(
              "research_result.json",
              "r",
              encoding="utf-8"
          ) as f:
              result = json.load(f)

          patch = {
              "payload": {
                  "research_result": result,
                  "research_engine_version": "step-10-v2",
                  "research_completed_at":
                      datetime.now(
                          timezone.utc
                      ).isoformat()
              }
          }

          with open(
              "supabase_patch.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  patch,
                  f,
                  ensure_ascii=False
              )

          PY

          API_URL="${SUPABASE_BASE_URL}/rest/v1/research_jobs?id=eq.${JOB_ID}"

          RESPONSE_FILE="$(mktemp)"

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --output "${RESPONSE_FILE}" \
              --write-out "%{http_code}" \
              --request PATCH \
              --url "${API_URL}" \
              --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Content-Type: application/json" \
              --header "Prefer: return=representation" \
              --data-binary "@supabase_patch.json"
          )"

          echo "Supabase HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            echo "ERROR: Failed to save research result."
            cat "${RESPONSE_FILE}"
            exit 1
          fi

          echo "Research result saved."


      # ==========================================================
      # STEP 10-9
      # Mark completed
      # ==========================================================

      - name: Mark job completed
        if: steps.find_job.outputs.job_found == 'true'
        env:
          SUPABASE_BASE_URL: ${{ steps.supabase.outputs.base_url }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ steps.find_job.outputs.job_id }}
        run: |
          set -euo pipefail

          cat > completion.json <<EOF
          {
            "status": "completed",
            "completed_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

          API_URL="${SUPABASE_BASE_URL}/rest/v1/research_jobs?id=eq.${JOB_ID}"

          RESPONSE_FILE="$(mktemp)"

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --output "${RESPONSE_FILE}" \
              --write-out "%{http_code}" \
              --request PATCH \
              --url "${API_URL}" \
              --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Content-Type: application/json" \
              --header "Prefer: return=representation" \
              --data-binary "@completion.json"
          )"

          echo "Supabase HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            echo "ERROR: Could not mark job completed."
            cat "${RESPONSE_FILE}"
            exit 1
          fi

          echo "Research job completed successfully."


      # ==========================================================
      # STEP 10-10
      # No job
      # ==========================================================

      - name: No running job
        if: steps.find_job.outputs.job_found != 'true'
        run: |
          echo "No running research job was found."
          echo "This is not an error."


      # ==========================================================
      # STEP 10-11
      # Finish
      # ==========================================================

      - name: Finish research cycle
        run: |
          echo "=========================================="
          echo "STEP 10 research cycle finished."
          echo "=========================================="
