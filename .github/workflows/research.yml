name: Math Research Lab

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

# 同じWorkerが同時に走って同じジョブを取るのを防ぐ
concurrency:
  group: math-research-worker
  cancel-in-progress: false

jobs:

  research:

    name: Autonomous Mathematics Research Worker

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # =========================================================
      # 1. キューから最優先ジョブを1件取得
      # =========================================================

      - name: Get queued research job

        id: get_job

        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |

          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/jobs.json \
            --write-out "%{http_code}" \
            --request GET \
            --url "${BASE_URL}/rest/v1/research_jobs?select=*&status=eq.queued&order=priority.desc,created_at.asc&limit=1" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json")

          echo "HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" != "200" ]; then
            cat /tmp/jobs.json
            exit 1
          fi

          python3 <<'PY'

          import json

          with open("/tmp/jobs.json", "r", encoding="utf-8") as f:
              jobs = json.load(f)

          if not jobs:

              print("Queue empty.")

              with open("/tmp/job_exists", "w") as f:
                  f.write("false")

          else:

              job = jobs[0]

              print("Queued job:", job["id"])

              with open("/tmp/job.json", "w", encoding="utf-8") as f:
                  json.dump(
                      job,
                      f,
                      ensure_ascii=False
                  )

              with open("/tmp/job_exists", "w") as f:
                  f.write("true")

          PY

          echo "job_exists=$(cat /tmp/job_exists)" >> "$GITHUB_OUTPUT"


      # =========================================================
      # 2. ジョブ開始
      # =========================================================

      - name: Start job

        if: steps.get_job.outputs.job_exists == 'true'

        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |

          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          JOB_ID=$(python3 -c \
            'import json; print(json.load(open("/tmp/job.json"))["id"])')

          STARTED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/start.json \
            --write-out "%{http_code}" \
            --request PATCH \
            --url "${BASE_URL}/rest/v1/research_jobs?id=eq.${JOB_ID}&status=eq.queued" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=representation" \
            --data "{\"status\":\"running\",\"started_at\":\"${STARTED_AT}\"}")

          echo "Start status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            cat /tmp/start.json
            exit 1
          fi


      # =========================================================
      # 3. 過去研究結果取得
      #
      # AIに「今まで何をやったか」を渡す
      # =========================================================

      - name: Load research memory

        if: steps.get_job.outputs.job_exists == 'true'

        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |

          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          PROJECT_ID=$(python3 -c \
            'import json; print(json.load(open("/tmp/job.json"))["project_id"])')

          curl \
            --silent \
            --show-error \
            --fail \
            --url "${BASE_URL}/rest/v1/research_results?select=id,title,hypothesis,content,evaluation,confidence_level,status,created_at&project_id=eq.${PROJECT_ID}&order=created_at.desc&limit=40" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            > /tmp/history.json

          # 人間が登録した研究メモ
          curl \
            --silent \
            --show-error \
            --fail \
            --url "${BASE_URL}/rest/v1/research_memos?select=id,title,content,created_at&project_id=eq.${PROJECT_ID}&order=created_at.desc&limit=30" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            > /tmp/memos.json

          echo "Research memory loaded."


      # =========================================================
      # 4. 研究プロンプト構築
      #
      # ここが「リーマン予想について継続的に考える」部分
      # =========================================================

      - name: Build autonomous research prompt

        if: steps.get_job.outputs.job_exists == 'true'

        run: |

          set -e

          python3 <<'PY'

          import json
          import textwrap

          with open("/tmp/job.json", "r", encoding="utf-8") as f:
              job = json.load(f)

          with open("/tmp/history.json", "r", encoding="utf-8") as f:
              history = json.load(f)

          with open("/tmp/memos.json", "r", encoding="utf-8") as f:
              memos = json.load(f)

          payload = job.get("payload") or {}

          theme = str(
              payload.get("theme", "")
          ).strip()

          if not theme:
              raise SystemExit(
                  "Research theme is empty."
              )

          history_text = json.dumps(
              history,
              ensure_ascii=False,
              indent=2
          )

          memo_text = json.dumps(
              memos,
              ensure_ascii=False,
              indent=2
          )

          prompt = f"""

You are the autonomous research engine of a rigorous mathematical research laboratory.

==================================================
PRIMARY RESEARCH THEME
==================================================

{theme}

==================================================
MISSION
==================================================

Do NOT simply answer the question.

Perform an actual research cycle.

The goal is to generate a mathematically meaningful,
testable research direction that can be continued by
future research cycles.

If the topic is an unresolved problem such as the
Riemann Hypothesis:

- Do NOT stop with "it is unsolved".
- Do NOT claim a proof.
- Do NOT pretend that a known theorem is a new result.
- Continue exploring concrete mathematical approaches.
- Clearly separate known mathematics from new hypotheses.

==================================================
PREVIOUS RESEARCH MEMORY
==================================================

{history_text}

==================================================
HUMAN RESEARCH MEMOS
==================================================

{memo_text}

==================================================
ANTI-REDISCOVERY RULES
==================================================

You must actively avoid merely reproducing known mathematics.

Before proposing a direction:

1. Compare it against previous research.
2. Identify whether the idea is already contained
   in the previous research.
3. Identify whether it is simply a standard theorem
   applied in an obvious way.
4. Identify whether the route has already failed.
5. Identify whether the route has already been attempted
   three or more times.
6. If it is too similar to a previous route,
   reject it and generate another direction.
7. Prefer a genuinely different formulation,
   transformation, invariant, decomposition,
   computational experiment, or connection.

Never call something "new" merely because you generated it.

==================================================
MANDATORY MATHEMATICAL CHECKS
==================================================

For every promising hypothesis, consider as applicable:

A. Direct proof

B. Proof by contradiction

C. Contrapositive

D. Mathematical induction

E. Reverse reasoning

F. Necessary-condition analysis

G. Sufficient-condition analysis

H. Boundary and exceptional cases

I. Special cases

J. Counterexample search

K. Numerical experimentation

L. Symbolic consistency

M. Dimensional / structural consistency where applicable

N. Alternative formulation

O. Cross-domain analogy

P. Attempt to falsify the hypothesis

Do not use a method merely for appearance.
Only use methods that actually apply.

==================================================
COUNTEREXAMPLE REQUIREMENT
==================================================

For every conjectural statement:

Try actively to construct a counterexample.

Test:

- small cases
- extreme cases
- boundary cases
- degenerate cases
- symmetric cases
- asymmetric cases
- known difficult cases

If a counterexample is found,
the hypothesis must NOT be marked promising.

==================================================
KNOWN MATHEMATICS REQUIREMENT
==================================================

Separate:

KNOWN_FACTS

from

HYPOTHESIS

from

EVIDENCE

from

PROOF

from

SPECULATION

Numerical agreement is NOT proof.

A known theorem is NOT a new discovery.

If a claim depends on literature,
do not invent a citation.

If literature cannot be verified in this environment,
say so explicitly.

==================================================
ROUTE REPETITION
==================================================

A research route means the essential mathematical strategy,
not merely different wording.

If essentially the same route has already appeared
three or more times:

BLOCK THAT ROUTE.

Do not continue making superficial variations.

Instead generate a substantially different approach.

==================================================
SELF-CRITICISM
==================================================

Before finalizing the result, ask:

1. What is the weakest logical step?
2. What assumption is unproved?
3. What could make this approach fail?
4. Is this already known mathematics?
5. Did I accidentally turn evidence into proof?
6. Did I accidentally assume the desired conclusion?
7. Can a counterexample exist?
8. Is the proposed next step actually executable?

==================================================
CONTINUOUS RESEARCH
==================================================

This is one cycle of a potentially infinite research process.

Do NOT conclude that the overall research is finished
unless a genuine mathematical reason exists.

Instead provide:

- current conclusion
- strongest unresolved gap
- next research direction
- alternative research direction

A future worker will continue from this result.

==================================================
POSITIVE RESULT REVERIFICATION
==================================================

If previous research contains an ⭕️ result:

Do NOT blindly trust it.

Attempt independent verification.

Prefer a different proof strategy when possible.

For example:

- if original route used direct proof,
  try contradiction;
- if possible, try contrapositive;
- if a recursive structure exists,
  consider induction;
- if numerical evidence was used,
  attempt symbolic justification.

An ⭕️ result remains provisional until independently
reverified.

==================================================
OUTPUT
==================================================

Return ONLY valid JSON.

Required keys:

title
hypothesis
research_question
known_facts
assumptions
evidence
approach
proof_strategy
counterexample_strategy
cross_domain_connection
critical_gap
failure_analysis
novelty_check
route_signature
next_steps
alternative_next_steps
reverification_plan
status
confidence
continue_research

Allowed status:

candidate
promising
uncertain
rejected
needs_verification

confidence:

0.0 to 1.0

continue_research:

true or false

IMPORTANT:

For an unresolved problem such as the Riemann Hypothesis,
continue_research should normally be true unless there is
a technical reason to stop this research branch.

"""

          with open(
              "/tmp/prompt.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  textwrap.dedent(prompt)
              )

          print(
              "Autonomous research prompt created."
          )

          PY


      # =========================================================
      # 5. キャンセル確認
      # =========================================================

      - name: Check cancellation before AI

        if: steps.get_job.outputs.job_exists == 'true'

        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |

          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          JOB_ID=$(python3 -c \
            'import json; print(json.load(open("/tmp/job.json"))["id"])')

          STATUS=$(curl \
            --silent \
            --show-error \
            --fail \
            --url "${BASE_URL}/rest/v1/research_jobs?select=status&id=eq.${JOB_ID}" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" |
            python3 -c \
            'import json,sys; a=json.load(sys.stdin); print(a[0]["status"] if a else "missing")')

          if [ "${STATUS}" != "running" ]; then
            echo "Job is no longer running."
            exit 1
          fi


      # =========================================================
      # 6. OpenRouter
      # =========================================================

      - name: Call OpenRouter

        if: steps.get_job.outputs.job_exists == 'true'

        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

        run: |

          set -e

          python3 <<'PY'

          import json

          with open(
              "/tmp/prompt.txt",
              "r",
              encoding="utf-8"
          ) as f:
              prompt = f.read()

          request = {

              "model":
                  "nvidia/nemotron-3-ultra-550b-a55b:free",

              "messages": [

                  {
                      "role": "system",
                      "content":
                          "You are a rigorous autonomous mathematics research AI. "
                          "Never fabricate facts, proofs, citations, or discoveries. "
                          "Return JSON only."
                  },

                  {
                      "role": "user",
                      "content": prompt
                  }

              ],

              "temperature": 0.2,

              "max_tokens": 10000

          }

          with open(
              "/tmp/request.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  request,
                  f,
                  ensure_ascii=False
              )

          PY

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/ai.json \
            --write-out "%{http_code}" \
            --request POST \
            --url "https://openrouter.ai/api/v1/chat/completions" \
            --header "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/request.json)

          echo "OpenRouter HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            cat /tmp/ai.json
            exit 1
          fi

          python3 <<'PY'

          import json

          with open(
              "/tmp/ai.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          content = (
              data
              .get("choices", [{}])[0]
              .get("message", {})
              .get("content")
          )

          if not content:
              raise SystemExit(
                  "OpenRouter returned no content."
              )

          with open(
              "/tmp/ai_text.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(content)

          PY


      # =========================================================
      # 7. AI結果検証
      # =========================================================

      - name: Validate AI result

        if: steps.get_job.outputs.job_exists == 'true'

        run: |

          set -e

          python3 <<'PY'

          import json
          import re

          with open(
              "/tmp/ai_text.txt",
              "r",
              encoding="utf-8"
          ) as f:
              raw = f.read().strip()

          raw = re.sub(
              r"^```(?:json)?\s*",
              "",
              raw,
              flags=re.I
          )

          raw = re.sub(
              r"\s*```$",
              "",
              raw
          )

          try:

              result = json.loads(raw)

          except json.JSONDecodeError:

              match = re.search(
                  r"\{.*\}",
                  raw,
                  re.S
              )

              if not match:
                  raise SystemExit(
                      "AI JSON not found."
                  )

              result = json.loads(
                  match.group(0)
              )

          confidence_raw = \
              result.get(
                  "confidence",
                  0
              )

          try:
              confidence = float(
                  confidence_raw
              )
          except:
              confidence = 0.0

          confidence = max(
              0.0,
              min(
                  1.0,
                  confidence
              )
          )

          status = str(
              result.get(
                  "status",
                  "uncertain"
              )
          ).lower().strip()

          # --------------------------------------------------
          # 評価
          # --------------------------------------------------

          if (
              status == "promising"
              and confidence >= 0.8
          ):
              evaluation = "⭕️"

          elif status == "rejected":

              evaluation = "❌"

          else:

              evaluation = "△"

          # --------------------------------------------------
          # 研究結果
          # --------------------------------------------------

          with open(
              "/tmp/job.json",
              "r",
              encoding="utf-8"
          ) as f:
              job = json.load(f)

          content = {

              "research_question":
                  result.get(
                      "research_question"
                  ),

              "known_facts":
                  result.get(
                      "known_facts",
                      []
                  ),

              "assumptions":
                  result.get(
                      "assumptions",
                      []
                  ),

              "evidence":
                  result.get(
                      "evidence",
                      []
                  ),

              "approach":
                  result.get(
                      "approach",
                      []
                  ),

              "proof_strategy":
                  result.get(
                      "proof_strategy",
                      []
                  ),

              "counterexample_strategy":
                  result.get(
                      "counterexample_strategy",
                      []
                  ),

              "cross_domain_connection":
                  result.get(
                      "cross_domain_connection",
                      []
                  ),

              "critical_gap":
                  result.get(
                      "critical_gap"
                  ),

              "failure_analysis":
                  result.get(
                      "failure_analysis",
                      []
                  ),

              "novelty_check":
                  result.get(
                      "novelty_check",
                      ""
                  ),

              "route_signature":
                  result.get(
                      "route_signature",
                      ""
                  ),

              "next_steps":
                  result.get(
                      "next_steps",
                      []
                  ),

              "alternative_next_steps":
                  result.get(
                      "alternative_next_steps",
                      []
                  ),

              "reverification_plan":
                  result.get(
                      "reverification_plan",
                      []
                  ),

              "source_job_id":
                  job["id"],

              "research_configuration":
                  job.get(
                      "payload",
                      {}
                  )

          }

          record = {

              "project_id":
                  job["project_id"],

              "title":
                  str(
                      result.get(
                          "title",
                          "AI数学研究"
                      )
                  ),

              "hypothesis":
                  str(
                      result.get(
                          "hypothesis",
                          ""
                      )
                  ),

              "content":
                  json.dumps(
                      content,
                      ensure_ascii=False
                  ),

              "status":
                  "pending",

              "evaluation":
                  evaluation,

              "confidence_level":
                  round(
                      confidence * 5
                  ),

              "is_human_saved":
                  False

          }

          with open(
              "/tmp/result.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  record,
                  f,
                  ensure_ascii=False
              )

          # 次の研究ジョブに渡す情報
          continuation = {

              "theme":
                  job
                  .get("payload", {})
                  .get("theme", ""),

              "source":
                  "autonomous_continuation",

              "mode":
                  "continuous_mathematical_research",

              "parent_job_id":
                  job["id"],

              "parent_evaluation":
                  evaluation,

              "route_signature":
                  result.get(
                      "route_signature",
                      ""
                  ),

              "next_steps":
                  result.get(
                      "next_steps",
                      []
                  ),

              "alternative_next_steps":
                  result.get(
                      "alternative_next_steps",
                      []
                  ),

              "reverification":
                  evaluation == "⭕️"

          }

          with open(
              "/tmp/continuation.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  continuation,
                  f,
                  ensure_ascii=False
              )

          print(
              "Evaluation:",
              evaluation
          )

          print(
              "Confidence:",
              confidence
          )

          PY


      # =========================================================
      # 8. 保存前キャンセル確認
      # =========================================================

      - name: Check cancellation before save

        if: steps.get_job.outputs.job_exists == 'true'

        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |

          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          JOB_ID=$(python3 -c \
            'import json; print(json.load(open("/tmp/job.json"))["id"])')

          STATUS=$(curl \
            --silent \
            --show-error \
            --fail \
            --url "${BASE_URL}/rest/v1/research_jobs?select=status&id=eq.${JOB_ID}" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" |
            python3 -c \
            'import json,sys; a=json.load(sys.stdin); print(a[0]["status"] if a else "missing")')

          if [ "${STATUS}" != "running" ]; then
            echo "Cancelled before save."
            exit 1
          fi


      # =========================================================
      # 9. 研究結果保存
      # =========================================================

      - name: Save research result

        if: steps.get_job.outputs.job_exists == 'true'

        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |

          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/save.json \
            --write-out "%{http_code}" \
            --request POST \
            --url "${BASE_URL}/rest/v1/research_results" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=minimal" \
            --data-binary @/tmp/result.json)

          echo "Result save status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            cat /tmp/save.json
            exit 1
          fi

          echo "RESEARCH RESULT SAVED."


      # =========================================================
      # 10. 次の研究ジョブを自動生成
      #
      # ★ここで「1件出たら終了」を防ぐ
      # =========================================================

      - name: Queue next research cycle

        if: steps.get_job.outputs.job_exists == 'true' && success()

        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |

          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          python3 <<'PY'

          import json

          with open(
              "/tmp/job.json",
              "r",
              encoding="utf-8"
          ) as f:
              job = json.load(f)

          with open(
              "/tmp/continuation.json",
              "r",
              encoding="utf-8"
          ) as f:
              continuation = json.load(f)

          # 次のジョブ
          next_job = {

              "project_id":
                  job["project_id"],

              "job_type":
                  "research_cycle",

              "status":
                  "queued",

              "priority":
                  5,

              "payload":
                  continuation

          }

          with open(
              "/tmp/next_job.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  next_job,
                  f,
                  ensure_ascii=False
              )

          PY

          curl \
            --silent \
            --show-error \
            --fail \
            --request POST \
            --url "${BASE_URL}/rest/v1/research_jobs" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/next_job.json

          echo "NEXT RESEARCH CYCLE QUEUED."


      # =========================================================
      # 11. 現在のジョブ完了
      # =========================================================

      - name: Complete current job

        if: steps.get_job.outputs.job_exists == 'true' && success()

        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |

          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          JOB_ID=$(python3 -c \
            'import json; print(json.load(open("/tmp/job.json"))["id"])')

          FINISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          curl \
            --silent \
            --show-error \
            --fail \
            --request PATCH \
            --url "${BASE_URL}/rest/v1/research_jobs?id=eq.${JOB_ID}&status=eq.running" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --data "{\"status\":\"completed\",\"finished_at\":\"${FINISHED_AT}\"}"

          echo "CURRENT JOB COMPLETED."


      # =========================================================
      # 12. 失敗処理
      # =========================================================

      - name: Mark failed

        if: steps.get_job.outputs.job_exists == 'true' && failure()

        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          JOB_ID=$(python3 -c \
            'import json; print(json.load(open("/tmp/job.json"))["id"])')

          FINISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          curl \
            --silent \
            --show-error \
            --request PATCH \
            --url "${BASE_URL}/rest/v1/research_jobs?id=eq.${JOB_ID}&status=eq.running" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --data "{\"status\":\"failed\",\"error_message\":\"Research worker failed\",\"finished_at\":\"${FINISHED_AT}\"}" \
            || true

          echo "JOB MARKED FAILED."
