name: Research AI Lab

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"


jobs:

  # ==========================================================
  # 1. Edge Functions Deploy
  # ==========================================================

  deploy-functions:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Supabase CLI
      # --------------------------------------------------------

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest


      - name: Check Supabase CLI
        run: |
          set -e

          echo "======================================"
          echo "Supabase CLI"
          echo "======================================"

          supabase --version

          echo "======================================"


      # --------------------------------------------------------
      # Check Secrets
      # --------------------------------------------------------

      - name: Check Supabase secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |
          set -e

          echo "======================================"
          echo "Checking Supabase configuration"
          echo "======================================"


          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ERROR: SUPABASE_ACCESS_TOKEN is missing"
            exit 1
          fi


          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "ERROR: SUPABASE_PROJECT_REF is missing"
            exit 1
          fi


          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: SUPABASE_URL is missing"
            exit 1
          fi


          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "ERROR: SUPABASE_SERVICE_ROLE_KEY is missing"
            exit 1
          fi


          echo "SUPABASE_ACCESS_TOKEN: configured"
          echo "SUPABASE_PROJECT_REF: configured"
          echo "SUPABASE_URL: configured"
          echo "SUPABASE_SERVICE_ROLE_KEY: configured"


          echo "======================================"


      # --------------------------------------------------------
      # Link Supabase
      # --------------------------------------------------------

      - name: Link Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

        run: |
          set -e

          echo "======================================"
          echo "Linking Supabase project"
          echo "======================================"

          supabase link \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

          echo "Supabase project linked."

          echo "======================================"


      # ========================================================
      # Deploy kick-worker
      # ========================================================

      - name: Deploy kick-worker
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

        run: |
          set -e

          echo "======================================"
          echo "Deploying kick-worker"
          echo "======================================"


          if [ ! -f "supabase/functions/kick-worker/index.ts" ]; then
            echo "ERROR: kick-worker/index.ts does not exist"
            exit 1
          fi


          echo "kick-worker/index.ts found."


          supabase functions deploy kick-worker \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt


          echo "kick-worker deployed successfully."

          echo "======================================"


      # ========================================================
      # Deploy smart-handler
      # ========================================================

      - name: Deploy smart-handler
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

        run: |
          set -e

          echo "======================================"
          echo "Deploying smart-handler"
          echo "======================================"


          if [ ! -f "supabase/functions/smart-handler/index.ts" ]; then
            echo "ERROR: smart-handler/index.ts does not exist"
            exit 1
          fi


          echo "smart-handler/index.ts found."


          supabase functions deploy smart-handler \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt


          echo "smart-handler deployed successfully."

          echo "======================================"


      # --------------------------------------------------------
      # Deployment Complete
      # --------------------------------------------------------

      - name: Deployment finished
        run: |

          echo "======================================"
          echo "Supabase Functions Deployment Complete"
          echo "======================================"

          echo "kick-worker: deployed"
          echo "smart-handler: deployed"

          echo "======================================"


  # ==========================================================
  # 2. Background Worker
  # ==========================================================

  run-worker:

    needs:
      - deploy-functions

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Start Worker
      # --------------------------------------------------------

      - name: Start Worker
        run: |

          echo "======================================"
          echo "Research AI Lab Worker"
          echo "======================================"

          echo "Starting kick-worker..."

          echo "======================================"


      # ========================================================
      # Call kick-worker
      # ========================================================

      - name: Call kick-worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |

          set -e


          echo "======================================"
          echo "Checking Worker configuration"
          echo "======================================"


          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: SUPABASE_URL is missing"
            exit 1
          fi


          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "ERROR: SUPABASE_SERVICE_ROLE_KEY is missing"
            exit 1
          fi


          echo "SUPABASE_URL: configured"
          echo "SUPABASE_SERVICE_ROLE_KEY: configured"


          echo "======================================"
          echo "Calling kick-worker"
          echo "======================================"


          RESPONSE_FILE="worker_response.json"


          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            --request POST \
            "${SUPABASE_URL}/functions/v1/kick-worker" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --data '{}'
          )


          echo ""
          echo "HTTP STATUS: ${HTTP_STATUS}"
          echo ""


          echo "======================================"
          echo "kick-worker response"
          echo "======================================"


          if [ -f "$RESPONSE_FILE" ]; then
            cat "$RESPONSE_FILE"
          else
            echo "No response body."
          fi


          echo ""
          echo "======================================"


          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then

            echo "Worker request failed."
            echo "HTTP STATUS: ${HTTP_STATUS}"

            exit 1

          fi


          echo "Worker request succeeded."

          echo "======================================"


      # --------------------------------------------------------
      # Worker Finished
      # --------------------------------------------------------

      - name: Worker finished
        if: always()
        run: |

          echo "======================================"
          echo "Research AI Lab worker finished."
          echo "======================================"
