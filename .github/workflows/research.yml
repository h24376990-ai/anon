      # ========================================
      # 5. research_results に保存
      # ========================================
      - name: Save research result
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          python3 - <<'PY'
          import json
          import math

          with open("/tmp/research_job.json", "r", encoding="utf-8") as f:
              job = json.load(f)

          with open("/tmp/validated_result.json", "r", encoding="utf-8") as f:
              result = json.load(f)

          confidence = float(result.get("confidence", 0))

          # AI confidence は 0.0〜1.0
          if confidence < 0:
              confidence = 0

          if confidence > 1:
              confidence = 1

          # DBのconfidence_levelは0〜5
          confidence_level = round(confidence * 5)

          if confidence_level < 0:
              confidence_level = 0

          if confidence_level > 5:
              confidence_level = 5

          # 研究全体の詳細
          content = {
              "research_question": result.get("research_question"),
              "known_facts": result.get("known_facts", []),
              "assumptions": result.get("assumptions", []),
              "approach": result.get("approach", []),
              "proof_strategy": result.get("proof_strategy", []),
              "counterexample_strategy": result.get("counterexample_strategy", []),
              "cross_domain_connection": result.get("cross_domain_connection", []),
              "critical_gap": result.get("critical_gap"),
              "next_steps": result.get("next_steps", []),
              "source_job_id": job.get("id"),
              "research_configuration": job.get("payload", {})
          }

          # AIによる評価
          evaluation = {
              "ai_status": result.get("status"),
              "ai_confidence": result.get("confidence"),
              "critical_gap": result.get("critical_gap"),
              "source_job_id": job.get("id")
          }

          record = {
              "project_id": job["project_id"],
              "title": result["title"],
              "hypothesis": result["hypothesis"],
              "content": json.dumps(content, ensure_ascii=False),
              "status": "pending",
              "evaluation": json.dumps(evaluation, ensure_ascii=False),
              "confidence_level": confidence_level,
              "is_human_saved": False
          }

          with open("/tmp/research_result_record.json", "w", encoding="utf-8") as f:
              json.dump(record, f, ensure_ascii=False)

          print("Prepared research_results record.")
          print("Project ID:", record["project_id"])
          print("Title:", record["title"])
          print("AI confidence:", confidence)
          print("DB confidence_level:", record["confidence_level"])
          print("Status:", record["status"])
          PY

          echo "Saving research result to Supabase..."

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/save_response.json \
            --write-out "%{http_code}" \
            --request POST \
            --url "${BASE_URL}/rest/v1/research_results" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=representation" \
            --data-binary @/tmp/research_result_record.json)

          echo "Supabase insert HTTP status: ${HTTP_STATUS}"

          cat /tmp/save_response.json

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
              echo "Failed to save research result."
              exit 1
          fi

          echo ""
          echo "========================================"
          echo "RESEARCH RESULT SAVED SUCCESSFULLY"
          echo "========================================"
