name: Math Research Lab

on:
  workflow_dispatch:

  repository_dispatch:
    types:
      - start-research

  schedule:
    # 5分ごとに研究キューを確認
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:

  research:
    name: AI Mathematical Research Worker
    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:

      # =========================================================
      # 0. 基本環境
      # =========================================================

      - name: Initialize worker
        run: |
          set -e

          echo "======================================"
          echo " Math Research Lab Worker"
          echo "======================================"

          python3 --version
          curl --version | head -n 1

          test -n "${SUPABASE_URL}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY}"
          test -n "${OPENROUTER_API_KEY}"

          echo "Environment variables detected."


      # =========================================================
      # 1. キューからジョブを1件取得
      # =========================================================

      - name: Get queued research job
        id: get_job
        run: |
          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/jobs.json \
            --write-out "%{http_code}" \
            --request GET \
            --url "${BASE_URL}/rest/v1/research_jobs?select=*&status=eq.queued&order=priority.desc,created_at.asc&limit=1" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json")

          echo "Queue HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" != "200" ]; then
            cat /tmp/jobs.json
            exit 1
          fi

          python3 <<'PY'
          import json

          with open("/tmp/jobs.json", "r", encoding="utf-8") as f:
              jobs = json.load(f)

          if not jobs:
              echo = "Queue empty."
              print(echo)

              with open("/tmp/job_exists", "w", encoding="utf-8") as f:
                  f.write("false")

          else:
              job = jobs[0]

              print("Candidate job:")
              print("ID:", job.get("id"))
              print("Project:", job.get("project_id"))
              print("Priority:", job.get("priority"))
              print("Type:", job.get("job_type"))

              with open("/tmp/job.json", "w", encoding="utf-8") as f:
                  json.dump(job, f, ensure_ascii=False)

              with open("/tmp/job_exists", "w", encoding="utf-8") as f:
                  f.write("true")
          PY

          echo "job_exists=$(cat /tmp/job_exists)" >> "$GITHUB_OUTPUT"


      # =========================================================
      # 2. ジョブ取得
      #
      # status=queued を条件にすることで、
      # 複数Workerが同時に起動しても同じジョブを二重取得しない。
      # =========================================================

      - name: Claim research job
        id: claim_job
        if: steps.get_job.outputs.job_exists == 'true'
        run: |
          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          JOB_ID=$(python3 -c \
            'import json; print(json.load(open("/tmp/job.json", encoding="utf-8"))["id"])')

          STARTED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/claim.json \
            --write-out "%{http_code}" \
            --request PATCH \
            --url "${BASE_URL}/rest/v1/research_jobs?id=eq.${JOB_ID}&status=eq.queued" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=representation" \
            --data "{\"status\":\"running\",\"started_at\":\"${STARTED_AT}\"}")

          echo "Claim HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            cat /tmp/claim.json
            exit 1
          fi

          python3 <<'PY'
          import json

          with open("/tmp/claim.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if not data:
              print("Another worker claimed this job first.")

              with open("/tmp/job_claimed", "w", encoding="utf-8") as f:
                  f.write("false")

          else:
              print("Job successfully claimed.")

              with open("/tmp/job_claimed", "w", encoding="utf-8") as f:
                  f.write("true")
          PY

          echo "job_claimed=$(cat /tmp/job_claimed)" >> "$GITHUB_OUTPUT"


      # =========================================================
      # 3. 研究コンテキスト作成
      # =========================================================

      - name: Build research context
        if: steps.claim_job.outputs.job_claimed == 'true'
        run: |
          set -e

          python3 <<'PY'
          import json

          with open("/tmp/job.json", "r", encoding="utf-8") as f:
              job = json.load(f)

          payload = job.get("payload") or {}

          theme = str(payload.get("theme", "")).strip()

          if not theme:
              raise SystemExit("Research theme is empty.")

          job_type = str(
              job.get("job_type") or
              payload.get("mode") or
              "research"
          )

          context = {
              "theme": theme,
              "source": payload.get("source"),
              "mode": payload.get("mode"),
              "job_type": job_type,
              "project_id": job.get("project_id"),
              "job_id": job.get("id"),
              "payload": payload
          }

          with open("/tmp/research_context.json", "w", encoding="utf-8") as f:
              json.dump(context, f, ensure_ascii=False, indent=2)

          print("======================================")
          print("Research theme:")
          print(theme)
          print("Job type:")
          print(job_type)
          print("======================================")
          PY


      # =========================================================
      # 4. 過去研究100件
      # =========================================================

      - name: Load previous research
        if: steps.claim_job.outputs.job_claimed == 'true'
        run: |
          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          PROJECT_ID=$(python3 -c \
            'import json; print(json.load(open("/tmp/job.json", encoding="utf-8"))["project_id"])')

          curl \
            --silent \
            --show-error \
            --fail \
            --url "${BASE_URL}/rest/v1/research_results?select=id,title,hypothesis,content,evaluation,confidence_level,status,created_at&project_id=eq.${PROJECT_ID}&order=created_at.desc&limit=100" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            > /tmp/previous_results.json

          echo "Previous research loaded."

          python3 - <<'PY'
          import json

          with open("/tmp/previous_results.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print("Previous results:", len(data))
          PY


      # =========================================================
      # 5. AI研究メモ取得
      # =========================================================

      - name: Load research memory
        if: steps.claim_job.outputs.job_claimed == 'true'
        run: |
          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          PROJECT_ID=$(python3 -c \
            'import json; print(json.load(open("/tmp/job.json", encoding="utf-8"))["project_id"])')

          curl \
            --silent \
            --show-error \
            --fail \
            --url "${BASE_URL}/rest/v1/research_memos?select=id,title,content,created_at,updated_at&project_id=eq.${PROJECT_ID}&order=created_at.desc&limit=100" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            > /tmp/research_memos.json

          echo "Research memory loaded."

          python3 - <<'PY'
          import json

          with open("/tmp/research_memos.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print("Research memories:", len(data))
          PY


      # =========================================================
      # 6. AIメモリ構築
      # =========================================================

      - name: Build AI memory
        if: steps.claim_job.outputs.job_claimed == 'true'
        run: |
          set -e

          python3 <<'PY'
          import json

          with open("/tmp/previous_results.json", "r", encoding="utf-8") as f:
              results = json.load(f)

          with open("/tmp/research_memos.json", "r", encoding="utf-8") as f:
              memos = json.load(f)

          memory = {
              "previous_results": results[:100],
              "research_memos": memos[:100]
          }

          with open("/tmp/ai_memory.json", "w", encoding="utf-8") as f:
              json.dump(memory, f, ensure_ascii=False, indent=2)

          print("AI memory prepared.")
          PY


      # =========================================================
      # 7. 研究プロンプト
      # =========================================================

      - name: Build rigorous research prompt
        if: steps.claim_job.outputs.job_claimed == 'true'
        run: |
          set -e

          python3 <<'PY'
          import json

          with open("/tmp/job.json", "r", encoding="utf-8") as f:
              job = json.load(f)

          with open("/tmp/ai_memory.json", "r", encoding="utf-8") as f:
              memory = json.load(f)

          context = job.get("payload") or {}

          theme = str(context.get("theme", "")).strip()

          job_type = str(
              job.get("job_type") or
              context.get("mode") or
              "research"
          )

          previous_text = json.dumps(
              memory.get("previous_results", [])[:100],
              ensure_ascii=False,
              indent=2
          )

          memos_text = json.dumps(
              memory.get("research_memos", [])[:100],
              ensure_ascii=False,
              indent=2
          )

          independent_mode = (
              job_type == "independent_verification"
              or
              context.get("mode") == "independent_verification"
          )

          if independent_mode:
              mode_instruction = """
============================================================
INDEPENDENT DESTRUCTION / VERIFICATION MODE
============================================================

You are NOT allowed to simply agree with the previous result.

Your primary task is to TRY TO BREAK IT.

Independently reconstruct the argument.

Search for:

- hidden assumptions
- invalid implications
- circular reasoning
- unjustified limit exchanges
- invalid analytic continuation
- missing convergence conditions
- exceptional cases
- counterexamples
- incorrect use of known theorems
- numerical evidence being mistaken for proof
- dependence on an unproved statement

Try a genuinely different derivation.

If the original result fails, explicitly identify the failure.

If it survives, state exactly what was independently checked.

Do not protect the previous result.
""" 
          else:
              mode_instruction = """
============================================================
PRIMARY RESEARCH MODE
============================================================

Explore the problem actively.

Do not stop after one result.

A result is a branching point for further research.
"""

          prompt = f"""
You are the autonomous mathematical research engine of Research AI Lab.

TARGET:
{theme}

RESEARCH MODE:
{job_type}

{mode_instruction}

============================================================
ABSOLUTE RULES
============================================================

1. NEVER fabricate a proof.

2. NEVER present a conjecture, heuristic, numerical experiment,
   or finite computation as a proof.

3. Separate:
   - known fact
   - derived fact
   - conjecture
   - heuristic
   - experimental evidence
   - original hypothesis
   - unverified argument

4. Never invent papers, authors, journals, DOI numbers,
   theorem names, or citations.

5. If literature cannot be verified, explicitly say so.

6. Do not simply repeat textbook mathematics.

7. Compare the route against previous research.

8. Attack every important hypothesis.

9. Search for counterexamples.

10. Find the largest logical gap.

11. Attempt to repair that gap.

12. If it cannot be repaired, preserve the failure information.

13. If a route has effectively been tried three or more times,
    mark it as blocked and seek another route.

14. A positive result MUST be independently attacked.

15. A positive result does NOT terminate the research project.

16. Continue generating follow-up research.

============================================================
PROOF ROUTES
============================================================

Consider appropriate combinations of:

- direct proof
- contradiction
- contrapositive
- induction
- construction
- invariant
- extremal argument
- algebraic transformation
- analytic transformation
- functional equation
- asymptotic analysis
- probabilistic reasoning
- geometric interpretation
- computational experimentation

Do not force inappropriate methods.

============================================================
NOVELTY CHECK
============================================================

Perform:

A. previous-result comparison
B. previous-route comparison
C. standard-theorem overlap check
D. assumption novelty check
E. mathematical-object novelty check
F. proof-strategy novelty check
G. counterexample compatibility check

============================================================
PREVIOUS RESULTS
============================================================

{previous_text}

============================================================
RESEARCH MEMORY
============================================================

{memos_text}

============================================================
OUTPUT
============================================================

Return ONLY valid JSON.

Required keys:

title
hypothesis
research_question
known_facts
assumptions
approach
proof_strategy
alternative_proof_strategies
counterexample_strategy
counterexample_results
novelty_analysis
known_mathematics_overlap
route_history_analysis
route_blocked
critical_gap
verification_plan
independent_verification
next_steps
follow_up_research
next_research_theme
status
confidence
evidence_type
math_model

Allowed status:

candidate
promising
uncertain
rejected
needs_verification

Allowed evidence_type:

known_fact
derived_fact
heuristic
experimental
conjecture
potential_proof
unverified

confidence:
number from 0 to 1.

IMPORTANT:

For an unresolved problem such as the Riemann Hypothesis,
do not merely answer that it is unproved.

Actually investigate mathematical routes.

If no proof is found:

- record the strongest valid partial result
- identify the exact obstruction
- identify what was tested
- identify counterexamples
- identify next routes

NEVER manufacture success.
"""

          with open("/tmp/prompt.txt", "w", encoding="utf-8") as f:
              f.write(prompt)

          print("Research prompt created.")
          PY


      # =========================================================
      # 8. AI実行前キャンセル確認
      # =========================================================

      - name: Check job before AI
        if: steps.claim_job.outputs.job_claimed == 'true'
        run: |
          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          JOB_ID=$(python3 -c \
            'import json; print(json.load(open("/tmp/job.json", encoding="utf-8"))["id"])')

          STATUS=$(curl \
            --silent \
            --show-error \
            --fail \
            --url "${BASE_URL}/rest/v1/research_jobs?select=status&id=eq.${JOB_ID}" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" |
            python3 -c \
            'import json,sys; a=json.load(sys.stdin); print(a[0]["status"] if a else "missing")')

          echo "Current status: ${STATUS}"

          if [ "${STATUS}" != "running" ]; then
            echo "Job is no longer running."
            exit 0
          fi


      # =========================================================
      # 9. OpenRouter
      # =========================================================

      - name: Call OpenRouter
        if: steps.claim_job.outputs.job_claimed == 'true'
        run: |
          set -e

          python3 <<'PY'
          import json

          with open("/tmp/prompt.txt", "r", encoding="utf-8") as f:
              prompt = f.read()

          request = {
              "model": "nvidia/nemotron-3-ultra-550b-a55b:free",
              "messages": [
                  {
                      "role": "system",
                      "content": (
                          "You are a rigorous autonomous mathematical "
                          "research AI. Never fabricate mathematics. "
                          "Return valid JSON only."
                      )
                  },
                  {
                      "role": "user",
                      "content": prompt
                  }
              ],
              "temperature": 0.15,
              "max_tokens": 12000
          }

          with open("/tmp/request.json", "w", encoding="utf-8") as f:
              json.dump(request, f, ensure_ascii=False)
          PY

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/ai.json \
            --write-out "%{http_code}" \
            --request POST \
            --url "https://openrouter.ai/api/v1/chat/completions" \
            --header "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/request.json)

          echo "OpenRouter HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            cat /tmp/ai.json
            exit 1
          fi

          python3 <<'PY'
          import json

          with open("/tmp/ai.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          try:
              content = data["choices"][0]["message"]["content"]
          except (KeyError, IndexError, TypeError) as e:
              print(json.dumps(data, ensure_ascii=False, indent=2))
              raise SystemExit(f"Invalid OpenRouter response: {e}")

          with open("/tmp/ai_text.txt", "w", encoding="utf-8") as f:
              f.write(content)

          print("AI response received.")
          PY


      # =========================================================
      # 10. AI JSON解析・評価
      # =========================================================

      - name: Validate and evaluate AI result
        if: steps.claim_job.outputs.job_claimed == 'true'
        run: |
          set -e

          python3 <<'PY'
          import json
          import re

          with open("/tmp/ai_text.txt", "r", encoding="utf-8") as f:
              raw = f.read().strip()

          raw = re.sub(
              r"^```(?:json)?\s*",
              "",
              raw,
              flags=re.IGNORECASE
          )

          raw = re.sub(
              r"\s*```$",
              "",
              raw
          )

          try:
              result = json.loads(raw)

          except json.JSONDecodeError:

              match = re.search(
                  r"\{.*\}",
                  raw,
                  re.S
              )

              if not match:
                  raise SystemExit("AI JSON not found.")

              result = json.loads(match.group(0))

          required = [
              "title",
              "hypothesis",
              "research_question",
              "known_facts",
              "assumptions",
              "approach",
              "proof_strategy",
              "counterexample_strategy",
              "novelty_analysis",
              "known_mathematics_overlap",
              "critical_gap",
              "verification_plan",
              "next_steps",
              "status",
              "confidence"
          ]

          missing = [
              key for key in required
              if key not in result
          ]

          if missing:
              raise SystemExit(
                  "Missing required fields: "
                  + ", ".join(missing)
              )

          try:
              confidence = float(result.get("confidence", 0))
          except (TypeError, ValueError):
              confidence = 0.0

          confidence = max(0.0, min(1.0, confidence))

          status = str(
              result.get("status", "needs_verification")
          ).strip().lower()

          evidence_type = str(
              result.get("evidence_type", "unverified")
          ).strip().lower()

          independent = result.get(
              "independent_verification",
              ""
          )

          critical_gap = result.get(
              "critical_gap",
              ""
          )

          route_blocked = bool(
              result.get("route_blocked", False)
          )

          # =====================================================
          # 評価
          #
          # ⭕️は「AIが自信を持った」だけでは付けない。
          #
          # 重要なのは、
          # ・promising
          # ・高信頼
          # ・独立検証あり
          # ・重大な論理ギャップなし
          # ・ルートがブロックされていない
          #
          # であること。
          # =====================================================

          independent_text = str(independent).strip()

          if status == "rejected":
              evaluation = "❌"

          elif (
              status == "promising"
              and confidence >= 0.80
              and independent_text
              and not str(critical_gap).strip()
              and not route_blocked
          ):
              evaluation = "⭕️"

          else:
              evaluation = "△"

          confidence_level = int(
              round(confidence * 5)
          )

          with open("/tmp/job.json", "r", encoding="utf-8") as f:
              job = json.load(f)

          theme = str(
              (job.get("payload") or {}).get(
                  "theme",
                  ""
              )
          ).strip()

          content = {
              "theme": theme,

              "research_question":
                  result.get("research_question"),

              "known_facts":
                  result.get("known_facts", []),

              "assumptions":
                  result.get("assumptions", []),

              "approach":
                  result.get("approach", []),

              "proof_strategy":
                  result.get("proof_strategy", []),

              "alternative_proof_strategies":
                  result.get(
                      "alternative_proof_strategies",
                      []
                  ),

              "counterexample_strategy":
                  result.get(
                      "counterexample_strategy",
                      []
                  ),

              "counterexample_results":
                  result.get(
                      "counterexample_results",
                      []
                  ),

              "novelty_analysis":
                  result.get(
                      "novelty_analysis",
                      []
                  ),

              "known_mathematics_overlap":
                  result.get(
                      "known_mathematics_overlap",
                      []
                  ),

              "route_history_analysis":
                  result.get(
                      "route_history_analysis",
                      []
                  ),

              "route_blocked":
                  route_blocked,

              "critical_gap":
                  critical_gap,

              "verification_plan":
                  result.get(
                      "verification_plan",
                      []
                  ),

              "independent_verification":
                  independent,

              "next_steps":
                  result.get(
                      "next_steps",
                      []
                  ),

              "follow_up_research":
                  result.get(
                      "follow_up_research",
                      []
                  ),

              "next_research_theme":
                  result.get(
                      "next_research_theme",
                      ""
                  ),

              "evidence_type":
                  evidence_type,

              "math_model":
                  result.get(
                      "math_model",
                      {}
                  ),

              "source_job_id":
                  job.get("id"),

              "research_mode":
                  job.get("job_type") or
                  (job.get("payload") or {}).get(
                      "mode",
                      "research"
                  ),

              "research_configuration":
                  job.get("payload", {})
          }

          record = {
              "project_id":
                  job["project_id"],

              "title":
                  str(
                      result.get(
                          "title",
                          "AI研究結果"
                      )
                  ),

              "hypothesis":
                  str(
                      result.get(
                          "hypothesis",
                          ""
                      )
                  ),

              "content":
                  json.dumps(
                      content,
                      ensure_ascii=False
                  ),

              "status":
                  "pending",

              "evaluation":
                  evaluation,

              "confidence_level":
                  confidence_level,

              "is_human_saved":
                  evaluation == "⭕️"
          }

          with open("/tmp/result.json", "w", encoding="utf-8") as f:
              json.dump(
                  record,
                  f,
                  ensure_ascii=False
              )

          print("======================================")
          print("Evaluation:", evaluation)
          print("Status:", status)
          print("Evidence:", evidence_type)
          print("Confidence:", confidence)
          print("======================================")
          PY


      # =========================================================
      # 11. 保存前キャンセル確認
      # =========================================================

      - name: Check job before save
        if: steps.claim_job.outputs.job_claimed == 'true'
        run: |
          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          JOB_ID=$(python3 -c \
            'import json; print(json.load(open("/tmp/job.json", encoding="utf-8"))["id"])')

          STATUS=$(curl \
            --silent \
            --show-error \
            --fail \
            --url "${BASE_URL}/rest/v1/research_jobs?select=status&id=eq.${JOB_ID}" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" |
            python3 -c \
            'import json,sys; a=json.load(sys.stdin); print(a[0]["status"] if a else "missing")')

          echo "Current status: ${STATUS}"

          if [ "${STATUS}" != "running" ]; then
            echo "Job is no longer running. Save cancelled."
            exit 0
          fi


      # =========================================================
      # 12. 研究結果保存
      # =========================================================

      - name: Save research result
        if: steps.claim_job.outputs.job_claimed == 'true'
        run: |
          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/save.json \
            --write-out "%{http_code}" \
            --request POST \
            --url "${BASE_URL}/rest/v1/research_results" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=minimal" \
            --data-binary @/tmp/result.json)

          echo "Supabase result HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            cat /tmp/save.json
            exit 1
          fi

          echo "RESEARCH RESULT SAVED."


      # =========================================================
      # 13. AI研究メモ保存
      #
      # theme を必ず保存することで、
      # リーマン予想ならリーマン予想系として
      # UI側でフォルダ分けできる。
      # =========================================================

      - name: Update AI research memory
        if: steps.claim_job.outputs.job_claimed == 'true'
        run: |
          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          python3 <<'PY'
          import json

          with open("/tmp/result.json", "r", encoding="utf-8") as f:
              record = json.load(f)

          content = json.loads(
              record.get("content", "{}")
          )

          theme = content.get(
              "theme",
              ""
          )

          memo_content = {
              "theme": theme,

              "evaluation":
                  record.get(
                      "evaluation",
                      "△"
                  ),

              "hypothesis":
                  record.get(
                      "hypothesis",
                      ""
                  ),

              "approach":
                  content.get(
                      "approach",
                      []
                  ),

              "critical_gap":
                  content.get(
                      "critical_gap",
                      ""
                  ),

              "counterexample_results":
                  content.get(
                      "counterexample_results",
                      []
                  ),

              "route_blocked":
                  content.get(
                      "route_blocked",
                      False
                  ),

              "next_steps":
                  content.get(
                      "next_steps",
                      []
                  ),

              "follow_up_research":
                  content.get(
                      "follow_up_research",
                      []
                  ),

              "next_research_theme":
                  content.get(
                      "next_research_theme",
                      ""
                  )
          }

          with open("/tmp/job.json", "r", encoding="utf-8") as f:
              job = json.load(f)

          memo = {
              "project_id":
                  job["project_id"],

              "title":
                  "AI研究記憶: " +
                  str(
                      record.get(
                          "title",
                          "研究結果"
                      )
                  ),

              "content":
                  json.dumps(
                      memo_content,
                      ensure_ascii=False
                  )
          }

          with open("/tmp/memo.json", "w", encoding="utf-8") as f:
              json.dump(
                  memo,
                  f,
                  ensure_ascii=False
              )
          PY

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/memo_save.json \
            --write-out "%{http_code}" \
            --request POST \
            --url "${BASE_URL}/rest/v1/research_memos" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=minimal" \
            --data-binary @/tmp/memo.json)

          echo "Memo HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            cat /tmp/memo_save.json
            exit 1
          fi

          echo "AI MEMORY UPDATED."


      # =========================================================
      # 14. 次の研究を自動生成
      #
      # ここが重要。
      #
      # 1件結果が出たら終了ではなく、
      # AIの next_research_theme / follow_up_research を
      # 次のqueued jobへ変換する。
      #
      # ⭕️ / △ / ❌ すべて継続対象。
      # =========================================================

      - name: Queue next research
        if: steps.claim_job.outputs.job_claimed == 'true'
        run: |
          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          python3 <<'PY'
          import json

          with open("/tmp/result.json", "r", encoding="utf-8") as f:
              result = json.load(f)

          with open("/tmp/job.json", "r", encoding="utf-8") as f:
              job = json.load(f)

          content = json.loads(
              result.get("content", "{}")
          )

          original_theme = str(
              content.get("theme", "")
          ).strip()

          next_theme = str(
              content.get(
                  "next_research_theme",
                  ""
              )
          ).strip()

          followups = content.get(
              "follow_up_research",
              []
          )

          if not next_theme and followups:
              if isinstance(followups, list):
                  for item in followups:
                      if isinstance(item, str) and item.strip():
                          next_theme = item.strip()
                          break

                      if isinstance(item, dict):
                          candidate = str(
                              item.get(
                                  "theme",
                                  ""
                              )
                          ).strip()

                          if candidate:
                              next_theme = candidate
                              break

          # 次のテーマがAIから出なかった場合も
          # 研究を止めないための安全なフォールバック。
          if not next_theme:
              next_theme = (
                  "前回研究を独立に再検証し、"
                  "最大の論理的ギャップと反例可能性を調査する: "
                  + original_theme
              )

          payload = {
              "theme": next_theme,

              "source":
                  "automatic_follow_up",

              "mode":
                  "continuous_research",

              "parent_job_id":
                  job.get("id"),

              "parent_result_title":
                  result.get("title"),

              "previous_evaluation":
                  result.get(
                      "evaluation",
                      "△"
                  ),

              "previous_hypothesis":
                  result.get(
                      "hypothesis",
                      ""
                  ),

              "instruction":
                  "前回結果を前提として盲目的に肯定せず、"
                  "独立した別ルートから検証し、"
                  "必要なら結論を破壊する。"
          }

          new_job = {
              "project_id":
                  job["project_id"],

              "job_type":
                  "research",

              "status":
                  "queued",

              "priority":
                  5,

              "payload":
                  payload
          }

          with open(
              "/tmp/next_job.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  new_job,
                  f,
                  ensure_ascii=False
              )

          print("Next research queued:")
          print(next_theme)
          PY

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/next_job_response.json \
            --write-out "%{http_code}" \
            --request POST \
            --url "${BASE_URL}/rest/v1/research_jobs" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=minimal" \
            --data-binary @/tmp/next_job.json)

          echo "Next job HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            cat /tmp/next_job_response.json
            exit 1
          fi

          echo "NEXT RESEARCH JOB QUEUED."


      # =========================================================
      # 15. ⭕️結果の独立破壊検証
      #
      # ⭕️でも研究終了しない。
      # 別Workerに独立検証を渡す。
      # =========================================================

      - name: Queue independent destruction test
        if: steps.claim_job.outputs.job_claimed == 'true'
        run: |
          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          python3 <<'PY'
          import json

          with open("/tmp/result.json", "r", encoding="utf-8") as f:
              result = json.load(f)

          with open("/tmp/job.json", "r", encoding="utf-8") as f:
              job = json.load(f)

          if result.get("evaluation") != "⭕️":
              print("Not an accepted result. Destruction test not required.")
              with open("/tmp/run_destruction", "w", encoding="utf-8") as f:
                  f.write("false")
              raise SystemExit(0)

          content = json.loads(
              result.get("content", "{}")
          )

          theme = content.get(
              "theme",
              ""
          )

          payload = {
              "theme":
                  "独立破壊検証: " + str(theme),

              "source":
                  "positive_result_destruction_test",

              "mode":
                  "independent_verification",

              "parent_job_id":
                  job.get("id"),

              "target_hypothesis":
                  result.get(
                      "hypothesis",
                      ""
                  ),

              "target_result":
                  content,

              "instruction":
                  """
                  元の結果を信用しない。

                  独立した数学的導出を行い、
                  可能なら反例・論理的欠陥・隠れた仮定を発見する。

                  元の結果を守ることは禁止。

                  少しでも重大な欠陥が見つかった場合は
                  その欠陥を明確に記録する。

                  生き残った場合のみ、
                  どこまで独立に確認できたかを記録する。
                  """
          }

          verification_job = {
              "project_id":
                  job["project_id"],

              "job_type":
                  "independent_verification",

              "status":
                  "queued",

              "priority":
                  9,

              "payload":
                  payload
          }

          with open(
              "/tmp/destruction_job.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  verification_job,
                  f,
                  ensure_ascii=False
              )

          with open(
              "/tmp/run_destruction",
              "w",
              encoding="utf-8"
          ) as f:
              f.write("true")
          PY

          if [ "$(cat /tmp/run_destruction)" = "true" ]; then

            HTTP_STATUS=$(curl \
              --silent \
              --show-error \
              --output /tmp/destruction_response.json \
              --write-out "%{http_code}" \
              --request POST \
              --url "${BASE_URL}/rest/v1/research_jobs" \
              --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Content-Type: application/json" \
              --header "Prefer: return=minimal" \
              --data-binary @/tmp/destruction_job.json)

            echo "Destruction job HTTP status: ${HTTP_STATUS}"

            if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
              cat /tmp/destruction_response.json
              exit 1
            fi

            echo "INDEPENDENT DESTRUCTION TEST QUEUED."

          fi


      # =========================================================
      # 16. ジョブ完了
      # =========================================================

      - name: Complete job
        if: steps.claim_job.outputs.job_claimed == 'true' && success()
        run: |
          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          JOB_ID=$(python3 -c \
            'import json; print(json.load(open("/tmp/job.json", encoding="utf-8"))["id"])')

          FINISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/complete.json \
            --write-out "%{http_code}" \
            --request PATCH \
            --url "${BASE_URL}/rest/v1/research_jobs?id=eq.${JOB_ID}&status=eq.running" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=minimal" \
            --data "{\"status\":\"completed\",\"finished_at\":\"${FINISHED_AT}\"}")

          echo "Complete HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            cat /tmp/complete.json
            exit 1
          fi

          echo "JOB COMPLETED: ${JOB_ID}"


      # =========================================================
      # 17. 失敗
      # =========================================================

      - name: Mark failed
        if: steps.claim_job.outputs.job_claimed == 'true' && failure()
        run: |
          set +e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          if [ ! -f /tmp/job.json ]; then
            echo "No job file. Nothing to mark."
            exit 0
          fi

          JOB_ID=$(python3 -c \
            'import json; print(json.load(open("/tmp/job.json", encoding="utf-8"))["id"])')

          FINISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          ERROR_MESSAGE="GitHub Actions research worker failed."

          if [ -f /tmp/ai.json ]; then
            ERROR_MESSAGE=$(python3 - <<'PY'
          import json

          try:
              with open("/tmp/ai.json", "r", encoding="utf-8") as f:
                  data = json.load(f)

              error = data.get("error")

              if isinstance(error, dict):
                  message = error.get("message")
                  if message:
                      print(str(message)[:1000])
                      raise SystemExit

              print("OpenRouter/API or research worker failure.")

          except Exception:
              print("Research worker failure.")
          PY
            )
          fi

          curl \
            --silent \
            --show-error \
            --request PATCH \
            --url "${BASE_URL}/rest/v1/research_jobs?id=eq.${JOB_ID}&status=eq.running" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=minimal" \
            --data "$(python3 - <<PY
          import json

          print(json.dumps({
              "status": "failed",
              "error_message": """${ERROR_MESSAGE}""",
              "finished_at": "${FINISHED_AT}"
          }, ensure_ascii=False))
          PY
          )" \
          || true

          echo "JOB MARKED FAILED: ${JOB_ID}"
