name: Math Research Lab

on:
  workflow_dispatch:

  schedule:
    # 5分ごとに研究キューを確認
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: math-research-lab-worker
  cancel-in-progress: false

jobs:

  research:
    name: AI Mathematical Research Worker
    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:

      # =========================================================
      # 0. 基本環境
      # =========================================================

      - name: Initialize worker
        run: |
          set -e

          echo "======================================"
          echo " Math Research Lab Worker"
          echo "======================================"

          python3 --version
          curl --version | head -n 1


      # =========================================================
      # 1. キューからジョブを1件取得
      # =========================================================

      - name: Get queued research job
        id: get_job
        run: |
          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/jobs.json \
            --write-out "%{http_code}" \
            --request GET \
            --url "${BASE_URL}/rest/v1/research_jobs?select=*&status=eq.queued&order=priority.desc,created_at.asc&limit=1" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json")

          echo "Queue HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" != "200" ]; then
            cat /tmp/jobs.json
            exit 1
          fi

          python3 <<'PY'
          import json

          with open("/tmp/jobs.json", "r", encoding="utf-8") as f:
              jobs = json.load(f)

          if not jobs:
              print("Queue empty.")

              with open("/tmp/job_exists", "w") as f:
                  f.write("false")

          else:
              job = jobs[0]

              print("Candidate job:")
              print(job.get("id"))

              with open("/tmp/job.json", "w", encoding="utf-8") as f:
                  json.dump(job, f, ensure_ascii=False)

              with open("/tmp/job_exists", "w") as f:
                  f.write("true")
          PY

          echo "job_exists=$(cat /tmp/job_exists)" >> "$GITHUB_OUTPUT"


      # =========================================================
      # 2. ジョブを running に変更
      #
      # 重要:
      # status=queued を条件にすることで、
      # 別workerが先に取得したジョブを奪わない。
      # =========================================================

      - name: Claim research job
        id: claim_job
        if: steps.get_job.outputs.job_exists == 'true'
        run: |
          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          JOB_ID=$(python3 -c \
            'import json; print(json.load(open("/tmp/job.json"))["id"])')

          STARTED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/claim.json \
            --write-out "%{http_code}" \
            --request PATCH \
            --url "${BASE_URL}/rest/v1/research_jobs?id=eq.${JOB_ID}&status=eq.queued" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=representation" \
            --data "{\"status\":\"running\",\"started_at\":\"${STARTED_AT}\"}")

          echo "Claim HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            cat /tmp/claim.json
            exit 1
          fi

          python3 <<'PY'
          import json

          with open("/tmp/claim.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if not data:
              print("Another worker claimed this job first.")

              with open("/tmp/job_claimed", "w") as f:
                  f.write("false")

          else:
              print("Job successfully claimed.")

              with open("/tmp/job_claimed", "w") as f:
                  f.write("true")
          PY

          echo "job_claimed=$(cat /tmp/job_claimed)" >> "$GITHUB_OUTPUT"


      # =========================================================
      # 3. 研究テーマ・過去研究・AIメモを取得
      # =========================================================

      - name: Build research context
        if: steps.claim_job.outputs.job_claimed == 'true'
        run: |
          set -e

          python3 <<'PY'
          import json

          with open("/tmp/job.json", "r", encoding="utf-8") as f:
              job = json.load(f)

          payload = job.get("payload") or {}

          theme = str(
              payload.get("theme", "")
          ).strip()

          if not theme:
              raise SystemExit("Research theme is empty.")

          print("Research theme:")
          print(theme)

          context = {
              "theme": theme,
              "source": payload.get("source"),
              "mode": payload.get("mode"),
              "project_id": job.get("project_id"),
              "job_id": job.get("id")
          }

          with open("/tmp/research_context.json", "w", encoding="utf-8") as f:
              json.dump(
                  context,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
          PY


      # =========================================================
      # 4. 過去研究を取得
      #
      # AIに「過去に何を試したか」を渡す。
      # =========================================================

      - name: Load previous research
        if: steps.claim_job.outputs.job_claimed == 'true'
        run: |
          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          PROJECT_ID=$(python3 -c \
            'import json; print(json.load(open("/tmp/job.json"))["project_id"])')

          curl \
            --silent \
            --show-error \
            --fail \
            --url "${BASE_URL}/rest/v1/research_results?select=id,title,hypothesis,content,evaluation,confidence_level,status,created_at&project_id=eq.${PROJECT_ID}&order=created_at.desc&limit=100" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            > /tmp/previous_results.json

          echo "Previous research loaded."


      # =========================================================
      # 5. AI研究メモを取得
      # =========================================================

      - name: Load research memory
        if: steps.claim_job.outputs.job_claimed == 'true'
        run: |
          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          PROJECT_ID=$(python3 -c \
            'import json; print(json.load(open("/tmp/job.json"))["project_id"])')

          curl \
            --silent \
            --show-error \
            --fail \
            --url "${BASE_URL}/rest/v1/research_memos?select=id,title,content,created_at,updated_at&project_id=eq.${PROJECT_ID}&order=created_at.desc&limit=50" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            > /tmp/research_memos.json

          echo "Research memory loaded."


      # =========================================================
      # 6. 過去研究をAI向けコンテキストに圧縮
      # =========================================================

      - name: Build AI memory
        if: steps.claim_job.outputs.job_claimed == 'true'
        run: |
          set -e

          python3 <<'PY'
          import json

          with open("/tmp/previous_results.json", "r", encoding="utf-8") as f:
              results = json.load(f)

          with open("/tmp/research_memos.json", "r", encoding="utf-8") as f:
              memos = json.load(f)

          memory = {
              "previous_results": results[:100],
              "research_memos": memos[:50]
          }

          with open("/tmp/ai_memory.json", "w", encoding="utf-8") as f:
              json.dump(
                  memory,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "Previous results:",
              len(results)
          )

          print(
              "Research memos:",
              len(memos)
          )
          PY


      # =========================================================
      # 7. 研究プロンプト作成
      #
      # 「既知の数学をなぞらない」ための多重制約。
      # =========================================================

      - name: Build rigorous research prompt
        if: steps.claim_job.outputs.job_claimed == 'true'
        run: |
          set -e

          python3 <<'PY'
          import json

          with open("/tmp/job.json", "r", encoding="utf-8") as f:
              job = json.load(f)

          with open("/tmp/ai_memory.json", "r", encoding="utf-8") as f:
              memory = json.load(f)

          payload = job.get("payload") or {}

          theme = str(
              payload.get("theme", "")
          ).strip()

          previous = memory.get(
              "previous_results",
              []
          )

          memos = memory.get(
              "research_memos",
              []
          )

          previous_text = json.dumps(
              previous[:100],
              ensure_ascii=False,
              indent=2
          )

          memos_text = json.dumps(
              memos[:50],
              ensure_ascii=False,
              indent=2
          )

          prompt = f"""
You are the autonomous mathematical research engine of Research AI Lab.

TARGET RESEARCH PROBLEM:
{theme}

You are NOT a normal question-answering AI.

Your task is to perform mathematical research.

IMPORTANT:
A user asking you to "think about the Riemann Hypothesis" does NOT mean:
"answer that it is unproved".

Instead, you must actively investigate mathematical routes while NEVER falsely claiming a proof.

============================================================
CORE RULES
============================================================

RULE 1 — NO FALSE PROOF

Never claim an unresolved mathematical statement is proven.

A numerical experiment, pattern, analogy, computer experiment, heuristic,
or finite verification is NOT a proof.

============================================================

RULE 2 — SEPARATE KNOWLEDGE FROM ORIGINAL WORK

Every statement must be classified conceptually as one of:

KNOWN FACT
DERIVED FACT
CONJECTURE
HEURISTIC
EXPERIMENTAL EVIDENCE
ORIGINAL HYPOTHESIS

Do not blur these categories.

============================================================

RULE 3 — DO NOT SIMPLY REPEAT KNOWN MATHEMATICS

Before developing an approach, ask:

1. Is this essentially a standard known proof attempt?
2. Is this merely restating a known theorem?
3. Is this merely changing notation?
4. Is this merely reproducing a textbook argument?
5. Has this route already been attempted in previous research?
6. Is the proposed novelty actually mathematical?

If yes, explicitly identify the overlap and move to a genuinely different
direction whenever possible.

============================================================

RULE 4 — MULTIPLE NOVELTY CHECKS

Use at least FIVE independent anti-redundancy checks:

A. Previous-result comparison
B. Previous-route comparison
C. Standard-theorem overlap check
D. Assumption novelty check
E. Mathematical-object novelty check
F. Proof-strategy novelty check
G. Counterexample compatibility check

Do not call something novel merely because it sounds unusual.

============================================================

RULE 5 — NEVER INVENT REFERENCES

Never fabricate papers, authors, journals, DOI numbers, theorem names,
or citations.

If literature cannot actually be verified in the current environment,
state that literature verification remains required.

============================================================

RULE 6 — COUNTEREXAMPLE SEARCH

Every meaningful hypothesis must be attacked.

Try:

- small cases
- boundary cases
- degenerate cases
- extreme cases
- symmetry-breaking cases
- pathological cases
- numerical counterexamples where useful
- logical counterexamples

If the hypothesis survives, say only that it survived the tested cases.

============================================================

RULE 7 — MULTIPLE PROOF STRATEGIES

When mathematically appropriate, investigate several routes:

- direct proof
- contradiction
- contrapositive
- mathematical induction
- strong induction
- construction
- invariant
- extremal argument
- algebraic transformation
- analytic transformation
- functional equation
- asymptotic argument
- probabilistic argument
- geometric interpretation
- computational experiment

Do NOT force an inappropriate proof method.

============================================================

RULE 8 — LOGICAL GAP DETECTION

Find the single largest unsupported logical step.

Then explicitly attempt to repair it.

If it cannot be repaired, do NOT hide the gap.

============================================================

RULE 9 — THREE-TIME ROUTE BLOCKING

If essentially the same research route has already been explored three or
more times, consider that route BLOCKED.

Do not simply rename the same route.

Move to a different mathematical representation, object, invariant,
assumption, or strategy.

============================================================

RULE 10 — POSITIVE RESULTS MUST BE REVERIFIED

Even if an approach appears successful:

DO NOT immediately treat it as established.

A promising or apparently successful result must be subjected to
independent verification.

For a potential proof, attempt to destroy the proof before accepting it.

============================================================

RULE 11 — RIGOR OVER CONFIDENCE

A confidence score describes the quality of the current investigation,
NOT the truth of an unresolved theorem.

Never use confidence to convert a conjecture into a theorem.

============================================================

RULE 12 — RESEARCH CONTINUES

One result does NOT mean the entire research project is finished.

The purpose is continuous exploration.

A result should produce:

- follow-up questions
- alternative approaches
- verification tasks
- counterexample tasks
- mathematical transformations
- possible next research routes

============================================================

PAST RESEARCH
============================================================

{previous_text}

============================================================

RESEARCH MEMOS
============================================================

{memos_text}

============================================================

REQUIRED OUTPUT
============================================================

Return ONLY valid JSON.

Required keys:

title
hypothesis
research_question
known_facts
assumptions
approach
proof_strategy
alternative_proof_strategies
counterexample_strategy
counterexample_results
novelty_analysis
known_mathematics_overlap
route_history_analysis
route_blocked
critical_gap
verification_plan
independent_verification
next_steps
follow_up_research
status
confidence
evidence_type

Allowed status:

candidate
promising
uncertain
rejected
needs_verification

Allowed evidence_type:

known_fact
derived_fact
heuristic
experimental
conjecture
potential_proof
unverified

confidence must be between 0 and 1.

IMPORTANT:

If the target is an unresolved problem such as the Riemann Hypothesis,
continue doing actual mathematical exploration.

Do NOT respond merely:

"it is currently unproven"

unless the research task specifically asks for its status.

If no proof is found, produce the strongest rigorous partial progress,
the exact obstruction, and concrete next routes.

Do not manufacture results.
"""

          with open("/tmp/prompt.txt", "w", encoding="utf-8") as f:
              f.write(prompt)

          print("Rigorous research prompt created.")


      # =========================================================
      # 8. AI呼び出し前キャンセル確認
      # =========================================================

      - name: Check cancellation before AI
        if: steps.claim_job.outputs.job_claimed == 'true'
        run: |
          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          JOB_ID=$(python3 -c \
            'import json; print(json.load(open("/tmp/job.json"))["id"])')

          STATUS=$(curl \
            --silent \
            --show-error \
            --fail \
            --url "${BASE_URL}/rest/v1/research_jobs?select=status&id=eq.${JOB_ID}" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" |
            python3 -c \
            'import json,sys; a=json.load(sys.stdin); print(a[0]["status"] if a else "missing")')

          echo "Current job status: ${STATUS}"

          if [ "${STATUS}" != "running" ]; then
            echo "Job is no longer running."
            exit 1
          fi


      # =========================================================
      # 9. OpenRouter
      # =========================================================

      - name: Call OpenRouter
        if: steps.claim_job.outputs.job_claimed == 'true'
        run: |
          set -e

          python3 <<'PY'
          import json

          with open("/tmp/prompt.txt", "r", encoding="utf-8") as f:
              prompt = f.read()

          request = {
              "model": "nvidia/nemotron-3-ultra-550b-a55b:free",

              "messages": [
                  {
                      "role": "system",
                      "content": (
                          "You are a rigorous mathematical research AI. "
                          "Never fabricate mathematical facts. "
                          "Return valid JSON only."
                      )
                  },
                  {
                      "role": "user",
                      "content": prompt
                  }
              ],

              "temperature": 0.15,

              "max_tokens": 12000
          }

          with open("/tmp/request.json", "w", encoding="utf-8") as f:
              json.dump(
                  request,
                  f,
                  ensure_ascii=False
              )
          PY

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/ai.json \
            --write-out "%{http_code}" \
            --request POST \
            --url "https://openrouter.ai/api/v1/chat/completions" \
            --header "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/request.json)

          echo "OpenRouter HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            cat /tmp/ai.json
            exit 1
          fi

          python3 <<'PY'
          import json

          with open("/tmp/ai.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          try:
              content = data["choices"][0]["message"]["content"]
          except (KeyError, IndexError, TypeError) as e:
              print(json.dumps(data, ensure_ascii=False, indent=2))
              raise SystemExit(
                  f"Invalid OpenRouter response: {e}"
              )

          with open("/tmp/ai_text.txt", "w", encoding="utf-8") as f:
              f.write(content)

          print("AI response received.")
          PY


      # =========================================================
      # 10. AI JSON検証
      # =========================================================

      - name: Validate AI result
        if: steps.claim_job.outputs.job_claimed == 'true'
        run: |
          set -e

          python3 <<'PY'
          import json
          import re

          with open("/tmp/ai_text.txt", "r", encoding="utf-8") as f:
              raw = f.read().strip()

          raw = re.sub(
              r"^```(?:json)?\s*",
              "",
              raw,
              flags=re.IGNORECASE
          )

          raw = re.sub(
              r"\s*```$",
              "",
              raw
          )

          try:
              result = json.loads(raw)

          except json.JSONDecodeError:

              match = re.search(
                  r"\{.*\}",
                  raw,
                  re.S
              )

              if not match:
                  raise SystemExit(
                      "AI JSON not found."
                  )

              result = json.loads(
                  match.group(0)
              )

          required = [
              "title",
              "hypothesis",
              "research_question",
              "known_facts",
              "assumptions",
              "approach",
              "proof_strategy",
              "counterexample_strategy",
              "novelty_analysis",
              "known_mathematics_overlap",
              "critical_gap",
              "verification_plan",
              "next_steps",
              "status",
              "confidence"
          ]

          missing = [
              key
              for key in required
              if key not in result
          ]

          if missing:
              raise SystemExit(
                  "Missing required fields: "
                  + ", ".join(missing)
              )

          confidence_raw = result.get(
              "confidence",
              0
          )

          try:
              confidence = float(
                  confidence_raw
              )
          except (
              TypeError,
              ValueError
          ):
              confidence = 0.0

          confidence = max(
              0.0,
              min(1.0, confidence)
          )

          status = str(
              result.get(
                  "status",
                  "needs_verification"
              )
          ).lower().strip()

          evidence_type = str(
              result.get(
                  "evidence_type",
                  "unverified"
              )
          ).lower().strip()

          # =====================================================
          # 評価
          #
          # 「potential_proof」だけでは⭕️にしない。
          # 独立検証と論理ギャップの状態を確認する。
          # =====================================================

          independent = result.get(
              "independent_verification",
              ""
          )

          critical_gap = result.get(
              "critical_gap",
              ""
          )

          route_blocked = bool(
              result.get(
                  "route_blocked",
                  False
              )
          )

          if (
              status == "rejected"
          ):
              evaluation = "❌"

          elif (
              status == "promising"
              and confidence >= 0.8
              and evidence_type == "potential_proof"
              and independent
              and not critical_gap
              and not route_blocked
          ):
              evaluation = "⭕️"

          else:
              evaluation = "△"

          confidence_level = round(
              confidence * 5
          )

          with open(
              "/tmp/job.json",
              "r",
              encoding="utf-8"
          ) as f:
              job = json.load(f)

          content = {
              "research_question":
                  result.get("research_question"),

              "known_facts":
                  result.get("known_facts", []),

              "assumptions":
                  result.get("assumptions", []),

              "approach":
                  result.get("approach", []),

              "proof_strategy":
                  result.get("proof_strategy", []),

              "alternative_proof_strategies":
                  result.get(
                      "alternative_proof_strategies",
                      []
                  ),

              "counterexample_strategy":
                  result.get(
                      "counterexample_strategy",
                      []
                  ),

              "counterexample_results":
                  result.get(
                      "counterexample_results",
                      []
                  ),

              "novelty_analysis":
                  result.get(
                      "novelty_analysis",
                      []
                  ),

              "known_mathematics_overlap":
                  result.get(
                      "known_mathematics_overlap",
                      []
                  ),

              "route_history_analysis":
                  result.get(
                      "route_history_analysis",
                      []
                  ),

              "route_blocked":
                  route_blocked,

              "critical_gap":
                  critical_gap,

              "verification_plan":
                  result.get(
                      "verification_plan",
                      []
                  ),

              "independent_verification":
                  independent,

              "next_steps":
                  result.get(
                      "next_steps",
                      []
                  ),

              "follow_up_research":
                  result.get(
                      "follow_up_research",
                      []
                  ),

              "evidence_type":
                  evidence_type,

              "source_job_id":
                  job["id"],

              "research_configuration":
                  job.get(
                      "payload",
                      {}
                  )
          }

          record = {
              "project_id":
                  job["project_id"],

              "title":
                  str(
                      result.get(
                          "title",
                          "AI研究結果"
                      )
                  ),

              "hypothesis":
                  str(
                      result.get(
                          "hypothesis",
                          ""
                      )
                  ),

              "content":
                  json.dumps(
                      content,
                      ensure_ascii=False
                  ),

              "status":
                  "pending",

              "evaluation":
                  evaluation,

              "confidence_level":
                  confidence_level,

              "is_human_saved":
                  evaluation == "⭕️"
          }

          with open(
              "/tmp/result.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  record,
                  f,
                  ensure_ascii=False
              )

          print(
              "Evaluation:",
              evaluation
          )

          print(
              "Evidence type:",
              evidence_type
          )

          print(
              "Confidence:",
              confidence
          )
          PY


      # =========================================================
      # 11. 保存直前キャンセル確認
      # =========================================================

      - name: Check cancellation before save
        if: steps.claim_job.outputs.job_claimed == 'true'
        run: |
          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          JOB_ID=$(python3 -c \
            'import json; print(json.load(open("/tmp/job.json"))["id"])')

          STATUS=$(curl \
            --silent \
            --show-error \
            --fail \
            --url "${BASE_URL}/rest/v1/research_jobs?select=status&id=eq.${JOB_ID}" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" |
            python3 -c \
            'import json,sys; a=json.load(sys.stdin); print(a[0]["status"] if a else "missing")')

          if [ "${STATUS}" != "running" ]; then
            echo "Job cancelled before save."
            exit 1
          fi


      # =========================================================
      # 12. 研究結果保存
      # =========================================================

      - name: Save research result
        if: steps.claim_job.outputs.job_claimed == 'true'
        run: |
          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/save.json \
            --write-out "%{http_code}" \
            --request POST \
            --url "${BASE_URL}/rest/v1/research_results" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=minimal" \
            --data-binary @/tmp/result.json)

          echo "Supabase result HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            cat /tmp/save.json
            exit 1
          fi

          echo "RESEARCH RESULT SAVED."


      # =========================================================
      # 13. AI研究メモを自動更新
      #
      # 次の研究に「何を試して何が駄目だったか」を渡す。
      # =========================================================

      - name: Update AI research memory
        if: steps.claim_job.outputs.job_claimed == 'true' && success()
        run: |
          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          python3 <<'PY'
          import json

          with open(
              "/tmp/result.json",
              "r",
              encoding="utf-8"
          ) as f:
              record = json.load(f)

          content = json.loads(
              record.get("content", "{}")
          )

          title = record.get(
              "title",
              "研究結果"
          )

          evaluation = record.get(
              "evaluation",
              "△"
          )

          memo_content = {
              "source": "automatic_research_memory",
              "evaluation": evaluation,
              "hypothesis": record.get(
                  "hypothesis",
                  ""
              ),
              "approach": content.get(
                  "approach",
                  []
              ),
              "critical_gap": content.get(
                  "critical_gap",
                  ""
              ),
              "counterexample_results": content.get(
                  "counterexample_results",
                  []
              ),
              "route_blocked": content.get(
                  "route_blocked",
                  False
              ),
              "next_steps": content.get(
                  "next_steps",
                  []
              ),
              "follow_up_research": content.get(
                  "follow_up_research",
                  []
              )
          }

          with open(
              "/tmp/memo.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  {
                      "title":
                          "AI研究記憶: " + title,

                      "content":
                          json.dumps(
                              memo_content,
                              ensure_ascii=False
                          )
                  },
                  f,
                  ensure_ascii=False
              )
          PY

          PROJECT_ID=$(python3 -c \
            'import json; print(json.load(open("/tmp/job.json"))["project_id"])')

          python3 <<'PY'
          import json

          with open(
              "/tmp/memo.json",
              "r",
              encoding="utf-8"
          ) as f:
              memo = json.load(f)

          memo["project_id"] = open(
              "/tmp/project_id",
              "w"
          )

          PY

          echo "${PROJECT_ID}" > /tmp/project_id

          python3 <<'PY'
          import json

          with open(
              "/tmp/memo.json",
              "r",
              encoding="utf-8"
          ) as f:
              memo = json.load(f)

          with open(
              "/tmp/project_id",
              "r",
              encoding="utf-8"
          ) as f:
              project_id = f.read().strip()

          memo["project_id"] = project_id

          with open(
              "/tmp/memo.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  memo,
                  f,
                  ensure_ascii=False
              )
          PY

          curl \
            --silent \
            --show-error \
            --fail \
            --request POST \
            --url "${BASE_URL}/rest/v1/research_memos" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=minimal" \
            --data-binary @/tmp/memo.json

          echo "AI MEMORY UPDATED."


      # =========================================================
      # 14. ⭕️結果なら再検証ジョブをキューへ追加
      #
      # 「⭕️だから終了」ではなく、
      # 独立した検証を次のジョブとして行う。
      # =========================================================

      - name: Queue independent verification
        if: steps.claim_job.outputs.job_claimed == 'true' && success()
        run: |
          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          python3 <<'PY'
          import json

          with open(
              "/tmp/result.json",
              "r",
              encoding="utf-8"
          ) as f:
              result = json.load(f)

          if result.get("evaluation") != "⭕️":
              print(
                  "Result is not positive. "
                  "No independent verification queued."
              )

              with open(
                  "/tmp/needs_verification",
                  "w"
              ) as f:
                  f.write("false")

              raise SystemExit(0)

          with open(
              "/tmp/job.json",
              "r",
              encoding="utf-8"
          ) as f:
              job = json.load(f)

          content = json.loads(
              result.get("content", "{}")
          )

          payload = {
              "theme":
                  result.get(
                      "hypothesis",
                      ""
                  ),

              "source":
                  "automatic_positive_result_reverification",

              "mode":
                  "independent_verification",

              "source_result_id":
                  None,

              "verification_methods": [
                  "contradiction",
                  "contrapositive",
                  "induction",
                  "counterexample_search",
                  "independent_derivation"
              ],

              "original_approach":
                  content.get(
                      "approach",
                      []
                  )
          }

          with open(
              "/tmp/verification_job.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  {
                      "project_id":
                          job["project_id"],

                      "job_type":
                          "independent_verification",

                      "status":
                          "queued",

                      "priority":
                          8,

                      "payload":
                          payload
                  },
                  f,
                  ensure_ascii=False
              )

          with open(
              "/tmp/needs_verification",
              "w"
          ) as f:
              f.write("true")
          PY

          if [ "$(cat /tmp/needs_verification)" = "true" ]; then

            curl \
              --silent \
              --show-error \
              --fail \
              --request POST \
              --url "${BASE_URL}/rest/v1/research_jobs" \
              --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Content-Type: application/json" \
              --header "Prefer: return=minimal" \
              --data-binary @/tmp/verification_job.json

            echo "Independent verification queued."

          fi


      # =========================================================
      # 15. ジョブ完了
      # =========================================================

      - name: Complete job
        if: steps.claim_job.outputs.job_claimed == 'true' && success()
        run: |
          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          JOB_ID=$(python3 -c \
            'import json; print(json.load(open("/tmp/job.json"))["id"])')

          FINISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          curl \
            --silent \
            --show-error \
            --fail \
            --request PATCH \
            --url "${BASE_URL}/rest/v1/research_jobs?id=eq.${JOB_ID}&status=eq.running" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=minimal" \
            --data "{\"status\":\"completed\",\"finished_at\":\"${FINISHED_AT}\"}"

          echo "JOB COMPLETED: ${JOB_ID}"


      # =========================================================
      # 16. 失敗
      # =========================================================

      - name: Mark failed
        if: steps.claim_job.outputs.job_claimed == 'true' && failure()
        run: |
          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          if [ ! -f /tmp/job.json ]; then
            echo "No job file. Nothing to mark."
            exit 0
          fi

          JOB_ID=$(python3 -c \
            'import json; print(json.load(open("/tmp/job.json"))["id"])')

          FINISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          curl \
            --silent \
            --show-error \
            --request PATCH \
            --url "${BASE_URL}/rest/v1/research_jobs?id=eq.${JOB_ID}&status=eq.running" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=minimal" \
            --data "{\"status\":\"failed\",\"error_message\":\"GitHub Actions research worker failed\",\"finished_at\":\"${FINISHED_AT}\"}" \
            || true

          echo "JOB MARKED FAILED: ${JOB_ID}"
