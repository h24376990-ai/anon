name: Math Research Lab

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

# 同じworkerが同時に走って同じジョブを取る事故を防止
concurrency:
  group: math-research-worker
  cancel-in-progress: false

jobs:
  research:
    name: AI Research Worker
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # =========================================================
      # 1. キューからジョブ取得
      # =========================================================

      - name: Get queued research job
        id: get_job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/jobs.json \
            --write-out "%{http_code}" \
            --request GET \
            --url "${BASE_URL}/rest/v1/research_jobs?select=*&status=eq.queued&order=priority.desc,created_at.asc&limit=1" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json")

          echo "HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" != "200" ]; then
            cat /tmp/jobs.json
            exit 1
          fi

          python3 <<'PY'
          import json

          with open("/tmp/jobs.json", "r", encoding="utf-8") as f:
              jobs = json.load(f)

          if not jobs:
              print("Queue empty.")
              open("/tmp/job_exists", "w").write("false")

          else:
              job = jobs[0]

              print("Queued job:", job["id"])

              with open("/tmp/job.json", "w", encoding="utf-8") as f:
                  json.dump(job, f, ensure_ascii=False)

              open("/tmp/job_exists", "w").write("true")
          PY

          echo "job_exists=$(cat /tmp/job_exists)" >> "$GITHUB_OUTPUT"


      # =========================================================
      # 2. runningへ変更
      # =========================================================

      - name: Start job
        if: steps.get_job.outputs.job_exists == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          JOB_ID=$(python3 -c \
            'import json; print(json.load(open("/tmp/job.json"))["id"])')

          STARTED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          RESPONSE=$(curl \
            --silent \
            --show-error \
            --output /tmp/start_response.json \
            --write-out "%{http_code}" \
            --request PATCH \
            --url "${BASE_URL}/rest/v1/research_jobs?id=eq.${JOB_ID}&status=eq.queued" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=representation" \
            --data "{\"status\":\"running\",\"started_at\":\"${STARTED_AT}\"}")

          if [ "${RESPONSE}" -lt 200 ] || [ "${RESPONSE}" -ge 300 ]; then
            cat /tmp/start_response.json
            exit 1
          fi


      # =========================================================
      # 3. 過去研究を取得
      #
      # これが非常に重要
      # =========================================================

      - name: Load previous research memory
        if: steps.get_job.outputs.job_exists == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          PROJECT_ID=$(python3 -c \
            'import json; print(json.load(open("/tmp/job.json"))["project_id"])')

          curl \
            --silent \
            --show-error \
            --fail \
            --url "${BASE_URL}/rest/v1/research_results?select=id,title,hypothesis,content,evaluation,confidence_level,created_at&project_id=eq.${PROJECT_ID}&order=created_at.desc&limit=100" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            > /tmp/previous_results.json

          echo "Previous research loaded."

          python3 <<'PY'
          import json

          with open("/tmp/previous_results.json", "r", encoding="utf-8") as f:
              rows = json.load(f)

          memory = []

          for r in rows:
              content = r.get("content")

              if isinstance(content, str):
                  try:
                      content = json.loads(content)
                  except:
                      pass

              memory.append({
                  "title": r.get("title"),
                  "hypothesis": r.get("hypothesis"),
                  "evaluation": r.get("evaluation"),
                  "confidence": r.get("confidence_level"),
                  "content": content
              })

          with open("/tmp/research_memory.json", "w", encoding="utf-8") as f:
              json.dump(
                  memory,
                  f,
                  ensure_ascii=False
              )

          print("Memory entries:", len(memory))
          PY


      # =========================================================
      # 4. 論文検索
      #
      # arXivを直接検索
      # =========================================================

      - name: Search mathematical literature
        if: steps.get_job.outputs.job_exists == 'true'
        run: |
          set -e

          python3 <<'PY'
          import json
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          with open("/tmp/job.json", "r", encoding="utf-8") as f:
              job = json.load(f)

          theme = str(
              (job.get("payload") or {}).get("theme", "")
          ).strip()

          query = urllib.parse.quote(
              theme
          )

          url = (
              "https://export.arxiv.org/api/query?"
              "search_query=all:"
              + query +
              "&start=0&max_results=8"
          )

          papers = []

          try:
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                      "ResearchAILab/1.0"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=12
              ) as response:

                  xml_data = response.read()

              root = ET.fromstring(xml_data)

              ns = {
                  "a":
                  "http://www.w3.org/2005/Atom"
              }

              for entry in root.findall(
                  "a:entry",
                  ns
              ):

                  title = entry.findtext(
                      "a:title",
                      default="",
                      namespaces=ns
                  )

                  summary = entry.findtext(
                      "a:summary",
                      default="",
                      namespaces=ns
                  )

                  link = ""

                  for l in entry.findall(
                      "a:link",
                      ns
                  ):

                      if l.attrib.get(
                          "type"
                      ) == "text/html":

                          link = l.attrib.get(
                              "href",
                              ""
                          )

                  papers.append({
                      "title": " ".join(
                          title.split()
                      ),
                      "summary": " ".join(
                          summary.split()
                      ),
                      "url": link
                  })

          except Exception as e:

              print(
                  "Literature search failed:",
                  e
              )

          with open(
              "/tmp/literature.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  papers,
                  f,
                  ensure_ascii=False
              )

          print(
              "Literature found:",
              len(papers)
          )
          PY


      # =========================================================
      # 5. 強化研究プロンプト
      # =========================================================

      - name: Build research prompt
        if: steps.get_job.outputs.job_exists == 'true'
        run: |
          set -e

          python3 <<'PY'
          import json

          with open("/tmp/job.json", "r", encoding="utf-8") as f:
              job = json.load(f)

          with open(
              "/tmp/research_memory.json",
              "r",
              encoding="utf-8"
          ) as f:
              memory = json.load(f)

          with open(
              "/tmp/literature.json",
              "r",
              encoding="utf-8"
          ) as f:
              literature = json.load(f)

          theme = str(
              (job.get("payload") or {}).get(
                  "theme",
                  ""
              )
          ).strip()

          # 過去研究を巨大にしすぎない
          memory_text = json.dumps(
              memory[:100],
              ensure_ascii=False
          )[:50000]

          literature_text = json.dumps(
              literature,
              ensure_ascii=False
          )[:20000]

          prompt = f"""
You are the research engine of an autonomous mathematical research laboratory.

TARGET:
{theme}

You are NOT a normal question-answering AI.

Your task is to perform mathematical research.

IMPORTANT:

The existence of a famous problem does NOT mean you should repeat
the standard textbook explanation.

You must search for a genuinely different research direction.

==================================================
ANTI-REDUNDANCY RULES
==================================================

1. Compare the proposed approach with previous research below.

2. Do not simply restate known mathematics.

3. Do not call a standard theorem "new".

4. If the approach is essentially identical to known mathematics,
   reject it and generate a different direction.

5. Do not reuse a route that has already failed repeatedly.

6. A route used 3 or more times must be considered BLOCKED.

7. Try a different mathematical representation if necessary.

8. Consider contradiction, reverse reasoning, structural reformulation,
   computational evidence, cross-domain connections, or another
   genuinely different route.

9. Search for counterexamples before believing a conjecture.

10. Numerical experiments are evidence, NOT proof.

==================================================
ANTI-HALLUCINATION RULES
==================================================

11. Separate:
    - established mathematical facts
    - literature-supported statements
    - assumptions
    - conjectures
    - original hypotheses

12. Never invent a citation.

13. Never say a paper proves something unless the supplied literature
    actually supports that claim.

14. Never say a conjecture is solved merely because the AI found
    a plausible argument.

15. Identify the exact logical gap.

16. Every proof attempt must include a possible failure point.

17. Every promising idea must include a counterexample strategy.

18. A result cannot become a mathematical proof merely because
    confidence is high.

==================================================
INDEPENDENT VERIFICATION
==================================================

Before assigning a promising status:

- attack your own argument
- search for a counterexample
- inspect every implication
- distinguish equivalence from implication
- distinguish numerical evidence from proof
- identify missing assumptions
- identify hidden use of the conclusion

==================================================
PAST RESEARCH
==================================================

{memory_text}

==================================================
LITERATURE SEARCH
==================================================

{literature_text}

==================================================
OUTPUT
==================================================

Return ONLY valid JSON.

Required keys:

title
hypothesis
research_question
known_facts
literature_checked
assumptions
approach
proof_strategy
counterexample_strategy
cross_domain_connection
novelty_assessment
previous_route_comparison
critical_gap
independent_verification
next_steps
route_signature
status
confidence

status must be one of:

candidate
promising
uncertain
rejected
needs_verification

confidence must be between 0 and 1.

route_signature must be a concise description of the mathematical
route, not merely the problem name.

If a route is substantially the same as a previous route,
do NOT disguise it with different wording.

If no genuinely new route can currently be found,
return:

status = "needs_verification"

and explain why in critical_gap.

NEVER claim the Riemann Hypothesis or another famous open problem
has been proven unless a complete, independently checkable proof
has actually been established.
"""

          with open(
              "/tmp/prompt.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(prompt)

          print(
              "Enhanced research prompt created."
          )
          PY


      # =========================================================
      # 6. OpenRouter
      # =========================================================

      - name: Call OpenRouter
        if: steps.get_job.outputs.job_exists == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -e

          python3 <<'PY'
          import json

          with open(
              "/tmp/prompt.txt",
              "r",
              encoding="utf-8"
          ) as f:

              prompt = f.read()

          request = {
              "model":
                  "nvidia/nemotron-3-ultra-550b-a55b:free",

              "messages": [

                  {
                      "role": "system",
                      "content":
                      (
                          "You are a rigorous "
                          "mathematics research AI. "
                          "Never claim unproven "
                          "mathematics is proven. "
                          "Return valid JSON only."
                      )
                  },

                  {
                      "role": "user",
                      "content": prompt
                  }

              ],

              "temperature": 0.15,

              "max_tokens": 12000
          }

          with open(
              "/tmp/request.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  request,
                  f,
                  ensure_ascii=False
              )
          PY

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/ai.json \
            --write-out "%{http_code}" \
            --request POST \
            --url "https://openrouter.ai/api/v1/chat/completions" \
            --header "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/request.json)

          echo "OpenRouter HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            cat /tmp/ai.json
            exit 1
          fi

          python3 <<'PY'
          import json

          with open(
              "/tmp/ai.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          content = data[
              "choices"
          ][0][
              "message"
          ][
              "content"
          ]

          with open(
              "/tmp/ai_text.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(content)

          print("AI response received.")
          PY


      # =========================================================
      # 7. 結果検証 + 3回ルート遮断
      # =========================================================

      - name: Validate and block repeated routes
        if: steps.get_job.outputs.job_exists == 'true'
        run: |
          set -e

          python3 <<'PY'
          import json
          import re
          import hashlib

          with open(
              "/tmp/ai_text.txt",
              "r",
              encoding="utf-8"
          ) as f:

              raw = f.read().strip()

          raw = re.sub(
              r"^```(?:json)?\s*",
              "",
              raw,
              flags=re.I
          )

          raw = re.sub(
              r"\s*```$",
              "",
              raw
          )

          try:

              result = json.loads(raw)

          except json.JSONDecodeError:

              match = re.search(
                  r"\{.*\}",
                  raw,
                  re.S
              )

              if not match:
                  raise SystemExit(
                      "AI JSON not found."
                  )

              result = json.loads(
                  match.group(0)
              )

          route = str(
              result.get(
                  "route_signature",
                  ""
              )
          ).strip().lower()

          if not route:
              route = "unknown-route"

          # ルートの正規化
          normalized_route = re.sub(
              r"\s+",
              " ",
              route
          )

          normalized_route = re.sub(
              r"[^\wぁ-んァ-ヶ一-龠 ]",
              "",
              normalized_route
          ).strip()

          route_hash = hashlib.sha256(
              normalized_route.encode(
                  "utf-8"
              )
          ).hexdigest()[:16]

          with open(
              "/tmp/research_memory.json",
              "r",
              encoding="utf-8"
          ) as f:

              previous = json.load(f)

          attempts = 0

          for item in previous:

              content = item.get(
                  "content"
              )

              if isinstance(
                  content,
                  str
              ):

                  try:
                      content = json.loads(
                          content
                      )
                  except:
                      continue

              if not isinstance(
                  content,
                  dict
              ):
                  continue

              old_hash = content.get(
                  "route_hash"
              )

              if old_hash == route_hash:
                  attempts += 1

          print(
              "Route:",
              normalized_route
          )

          print(
              "Route hash:",
              route_hash
          )

          print(
              "Previous attempts:",
              attempts
          )

          # 3回以上なら遮断
          if attempts >= 3:

              result["status"] = "rejected"

              result["confidence"] = 0

              result["critical_gap"] = (
                  "この研究ルートは過去に"
                  f"{attempts}回使用されており、"
                  "同一ルート3回以上のため"
                  "自動的に遮断された。"
              )

              result["next_steps"] = [
                  "既存ルートを使用しない",
                  "別の数学的表現を探す",
                  "別方向から再構成する",
                  "反例探索を行う"
              ]

              evaluation = "❌"

          else:

              confidence = float(
                  result.get(
                      "confidence",
                      0
                  ) or 0
              )

              confidence = max(
                  0,
                  min(
                      1,
                      confidence
                  )
              )

              status = str(
                  result.get(
                      "status",
                      ""
                  )
              ).lower()

              # AIがpromisingと言っても
              # 自動的に⭕にはしない
              if (
                  status == "promising"
                  and confidence >= 0.8
                  and result.get(
                      "independent_verification"
                  )
                  and result.get(
                      "counterexample_strategy"
                  )
                  and result.get(
                      "critical_gap"
                  )
              ):
                  evaluation = "△"
              elif status == "rejected":
                  evaluation = "❌"
              else:
                  evaluation = "△"

          confidence = float(
              result.get(
                  "confidence",
                  0
              ) or 0
          )

          confidence = max(
              0,
              min(
                  1,
                  confidence
              )
          )

          confidence_level = round(
              confidence * 5
          )

          with open(
              "/tmp/job.json",
              "r",
              encoding="utf-8"
          ) as f:

              job = json.load(f)

          content = {

              "research_question":
                  result.get(
                      "research_question"
                  ),

              "known_facts":
                  result.get(
                      "known_facts",
                      []
                  ),

              "literature_checked":
                  result.get(
                      "literature_checked",
                      []
                  ),

              "assumptions":
                  result.get(
                      "assumptions",
                      []
                  ),

              "approach":
                  result.get(
                      "approach",
                      []
                  ),

              "proof_strategy":
                  result.get(
                      "proof_strategy",
                      []
                  ),

              "counterexample_strategy":
                  result.get(
                      "counterexample_strategy",
                      []
                  ),

              "cross_domain_connection":
                  result.get(
                      "cross_domain_connection",
                      []
                  ),

              "novelty_assessment":
                  result.get(
                      "novelty_assessment"
                  ),

              "previous_route_comparison":
                  result.get(
                      "previous_route_comparison"
                  ),

              "independent_verification":
                  result.get(
                      "independent_verification"
                  ),

              "critical_gap":
                  result.get(
                      "critical_gap"
                  ),

              "next_steps":
                  result.get(
                      "next_steps",
                      []
                  ),

              "route_signature":
                  normalized_route,

              "route_hash":
                  route_hash,

              "route_attempts":
                  attempts,

              "source_job_id":
                  job["id"],

              "research_configuration":
                  job.get(
                      "payload",
                      {}
                  )
          }

          record = {

              "project_id":
                  job["project_id"],

              "title":
                  str(
                      result.get(
                          "title",
                          "AI研究回答"
                      )
                  ),

              "hypothesis":
                  str(
                      result.get(
                          "hypothesis",
                          ""
                      )
                  ),

              "content":
                  json.dumps(
                      content,
                      ensure_ascii=False
                  ),

              "status":
                  "pending",

              "evaluation":
                  evaluation,

              "confidence_level":
                  confidence_level,

              "is_human_saved":
                  False
          }

          with open(
              "/tmp/result.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  record,
                  f,
                  ensure_ascii=False
              )

          print(
              "Evaluation:",
              evaluation
          )

          print(
              "Confidence:",
              confidence
          )

          print(
              "Route attempts:",
              attempts
          )
          PY


      # =========================================================
      # 8. 保存
      # =========================================================

      - name: Save result
        if: steps.get_job.outputs.job_exists == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/save.json \
            --write-out "%{http_code}" \
            --request POST \
            --url "${BASE_URL}/rest/v1/research_results" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=minimal" \
            --data-binary @/tmp/result.json)

          echo "Supabase insert HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            cat /tmp/save.json
            exit 1
          fi


      # =========================================================
      # 9. 完了
      # =========================================================

      - name: Complete job
        if: steps.get_job.outputs.job_exists == 'true' && success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          JOB_ID=$(python3 -c \
            'import json; print(json.load(open("/tmp/job.json"))["id"])')

          FINISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          curl \
            --silent \
            --show-error \
            --fail \
            --request PATCH \
            --url "${BASE_URL}/rest/v1/research_jobs?id=eq.${JOB_ID}&status=eq.running" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=minimal" \
            --data "{\"status\":\"completed\",\"finished_at\":\"${FINISHED_AT}\"}"

          echo "JOB COMPLETED: ${JOB_ID}"


      # =========================================================
      # 10. 失敗
      # =========================================================

      - name: Mark failed
        if: steps.get_job.outputs.job_exists == 'true' && failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          JOB_ID=$(python3 -c \
            'import json; print(json.load(open("/tmp/job.json"))["id"])')

          FINISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          curl \
            --silent \
            --show-error \
            --request PATCH \
            --url "${BASE_URL}/rest/v1/research_jobs?id=eq.${JOB_ID}&status=eq.running" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=minimal" \
            --data "{\"status\":\"failed\",\"error_message\":\"GitHub Actions research worker failed\",\"finished_at\":\"${FINISHED_AT}\"}" \
            || true

          echo "JOB MARKED FAILED: ${JOB_ID}"
