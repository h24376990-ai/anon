name: Math Research Lab

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:

  research:

    name: AI Research Worker

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      - name: Get queued research job

        id: get_job

        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |

          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/jobs.json \
            --write-out "%{http_code}" \
            --request GET \
            --url "${BASE_URL}/rest/v1/research_jobs?select=*&status=eq.queued&order=priority.desc,created_at.asc&limit=1" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json")

          echo "HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" != "200" ]; then
            cat /tmp/jobs.json
            exit 1
          fi

          python3 - <<'PY'

          import json

          with open(
              "/tmp/jobs.json",
              "r",
              encoding="utf-8"
          ) as f:
              jobs = json.load(f)

          if not jobs:

              print("Queue empty.")

              with open(
                  "/tmp/job_exists",
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write("false")

          else:

              job = jobs[0]

              print(
                  "Queued job:",
                  job["id"]
              )

              with open(
                  "/tmp/job.json",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      job,
                      f,
                      ensure_ascii=False
                  )

              with open(
                  "/tmp/job_exists",
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write("true")

          PY

          echo \
            "job_exists=$(cat /tmp/job_exists)" \
            >> "$GITHUB_OUTPUT"


      - name: Start job

        if: steps.get_job.outputs.job_exists == 'true'

        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |

          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          JOB_ID=$(
            python3 -c \
            'import json;print(json.load(open("/tmp/job.json"))["id"])'
          )

          STARTED_AT=$(
            date -u +"%Y-%m-%dT%H:%M:%SZ"
          )

          curl \
            --silent \
            --show-error \
            --fail \
            --request PATCH \
            --url \
            "${BASE_URL}/rest/v1/research_jobs?id=eq.${JOB_ID}&status=eq.queued" \
            --header \
            "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header \
            "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header \
            "Content-Type: application/json" \
            --data \
            "{\"status\":\"running\",\"started_at\":\"${STARTED_AT}\"}"


      - name: Build research prompt

        if: steps.get_job.outputs.job_exists == 'true'

        run: |

          python3 - <<'PY'

          import json

          with open(
              "/tmp/job.json",
              "r",
              encoding="utf-8"
          ) as f:
              job = json.load(f)

          payload =
              job.get("payload", {})

          theme =
              payload.get(
                  "theme",
                  ""
              )

          prompt = f"""

You are the research engine of an autonomous mathematical research laboratory.

Research theme:

{theme}

Return ONLY valid JSON.

Required keys:

title
hypothesis
research_question
known_facts
assumptions
approach
proof_strategy
counterexample_strategy
cross_domain_connection
critical_gap
next_steps
status
confidence

Allowed status:

candidate
promising
uncertain
rejected
needs_verification

confidence must be between 0 and 1.

Rules:

1. Never claim an unproven statement is proven.
2. Separate known facts from hypotheses.
3. Never invent citations.
4. Numerical evidence is not proof.
5. Search for counterexamples.
6. Identify the biggest logical gap.
7. Suggest concrete next mathematical steps.
8. Prefer a genuinely different research direction.

"""

          with open(
              "/tmp/prompt.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  prompt
              )

          PY


      - name: Check cancellation before AI

        if: steps.get_job.outputs.job_exists == 'true'

        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |

          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          JOB_ID=$(
            python3 -c \
            'import json;print(json.load(open("/tmp/job.json"))["id"])'
          )

          STATUS=$(
            curl \
              --silent \
              --fail \
              --url \
              "${BASE_URL}/rest/v1/research_jobs?select=status&id=eq.${JOB_ID}" \
              --header \
              "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header \
              "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" |
            python3 -c \
            'import json,sys; a=json.load(sys.stdin); print(a[0]["status"] if a else "missing")'
          )

          echo "Current job status: ${STATUS}"

          if [ "${STATUS}" != "running" ]; then
            echo "Job was cancelled."
            exit 1
          fi


      - name: Call OpenRouter

        if: steps.get_job.outputs.job_exists == 'true'

        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

        run: |

          set -e

          python3 - <<'PY'

          import json

          prompt = open(
              "/tmp/prompt.txt",
              encoding="utf-8"
          ).read()

          request = {

              "model":
                  "nvidia/nemotron-3-ultra-550b-a55b:free",

              "messages": [

                  {
                      "role":
                          "system",

                      "content":
                          "You are a rigorous mathematics research AI. Return valid JSON only."
                  },

                  {
                      "role":
                          "user",

                      "content":
                          prompt
                  }

              ],

              "temperature":
                  0.2,

              "max_tokens":
                  10000
          }

          with open(
              "/tmp/request.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  request,
                  f,
                  ensure_ascii=False
              )

          PY


          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/ai.json \
            --write-out "%{http_code}" \
            --request POST \
            --url \
            "https://openrouter.ai/api/v1/chat/completions" \
            --header \
            "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            --header \
            "Content-Type: application/json" \
            --data-binary \
            @/tmp/request.json)

          echo \
            "OpenRouter HTTP status: ${HTTP_STATUS}"


          if [
            "${HTTP_STATUS}" -lt 200
          ] || [
            "${HTTP_STATUS}" -ge 300
          ]; then

            cat /tmp/ai.json

            exit 1

          fi


          python3 - <<'PY'

          import json

          with open(
              "/tmp/ai.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          content =
              data[
                  "choices"
              ][0][
                  "message"
              ][
                  "content"
              ]

          with open(
              "/tmp/ai_text.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  content
              )

          print(
              "AI response received."
          )

          PY


      - name: Validate AI result

        if: steps.get_job.outputs.job_exists == 'true'

        run: |

          set -e

          python3 - <<'PY'

          import json
          import re

          raw = open(
              "/tmp/ai_text.txt",
              encoding="utf-8"
          ).read().strip()

          match =
              re.search(
                  r"\{.*\}",
                  raw,
                  re.S
              )

          if not match:
              raise SystemExit(
                  "AI JSON not found."
              )

          result =
              json.loads(
                  match.group(0)
              )

          confidence =
              float(
                  result.get(
                      "confidence",
                      0
                  ) or 0
              )

          confidence =
              max(
                  0,
                  min(
                      1,
                      confidence
                  )
              )

          confidence_level =
              round(
                  confidence * 5
              )

          status =
              str(
                  result.get(
                      "status",
                      ""
                  )
              ).lower()

          if (
              status in
              [
                  "promising",
                  "candidate"
              ]
              and
              confidence >= 0.8
          ):

              evaluation = "⭕️"

          elif status == "rejected":

              evaluation = "❌"

          else:

              evaluation = "△"


          with open(
              "/tmp/job.json",
              "r",
              encoding="utf-8"
          ) as f:
              job = json.load(f)


          content = {

              "research_question":
                  result.get(
                      "research_question"
                  ),

              "known_facts":
                  result.get(
                      "known_facts",
                      []
                  ),

              "assumptions":
                  result.get(
                      "assumptions",
                      []
                  ),

              "approach":
                  result.get(
                      "approach",
                      []
                  ),

              "proof_strategy":
                  result.get(
                      "proof_strategy",
                      []
                  ),

              "counterexample_strategy":
                  result.get(
                      "counterexample_strategy",
                      []
                  ),

              "cross_domain_connection":
                  result.get(
                      "cross_domain_connection",
                      []
                  ),

              "critical_gap":
                  result.get(
                      "critical_gap"
                  ),

              "next_steps":
                  result.get(
                      "next_steps",
                      []
                  ),

              "source_job_id":
                  job["id"],

              "research_configuration":
                  job.get(
                      "payload",
                      {}
                  )

          }


          record = {

              "project_id":
                  job["project_id"],

              "title":
                  str(
                      result.get(
                          "title",
                          "AI研究回答"
                      )
                  ),

              "hypothesis":
                  str(
                      result.get(
                          "hypothesis",
                          ""
                      )
                  ),

              "content":
                  json.dumps(
                      content,
                      ensure_ascii=False
                  ),

              "status":
                  "pending",

              "evaluation":
                  evaluation,

              "confidence_level":
                  confidence_level,

              "is_human_saved":
                  False
          }


          with open(
              "/tmp/result.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  record,
                  f,
                  ensure_ascii=False
              )


          print(
              "Prepared research result."
          )

          print(
              "Evaluation:",
              evaluation
          )

          print(
              "Confidence level:",
              confidence_level
          )

          PY


      - name: Save result unless cancelled

        if: steps.get_job.outputs.job_exists == 'true'

        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |

          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          JOB_ID=$(
            python3 -c \
            'import json;print(json.load(open("/tmp/job.json"))["id"])'
          )


          STATUS=$(
            curl \
              --silent \
              --fail \
              --url \
              "${BASE_URL}/rest/v1/research_jobs?select=status&id=eq.${JOB_ID}" \
              --header \
              "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header \
              "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" |
            python3 -c \
            'import json,sys; print(json.load(sys.stdin)[0]["status"])'
          )


          if [
            "${STATUS}" != "running"
          ]; then

            echo \
              "Job was cancelled. Result will NOT be saved."

            exit 0

          fi


          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/save.json \
            --write-out "%{http_code}" \
            --request POST \
            --url \
            "${BASE_URL}/rest/v1/research_results" \
            --header \
            "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header \
            "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header \
            "Content-Type: application/json" \
            --data-binary \
            @/tmp/result.json)


          echo \
            "Supabase insert HTTP status: ${HTTP_STATUS}"


          cat /tmp/save.json


          if [
            "${HTTP_STATUS}" -lt 200
          ] || [
            "${HTTP_STATUS}" -ge 300
          ]; then

            exit 1

          fi


          echo \
            "RESEARCH RESULT SAVED SUCCESSFULLY"


      - name: Complete job

        if: steps.get_job.outputs.job_exists == 'true' && success()

        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |

          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          JOB_ID=$(
            python3 -c \
            'import json;print(json.load(open("/tmp/job.json"))["id"])'
          )


          curl \
            --silent \
            --show-error \
            --fail \
            --request PATCH \
            --url \
            "${BASE_URL}/rest/v1/research_jobs?id=eq.${JOB_ID}&status=eq.running" \
            --header \
            "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header \
            "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header \
            "Content-Type: application/json" \
            --data \
            "{\"status\":\"completed\",\"finished_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"


      - name: Mark failed

        if: steps.get_job.outputs.job_exists == 'true' && failure()

        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          JOB_ID=$(
            python3 -c \
            'import json;print(json.load(open("/tmp/job.json"))["id"])'
          )


          curl \
            --silent \
            --show-error \
            --request PATCH \
            --url \
            "${BASE_URL}/rest/v1/research_jobs?id=eq.${JOB_ID}&status=eq.running" \
            --header \
            "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header \
            "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header \
            "Content-Type: application/json" \
            --data \
            "{\"status\":\"failed\",\"error_message\":\"GitHub Actions research worker failed\",\"finished_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
            || true
