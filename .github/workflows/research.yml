name: Math Research Lab

on:
  workflow_dispatch:

  schedule:
    # 5分ごとにキューを確認
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: math-research-worker
  cancel-in-progress: false

jobs:

  research:
    name: AI Research Worker
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # =========================================================
      # 1. 環境確認
      # =========================================================

      - name: Check environment
        run: |
          set -e

          python3 --version
          curl --version | head -1

          echo "Math Research Lab worker started."


      # =========================================================
      # 2. キューから最大3件取得
      # =========================================================

      - name: Get queued research jobs
        id: get_jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |

          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/jobs.json \
            --write-out "%{http_code}" \
            --request GET \
            --url "${BASE_URL}/rest/v1/research_jobs?select=*&status=eq.queued&order=priority.desc,created_at.asc&limit=3" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json")

          echo "HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" != "200" ]; then
            cat /tmp/jobs.json
            exit 1
          fi

          python3 <<'PY'
          import json

          with open("/tmp/jobs.json", "r", encoding="utf-8") as f:
              jobs = json.load(f)

          print("Queued jobs:", len(jobs))

          with open("/tmp/job_count", "w", encoding="utf-8") as f:
              f.write(str(len(jobs)))

          for i, job in enumerate(jobs):

              with open(
                  f"/tmp/job_{i}.json",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      job,
                      f,
                      ensure_ascii=False
                  )

              print(
                  f"Job {i}: {job.get('id')}"
              )
          PY

          echo "job_count=$(cat /tmp/job_count)" >> "$GITHUB_OUTPUT"


      # =========================================================
      # 3. 最大3ジョブを順番に処理
      # =========================================================

      - name: Process research jobs
        if: steps.get_jobs.outputs.job_count != '0'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |

          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          JOB_COUNT=$(cat /tmp/job_count)

          echo "Processing ${JOB_COUNT} research job(s)."

          for INDEX in $(seq 0 $((JOB_COUNT - 1))); do

            echo ""
            echo "================================================="
            echo "PROCESSING JOB ${INDEX}"
            echo "================================================="

            JOB_FILE="/tmp/job_${INDEX}.json"

            JOB_ID=$(python3 -c \
              "import json; print(json.load(open('${JOB_FILE}'))['id'])")

            echo "JOB ID: ${JOB_ID}"


            # =====================================================
            # 3-1. queued → running
            # =====================================================

            STARTED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

            START_STATUS=$(curl \
              --silent \
              --show-error \
              --output "/tmp/start_${INDEX}.json" \
              --write-out "%{http_code}" \
              --request PATCH \
              --url "${BASE_URL}/rest/v1/research_jobs?id=eq.${JOB_ID}&status=eq.queued" \
              --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Content-Type: application/json" \
              --header "Prefer: return=representation" \
              --data "{\"status\":\"running\",\"started_at\":\"${STARTED_AT}\"}")

            echo "Start HTTP: ${START_STATUS}"

            if [ "${START_STATUS}" -lt 200 ] || [ "${START_STATUS}" -ge 300 ]; then
              cat "/tmp/start_${INDEX}.json"
              continue
            fi


            # =====================================================
            # 3-2. テーマ取得
            # =====================================================

            THEME=$(python3 -c \
              "import json; j=json.load(open('${JOB_FILE}')); print(str((j.get('payload') or {}).get('theme','')).strip())")

            if [ -z "${THEME}" ]; then

              echo "Theme is empty."

              curl \
                --silent \
                --show-error \
                --request PATCH \
                --url "${BASE_URL}/rest/v1/research_jobs?id=eq.${JOB_ID}&status=eq.running" \
                --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
                --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                --header "Content-Type: application/json" \
                --data "{\"status\":\"failed\",\"error_message\":\"Research theme is empty\"}" \
                || true

              continue

            fi

            echo "THEME: ${THEME}"


            # =====================================================
            # 3-3. キャンセル確認
            # =====================================================

            CURRENT_STATUS=$(curl \
              --silent \
              --show-error \
              --fail \
              --url "${BASE_URL}/rest/v1/research_jobs?select=status&id=eq.${JOB_ID}" \
              --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" |
              python3 -c \
              'import json,sys; a=json.load(sys.stdin); print(a[0]["status"] if a else "missing")')

            if [ "${CURRENT_STATUS}" != "running" ]; then
              echo "Job cancelled or unavailable."
              continue
            fi


            # =====================================================
            # 3-4. 過去研究取得
            # =====================================================

            ENCODED_PROJECT=$(python3 -c \
              "import urllib.parse; print(urllib.parse.quote('${{ vars.PROJECT_ID }}'))")

            PROJECT_ID=$(python3 -c \
              "import json; print(json.load(open('${JOB_FILE}'))['project_id'])")

            curl \
              --silent \
              --show-error \
              --fail \
              --url "${BASE_URL}/rest/v1/research_results?select=id,title,hypothesis,content,evaluation,confidence_level,created_at&project_id=eq.${PROJECT_ID}&order=created_at.desc&limit=30" \
              --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              --output "/tmp/history_${INDEX}.json"


            # =====================================================
            # 3-5. Claude等の外部メモ取得
            # =====================================================

            curl \
              --silent \
              --show-error \
              --fail \
              --url "${BASE_URL}/rest/v1/research_memos?select=id,title,content,created_at,updated_at&project_id=eq.${PROJECT_ID}&order=created_at.desc&limit=20" \
              --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              --output "/tmp/memos_${INDEX}.json"


            # =====================================================
            # 3-6. OpenAlex 文献検索
            #
            # APIキー不要
            # =====================================================

            python3 <<PY
          import urllib.parse
          import subprocess

          theme = """${THEME}"""

          query = urllib.parse.quote(theme)

          url = (
              "https://api.openalex.org/works"
              "?search=" + query +
              "&per-page=8"
          )

          print("Searching OpenAlex...")

          subprocess.run([
              "curl",
              "--silent",
              "--show-error",
              "--fail",
              "--url",
              url,
              "--output",
              "/tmp/openalex_${INDEX}.json"
          ], check=True)
          PY


            # =====================================================
            # 3-7. 研究ルート分析
            # =====================================================

            python3 <<PY
          import json
          import hashlib
          import re

          job = json.load(
              open("${JOB_FILE}", encoding="utf-8")
          )

          history = json.load(
              open("/tmp/history_${INDEX}.json", encoding="utf-8")
          )

          memos = json.load(
              open("/tmp/memos_${INDEX}.json", encoding="utf-8")
          )

          theme = """${THEME}""".strip()


          # -----------------------------------------------------
          # 研究テーマから簡易ルートキーを作る
          # -----------------------------------------------------

          normalized = theme.lower()

          normalized = re.sub(
              r"\s+",
              " ",
              normalized
          )

          normalized = re.sub(
              r"[^\w\sぁ-んァ-ヶ一-龯]",
              " ",
              normalized
          )

          tokens = normalized.split()

          route_base = "|".join(
              tokens[:12]
          )

          route_key = hashlib.sha256(
              route_base.encode("utf-8")
          ).hexdigest()[:32]


          # -----------------------------------------------------
          # 過去結果からルート・テーマの近似を調べる
          # -----------------------------------------------------

          related = []

          theme_words = set(tokens)

          for item in history:

              text = " ".join([
                  str(item.get("title") or ""),
                  str(item.get("hypothesis") or ""),
                  str(item.get("content") or "")
              ]).lower()

              score = 0

              for word in theme_words:

                  if len(word) >= 2 and word in text:
                      score += 1

              if score >= 2:
                  related.append(item)


          route_attempts = len(related)


          # 3回以上なら遮断
          blocked = route_attempts >= 3


          data = {
              "route_key": route_key,
              "route_base": route_base,
              "route_attempts": route_attempts,
              "blocked": blocked,
              "related_results": related[:10],
              "memos": memos[:20]
          }


          with open(
              "/tmp/context_${INDEX}.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False
              )


          print("Route:", route_key)
          print("Previous related attempts:", route_attempts)
          print("Blocked:", blocked)
          PY


            # =====================================================
            # 3-8. 3回以上なら研究ルート遮断
            # =====================================================

            BLOCKED=$(python3 -c \
              "import json; print(str(json.load(open('/tmp/context_${INDEX}.json'))['blocked']).lower())")

            if [ "${BLOCKED}" = "true" ]; then

              echo "Research route blocked after 3+ attempts."

              FINISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

              curl \
                --silent \
                --show-error \
                --request PATCH \
                --url "${BASE_URL}/rest/v1/research_jobs?id=eq.${JOB_ID}&status=eq.running" \
                --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
                --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                --header "Content-Type: application/json" \
                --data "{\"status\":\"completed\",\"finished_at\":\"${FINISHED_AT}\",\"result\":{\"route_blocked\":true,\"reason\":\"Same research route attempted three or more times.\"}}"

              continue

            fi


            # =====================================================
            # 3-9. AI研究プロンプト生成
            # =====================================================

            python3 <<PY

          import json

          context = json.load(
              open(
                  "/tmp/context_${INDEX}.json",
                  encoding="utf-8"
              )
          )

          openalex = json.load(
              open(
                  "/tmp/openalex_${INDEX}.json",
                  encoding="utf-8"
              )
          )

          works = []

          for work in openalex.get("results", []):

              works.append({
                  "title": work.get("title"),
                  "publication_year": work.get("publication_year"),
                  "doi": work.get("doi"),
                  "primary_location": (
                      work.get("primary_location") or {}
                  ).get("landing_page_url")
              })


          history = context.get(
              "related_results",
              []
          )

          memos = context.get(
              "memos",
              []
          )


          prompt = f"""

You are the research engine of an autonomous mathematical research laboratory.

You are NOT a normal chatbot.

Your task is to perform a genuinely investigative mathematical research cycle.

==================================================
RESEARCH THEME
==================================================

{THEME}

==================================================
ABSOLUTE RULES
==================================================

1. NEVER claim an unproven statement is proven.

2. NEVER invent a theorem, paper, author, DOI, result,
   citation, experiment, or mathematical fact.

3. NEVER pretend that a literature search was performed
   if the supplied literature data does not support it.

4. Separate:
   - established mathematical facts
   - assumptions
   - conjectures
   - computational evidence
   - deductions
   - speculation

5. Numerical evidence is NOT a proof.

6. A plausible argument is NOT a proof.

7. Every important implication must have an explicit reason.

8. If a logical step cannot be justified, mark it as a gap.

9. Search for counterexamples before accepting a hypothesis.

10. Try to destroy your own hypothesis.

11. Do not merely explain known mathematics.

12. Do not rewrite a known theorem as a "new discovery".

13. A research direction is not novel merely because
    the wording is different.

14. Compare the proposed direction against the supplied
    previous research and literature information.

15. If the direction substantially overlaps with known
    mathematics or previous failed research, reject it
    or change direction.

16. Do not repeat a research route that has already failed.

17. Prefer a mathematically different route.

18. Identify the exact unknown part.

19. Explicitly state the strongest known obstacle.

20. Never hide uncertainty.

==================================================
REQUIRED RESEARCH PHASES
==================================================

PHASE 1:
Known mathematics check.

PHASE 2:
Previous research overlap check.

PHASE 3:
Novelty check.

PHASE 4:
Generate a precise hypothesis.

PHASE 5:
Attempt to find a counterexample.

PHASE 6:
Attempt a proof or rigorous derivation.

PHASE 7:
Check every major logical transition.

PHASE 8:
Compare against literature.

PHASE 9:
Try to falsify the proposed result.

PHASE 10:
Determine the next genuinely useful research step.

==================================================
LITERATURE
==================================================

The following records were retrieved from OpenAlex.

Do NOT assume that a search result proves anything.

Use the records only as leads for literature comparison.

{json.dumps(works, ensure_ascii=False, indent=2)}

==================================================
PREVIOUS RESEARCH
==================================================

{json.dumps(history, ensure_ascii=False, indent=2)}

==================================================
RESEARCH MEMOS
==================================================

These are researcher-provided notes.

They may contain useful ideas, including ideas produced
by another AI such as Claude.

They are NOT automatically true.

Treat them as hypotheses or research instructions
until independently checked.

{json.dumps(memos, ensure_ascii=False, indent=2)}

==================================================
REQUIRED OUTPUT
==================================================

Return ONLY valid JSON.

Required keys:

title
hypothesis
research_question
known_facts
assumptions
approach
proof_strategy
counterexample_strategy
cross_domain_connection
critical_gap
next_steps
novelty_assessment
known_result_overlap
literature_check
logic_check
counterexample_check
self_critique
route_key
route_decision
status
confidence

literature_check must contain:

searched
verified
sources
notes

logic_check must contain:

passed
gaps
notes

counterexample_check must contain:

attempted
found
examples
notes

Allowed route_decision:

new
continue
change_direction
blocked

Allowed status:

candidate
promising
uncertain
rejected
needs_verification

IMPORTANT:

If literature verification is insufficient,
literature_check.verified MUST be false.

If a counterexample search was not genuinely performed,
counterexample_check.attempted MUST be false.

If a logical gap remains,
logic_check.passed MUST be false.

If the result is merely a restatement of known mathematics,
known_result_overlap must say so and status must not be promising.

A confidence value must be between 0 and 1.

Do NOT give high confidence merely because the argument
sounds convincing.

==================================================
FINAL PRINCIPLE
==================================================

Your objective is NOT to produce an impressive answer.

Your objective is to discover whether there is
a mathematically meaningful, defensible next step.

If the idea fails, explain exactly why.

If it survives, explain exactly what remains to be proven.
"""


          with open(
              "/tmp/prompt_${INDEX}.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(prompt)

          print("Research prompt created.")

          PY


            # =====================================================
            # 3-10. OpenRouter
            # =====================================================

            python3 <<PY

          import json

          prompt = open(
              "/tmp/prompt_${INDEX}.txt",
              encoding="utf-8"
          ).read()

          request = {

              "model":
                  "nvidia/nemotron-3-ultra-550b-a55b:free",

              "messages": [

                  {
                      "role": "system",
                      "content":
                          "You are a rigorous mathematical research engine. "
                          "Never fabricate facts. "
                          "Return valid JSON only."
                  },

                  {
                      "role": "user",
                      "content": prompt
                  }

              ],

              "temperature": 0.15,

              "max_tokens": 12000
          }

          json.dump(
              request,
              open(
                  "/tmp/request_${INDEX}.json",
                  "w",
                  encoding="utf-8"
              ),
              ensure_ascii=False
          )

          PY


            AI_STATUS=$(curl \
              --silent \
              --show-error \
              --output "/tmp/ai_${INDEX}.json" \
              --write-out "%{http_code}" \
              --request POST \
              --url "https://openrouter.ai/api/v1/chat/completions" \
              --header "Authorization: Bearer ${OPENROUTER_API_KEY}" \
              --header "Content-Type: application/json" \
              --data-binary "@/tmp/request_${INDEX}.json")

            echo "OpenRouter HTTP: ${AI_STATUS}"

            if [ "${AI_STATUS}" -lt 200 ] || [ "${AI_STATUS}" -ge 300 ]; then

              cat "/tmp/ai_${INDEX}.json"

              FINISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

              curl \
                --silent \
                --show-error \
                --request PATCH \
                --url "${BASE_URL}/rest/v1/research_jobs?id=eq.${JOB_ID}&status=eq.running" \
                --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
                --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                --header "Content-Type: application/json" \
                --data "{\"status\":\"failed\",\"error_message\":\"OpenRouter HTTP ${AI_STATUS}\",\"finished_at\":\"${FINISHED_AT}\"}" \
                || true

              continue

            fi


            # =====================================================
            # 3-11. AIレスポンス取得
            # =====================================================

            python3 <<PY

          import json

          data = json.load(
              open(
                  "/tmp/ai_${INDEX}.json",
                  encoding="utf-8"
              )
          )

          try:

              content = data[
                  "choices"
              ][0][
                  "message"
              ][
                  "content"
              ]

          except Exception as e:

              raise SystemExit(
                  f"Invalid AI response: {e}"
              )

          with open(
              "/tmp/ai_text_${INDEX}.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(content)

          print("AI response received.")

          PY


            # =====================================================
            # 3-12. JSON検証・評価
            # =====================================================

            python3 <<PY

          import json
          import re

          raw = open(
              "/tmp/ai_text_${INDEX}.txt",
              encoding="utf-8"
          ).read().strip()


          raw = re.sub(
              r"^```(?:json)?\\s*",
              "",
              raw,
              flags=re.I
          )

          raw = re.sub(
              r"\\s*```$",
              "",
              raw
          )


          try:

              result = json.loads(raw)

          except json.JSONDecodeError:

              match = re.search(
                  r"\\{.*\\}",
                  raw,
                  re.S
              )

              if not match:
                  raise SystemExit(
                      "AI JSON not found."
                  )

              result = json.loads(
                  match.group(0)
              )


          confidence = result.get(
              "confidence",
              0
          )

          try:
              confidence = float(confidence)
          except:
              confidence = 0

          confidence = max(
              0,
              min(
                  1,
                  confidence
              )
          )


          literature = result.get(
              "literature_check",
              {}
          )

          logic = result.get(
              "logic_check",
              {}
          )

          counterexample = result.get(
              "counterexample_check",
              {}
          )


          literature_verified = (
              literature.get("verified")
              is True
          )

          logic_passed = (
              logic.get("passed")
              is True
          )

          counterexample_attempted = (
              counterexample.get("attempted")
              is True
          )


          status = str(
              result.get(
                  "status",
                  "needs_verification"
              )
          ).lower()


          overlap = str(
              result.get(
                  "known_result_overlap",
                  ""
              )
          ).lower()


          novelty = str(
              result.get(
                  "novelty_assessment",
                  ""
              )
          ).lower()


          # -----------------------------------------------------
          # 厳格な評価
          # -----------------------------------------------------

          evaluation = "△"


          # 明確に既知数学の言い換えなら拒否
          known_overlap_bad = any(
              word in overlap
              for word in [
                  "same",
                  "known",
                  "restatement",
                  "既知",
                  "重複",
                  "言い換え",
                  "再説明"
              ]
          )


          novelty_bad = any(
              word in novelty
              for word in [
                  "not novel",
                  "既知",
                  "新規性なし",
                  "新規ではない",
                  "重複"
              ]
          )


          if status == "rejected":

              evaluation = "❌"

          elif (
              status in [
                  "promising",
                  "candidate"
              ]
              and confidence >= 0.8
              and literature_verified
              and logic_passed
              and counterexample_attempted
              and not known_overlap_bad
              and not novelty_bad
          ):

              evaluation = "⭕️"

          else:

              evaluation = "△"


          # -----------------------------------------------------
          # 保存内容
          # -----------------------------------------------------

          job = json.load(
              open(
                  "${JOB_FILE}",
                  encoding="utf-8"
              )
          )


          context = json.load(
              open(
                  "/tmp/context_${INDEX}.json",
                  encoding="utf-8"
              )
          )


          content = {

              "research_question":
                  result.get(
                      "research_question"
                  ),

              "known_facts":
                  result.get(
                      "known_facts",
                      []
                  ),

              "assumptions":
                  result.get(
                      "assumptions",
                      []
                  ),

              "approach":
                  result.get(
                      "approach",
                      []
                  ),

              "proof_strategy":
                  result.get(
                      "proof_strategy",
                      []
                  ),

              "counterexample_strategy":
                  result.get(
                      "counterexample_strategy",
                      []
                  ),

              "cross_domain_connection":
                  result.get(
                      "cross_domain_connection",
                      []
                  ),

              "critical_gap":
                  result.get(
                      "critical_gap"
                  ),

              "next_steps":
                  result.get(
                      "next_steps",
                      []
                  ),

              "novelty_assessment":
                  result.get(
                      "novelty_assessment"
                  ),

              "known_result_overlap":
                  result.get(
                      "known_result_overlap"
                  ),

              "literature_check":
                  literature,

              "logic_check":
                  logic,

              "counterexample_check":
                  counterexample,

              "self_critique":
                  result.get(
                      "self_critique"
                  ),

              "route_key":
                  context.get(
                      "route_key"
                  ),

              "route_attempts":
                  context.get(
                      "route_attempts",
                      0
                  ),

              "route_decision":
                  result.get(
                      "route_decision"
                  ),

              "source_job_id":
                  job["id"],

              "research_configuration":
                  job.get(
                      "payload",
                      {}
                  )
          }


          record = {

              "project_id":
                  job["project_id"],

              "title":
                  str(
                      result.get(
                          "title",
                          "AI研究"
                      )
                  ),

              "hypothesis":
                  str(
                      result.get(
                          "hypothesis",
                          ""
                      )
                  ),

              "content":
                  json.dumps(
                      content,
                      ensure_ascii=False
                  ),

              "status":
                  "pending",

              "evaluation":
                  evaluation,

              "confidence_level":
                  round(
                      confidence * 5
                  ),

              "is_human_saved":
                  False
          }


          json.dump(
              record,
              open(
                  "/tmp/result_${INDEX}.json",
                  "w",
                  encoding="utf-8"
              ),
              ensure_ascii=False
          )


          print("")
          print("================================")
          print("RESEARCH EVALUATION")
          print("================================")
          print("Evaluation:", evaluation)
          print("Confidence:", confidence)
          print(
              "Literature verified:",
              literature_verified
          )
          print(
              "Logic passed:",
              logic_passed
          )
          print(
              "Counterexample attempted:",
              counterexample_attempted
          )
          print(
              "Known overlap:",
              known_overlap_bad
          )
          print(
              "Novelty concern:",
              novelty_bad
          )
          print("================================")

          PY


            # =====================================================
            # 3-13. 保存前キャンセル確認
            # =====================================================

            CURRENT_STATUS=$(curl \
              --silent \
              --show-error \
              --fail \
              --url "${BASE_URL}/rest/v1/research_jobs?select=status&id=eq.${JOB_ID}" \
              --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" |
              python3 -c \
              'import json,sys; a=json.load(sys.stdin); print(a[0]["status"] if a else "missing")')


            if [ "${CURRENT_STATUS}" != "running" ]; then

              echo "Job cancelled before save."

              continue

            fi


            # =====================================================
            # 3-14. 研究結果保存
            # =====================================================

            SAVE_STATUS=$(curl \
              --silent \
              --show-error \
              --output "/tmp/save_${INDEX}.json" \
              --write-out "%{http_code}" \
              --request POST \
              --url "${BASE_URL}/rest/v1/research_results" \
              --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Content-Type: application/json" \
              --header "Prefer: return=minimal" \
              --data-binary "@/tmp/result_${INDEX}.json")


            echo "Save HTTP: ${SAVE_STATUS}"


            if [ "${SAVE_STATUS}" -lt 200 ] || [ "${SAVE_STATUS}" -ge 300 ]; then

              cat "/tmp/save_${INDEX}.json"

              FINISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

              curl \
                --silent \
                --show-error \
                --request PATCH \
                --url "${BASE_URL}/rest/v1/research_jobs?id=eq.${JOB_ID}&status=eq.running" \
                --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
                --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                --header "Content-Type: application/json" \
                --data "{\"status\":\"failed\",\"error_message\":\"Failed to save research result\",\"finished_at\":\"${FINISHED_AT}\"}" \
                || true

              continue

            fi


            # =====================================================
            # 3-15. 完了
            # =====================================================

            FINISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

            curl \
              --silent \
              --show-error \
              --fail \
              --request PATCH \
              --url "${BASE_URL}/rest/v1/research_jobs?id=eq.${JOB_ID}&status=eq.running" \
              --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Content-Type: application/json" \
              --header "Prefer: return=minimal" \
              --data "{\"status\":\"completed\",\"finished_at\":\"${FINISHED_AT}\"}"


            echo "JOB COMPLETED: ${JOB_ID}"

          done


          echo ""
          echo "================================================="
          echo "ALL QUEUED JOBS PROCESSED"
          echo "================================================="


      # =========================================================
      # 4. キューが空だった場合
      # =========================================================

      - name: Queue status
        if: steps.get_jobs.outputs.job_count == '0'
        run: |
          echo "Research queue is empty."
          echo "Worker finished normally."
