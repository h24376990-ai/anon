name: Research AI Lab

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

jobs:

  # ==========================================================
  # 1. Edge Functionsをデプロイ
  # ==========================================================

  deploy-functions:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest


      - name: Check CLI
        run: |
          supabase --version


      - name: Check secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ERROR: SUPABASE_ACCESS_TOKEN is missing"
            exit 1
          fi

          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "ERROR: SUPABASE_PROJECT_REF is missing"
            exit 1
          fi

          echo "SUPABASE_ACCESS_TOKEN: configured"
          echo "SUPABASE_PROJECT_REF: $SUPABASE_PROJECT_REF"


      - name: Link Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |

          supabase link \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"


      # --------------------------------------------------------
      # kick-worker
      # --------------------------------------------------------

      - name: Deploy kick-worker
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |

          echo "======================================"
          echo "Deploying kick-worker"
          echo "======================================"

          if [ ! -f "supabase/functions/kick-worker/index.ts" ]; then
            echo "ERROR: kick-worker/index.ts does not exist"
            exit 1
          fi

          supabase functions deploy kick-worker \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt


      # --------------------------------------------------------
      # smart-handler
      # --------------------------------------------------------

      - name: Deploy smart-handler
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |

          echo "======================================"
          echo "Deploying smart-handler"
          echo "======================================"

          if [ ! -f "supabase/functions/smart-handler/index.ts" ]; then
            echo "ERROR: smart-handler/index.ts does not exist"
            exit 1
          fi

          supabase functions deploy smart-handler \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt


      - name: Deployment finished
        run: |

          echo "======================================"
          echo "Supabase Functions Deployment Complete"
          echo "======================================"
          echo "kick-worker: deployed"
          echo "smart-handler: deployed"
          echo "======================================"


  # ==========================================================
  # 2. Worker実行
  # ==========================================================

  run-worker:

    needs:
      - deploy-functions

    runs-on: ubuntu-latest

    steps:

      - name: Start Worker
        run: |

          echo "======================================"
          echo "Research AI Lab Worker"
          echo "======================================"
          echo "Starting kick-worker..."


      - name: Call kick-worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |

          set -e

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: SUPABASE_URL is missing"
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_ANON_KEY is missing"
            exit 1
          fi


          echo "======================================"
          echo "Calling kick-worker"
          echo "======================================"


          RESPONSE_FILE="worker_response.json"


          HTTP_STATUS=$(curl \
            -sS \
            -o "$RESPONSE_FILE" \
            -w "%{http_code}" \
            -X POST \
            "${SUPABASE_URL}/functions/v1/kick-worker" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            --data '{}'
          )


          echo ""
          echo "HTTP STATUS: ${HTTP_STATUS}"
          echo ""


          cat "$RESPONSE_FILE"


          echo ""
          echo "======================================"


          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then

            echo "Worker request failed."

            exit 1

          fi


          echo "Worker request succeeded."

          echo "======================================"


      - name: Worker finished
        if: always()
        run: |

          echo "Research AI Lab worker finished."
