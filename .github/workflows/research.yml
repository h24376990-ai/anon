name: Math Research Lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-cycle:
    name: AI Mathematics Research Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -e

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: SUPABASE_URL is missing"
            exit 1
          fi

          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "ERROR: SUPABASE_SERVICE_ROLE_KEY is missing"
            exit 1
          fi

          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "ERROR: OPENROUTER_API_KEY is missing"
            exit 1
          fi

          echo "All required secrets are available."

      - name: Prepare Supabase URL
        id: supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          URL="${SUPABASE_URL%/}"
          URL="${URL%/rest/v1}"
          URL="${URL%/}"

          echo "base_url=$URL" >> "$GITHUB_OUTPUT"

          echo "Supabase URL prepared."

      - name: Test Supabase connection
        env:
          SUPABASE_BASE_URL: ${{ steps.supabase.outputs.base_url }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e

          echo "Testing Supabase connection..."

          STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/supabase_response.txt \
            --write-out "%{http_code}" \
            --request GET \
            --url "${SUPABASE_BASE_URL}/rest/v1/research_jobs?select=id&limit=1" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json")

          echo "Supabase HTTP status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            cat /tmp/supabase_response.txt
            exit 1
          fi

          echo "Supabase connection successful."

      - name: Find running research job
        id: job
        env:
          SUPABASE_BASE_URL: ${{ steps.supabase.outputs.base_url }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e

          echo "Searching for running research job..."

          curl \
            --silent \
            --show-error \
            --fail \
            --request GET \
            --url "${SUPABASE_BASE_URL}/rest/v1/research_jobs?select=id,project_id,job_type,status,priority,payload,created_at,started_at&status=eq.running&order=started_at.asc&limit=1" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            > /tmp/job.json

          cat /tmp/job.json

          JOB_ID=$(python3 -c "import json; d=json.load(open('/tmp/job.json')); print(d[0]['id'] if d else '')")

          if [ -z "$JOB_ID" ]; then
            echo "No running research job found."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          JOB_TYPE=$(python3 -c "import json; d=json.load(open('/tmp/job.json')); print(d[0].get('job_type') or '')")

          echo "Running job found."
          echo "Job ID: $JOB_ID"
          echo "Job type: $JOB_TYPE"

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "job_type=$JOB_TYPE" >> "$GITHUB_OUTPUT"

      - name: Build research prompt
        if: steps.job.outputs.found == 'true'
        env:
          JOB_TYPE: ${{ steps.job.outputs.job_type }}
        run: |
          cat > /tmp/research_prompt.txt <<EOF
You are the research engine of an autonomous mathematics research laboratory.

Primary research theme:
Riemann Hypothesis.

Current job type:
${JOB_TYPE}

Your task is to generate one rigorous mathematics research candidate.

Strict rules:

- Never claim the Riemann Hypothesis is proven without a complete proof.
- Clearly distinguish known facts, theorems, numerical evidence, hypotheses, and speculation.
- Never invent papers, authors, citations, theorem names, or experimental results.
- Numerical evidence is not proof.
- Look for hidden assumptions.
- Try to falsify your own idea.
- Consider direct proof.
- Consider proof by contradiction.
- Consider the contrapositive when meaningful.
- Consider special cases.
- Consider boundary cases.
- Consider extreme cases.
- Consider counterexample searches.
- Consider numerical experiments.
- Consider analytic number theory.
- Consider complex analysis.
- Consider spectral theory.
- Consider operator theory.
- Consider geometry.
- Consider probability.
- Consider dynamical systems.
- Consider mathematical physics.
- Consider information theory.
- Cross-domain analogies are only hypothesis-generation tools.

Prefer genuinely different research directions rather than merely rephrasing an approach that has already failed.

Return ONLY valid JSON.

Required format:

{
  "title": "string",
  "research_question": "string",
  "approach": "string",
  "known_facts": [],
  "hypotheses": [],
  "assumptions": [],
  "proof_strategy": [],
  "counterexample_strategy": [],
  "numerical_experiments": [],
  "critical_gap": "string",
  "failure_conditions": [],
  "next_steps": [],
  "confidence": 0.0,
  "status": "candidate"
}

confidence must be between 0 and 1.

Allowed status values:
candidate
promising
uncertain
rejected
needs_verification

Do not use "proven" unless a complete mathematical proof is actually present.
EOF

          echo "Research prompt created."

      - name: Run OpenRouter research AI
        if: steps.job.outputs.found == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -e

          python3 -c '
          import json

          prompt = open("/tmp/research_prompt.txt", encoding="utf-8").read()

          request = {
              "model": "deepseek/deepseek-r1:free",
              "messages": [
                  {
                      "role": "system",
                      "content": "You are a rigorous mathematics research engine. Return JSON only."
                  },
                  {
                      "role": "user",
                      "content": prompt
                  }
              ],
              "temperature": 0.2,
              "max_tokens": 12000
          }

          json.dump(
              request,
              open("/tmp/openrouter_request.json", "w"),
              ensure_ascii=False
          )
          '

          echo "Calling OpenRouter..."

          STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/openrouter_response.json \
            --write-out "%{http_code}" \
            --request POST \
            --url "https://openrouter.ai/api/v1/chat/completions" \
            --header "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            --header "Content-Type: application/json" \
            --header "HTTP-Referer: https://github.com/" \
            --header "X-Title: Autonomous Mathematics Research Lab" \
            --data-binary @/tmp/openrouter_request.json)

          echo "OpenRouter HTTP status: $STATUS"

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            cat /tmp/openrouter_response.json
            exit 1
          fi

          python3 -c '
          import json

          data = json.load(open("/tmp/openrouter_response.json"))

          choices = data.get("choices", [])

          if not choices:
              raise SystemExit("OpenRouter returned no choices.")

          content = choices[0].get("message", {}).get("content", "")

          if not content:
              raise SystemExit("OpenRouter returned empty content.")

          open("/tmp/ai_result.txt", "w", encoding="utf-8").write(content)

          print("AI research response received.")
          '

      - name: Validate AI result
        if: steps.job.outputs.found == 'true'
        run: |
          set -e

          python3 -c '
          import json
          import re

          raw = open("/tmp/ai_result.txt", encoding="utf-8").read().strip()

          raw = re.sub(r"^```json\s*", "", raw, flags=re.IGNORECASE)
          raw = re.sub(r"^```\s*", "", raw)
          raw = re.sub(r"\s*```$", "", raw)

          data = json.loads(raw)

          required = [
              "title",
              "research_question",
              "approach",
              "known_facts",
              "hypotheses",
              "assumptions",
              "proof_strategy",
              "counterexample_strategy",
              "numerical_experiments",
              "critical_gap",
              "failure_conditions",
              "next_steps",
              "confidence",
              "status"
          ]

          for field in required:
              if field not in data:
                  raise SystemExit("Missing field: " + field)

          confidence = float(data["confidence"])

          if confidence < 0 or confidence > 1:
              raise SystemExit("Invalid confidence.")

          allowed = {
              "candidate",
              "promising",
              "uncertain",
              "rejected",
              "needs_verification"
          }

          if data["status"] not in allowed:
              raise SystemExit("Invalid status.")

          json.dump(
              data,
              open("/tmp/research_result.json", "w", encoding="utf-8"),
              ensure_ascii=False,
              indent=2
          )

          print("Research result validated.")
          print("Title:", data["title"])
          print("Status:", data["status"])
          print("Confidence:", data["confidence"])
          '

      - name: Save research result to Supabase
        if: steps.job.outputs.found == 'true'
        env:
          SUPABASE_BASE_URL: ${{ steps.supabase.outputs.base_url }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ steps.job.outputs.job_id }}
        run: |
          set -e

          python3 -c '
          import json
          from datetime import datetime, timezone

          result = json.load(
              open("/tmp/research_result.json", encoding="utf-8")
          )

          patch = {
              "payload": {
                  "research_result": result,
                  "research_engine_version": "step-10-v3",
                  "research_completed_at": datetime.now(
                      timezone.utc
                  ).isoformat()
              }
          }

          json.dump(
              patch,
              open("/tmp/supabase_patch.json", "w"),
              ensure_ascii=False
          )
          '

          STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/save_response.json \
            --write-out "%{http_code}" \
            --request PATCH \
            --url "${SUPABASE_BASE_URL}/rest/v1/research_jobs?id=eq.${JOB_ID}" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=representation" \
            --data-binary @/tmp/supabase_patch.json)

          echo "Supabase save HTTP status: $STATUS"

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            cat /tmp/save_response.json
            exit 1
          fi

          echo "Research result saved."

      - name: Mark research job completed
        if: steps.job.outputs.found == 'true'
        env:
          SUPABASE_BASE_URL: ${{ steps.supabase.outputs.base_url }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ steps.job.outputs.job_id }}
        run: |
          set -e

          python3 -c '
          import json
          from datetime import datetime, timezone

          patch = {
              "status": "completed",
              "completed_at": datetime.now(
                  timezone.utc
              ).isoformat()
          }

          json.dump(
              patch,
              open("/tmp/completion.json", "w")
          )
          '

          STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/completion_response.json \
            --write-out "%{http_code}" \
            --request PATCH \
            --url "${SUPABASE_BASE_URL}/rest/v1/research_jobs?id=eq.${JOB_ID}" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=representation" \
            --data-binary @/tmp/completion.json)

          echo "Completion HTTP status: $STATUS"

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            cat /tmp/completion_response.json
            exit 1
          fi

          echo "Research job completed."

      - name: No running job
        if: steps.job.outputs.found != 'true'
        run: |
          echo "No running research job."
          echo "Nothing to process."

      - name: Finish
        run: |
          echo "=========================================="
          echo "STEP 10 completed."
          echo "=========================================="
