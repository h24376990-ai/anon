name: Math Research Lab

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: math-research-worker
  cancel-in-progress: false

jobs:

  research:

    name: AI Mathematical Research Worker

    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      MAX_JOBS_PER_RUN: "5"
      MAX_RESEARCH_CYCLES: "3"
      MAX_ROUTE_REPETITIONS: "3"

    steps:

      # =====================================================
      # 1. Environment check
      # =====================================================

      - name: Check environment
        run: |

          set -e

          if [ -z "${SUPABASE_URL}" ]; then
            echo "SUPABASE_URL is missing."
            exit 1
          fi

          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY is missing."
            exit 1
          fi

          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "OPENROUTER_API_KEY is missing."
            exit 1
          fi

          python3 --version

          echo "Environment OK."


      # =====================================================
      # 2. Fetch queued jobs
      # =====================================================

      - name: Fetch queued research jobs
        id: queue
        run: |

          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/jobs.json \
            --write-out "%{http_code}" \
            --request GET \
            --url "${BASE_URL}/rest/v1/research_jobs?select=*&status=eq.queued&order=priority.desc,created_at.asc&limit=${MAX_JOBS_PER_RUN}" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json")

          echo "Queue HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" != "200" ]; then
            cat /tmp/jobs.json
            exit 1
          fi

          python3 <<'PY'

          import json

          with open("/tmp/jobs.json", "r", encoding="utf-8") as f:
              jobs = json.load(f)

          print("Queued jobs:", len(jobs))

          with open("/tmp/job_count", "w") as f:
              f.write(str(len(jobs)))

          for i, job in enumerate(jobs):

              with open(
                  f"/tmp/job_{i}.json",
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      job,
                      f,
                      ensure_ascii=False
                  )

          PY

          echo "count=$(cat /tmp/job_count)" >> "$GITHUB_OUTPUT"


      # =====================================================
      # 3. Process queued jobs
      # =====================================================

      - name: Process research jobs
        if: steps.queue.outputs.count != '0'
        run: |

          set -e

          COUNT=$(cat /tmp/job_count)

          echo "Processing ${COUNT} research job(s)."

          for ((i=0; i<COUNT; i++)); do

            echo ""
            echo "=============================================="
            echo "PROCESSING JOB ${i}"
            echo "=============================================="

            cp "/tmp/job_${i}.json" /tmp/job.json

            python3 - <<'PY'

          import json

          with open("/tmp/job.json", "r", encoding="utf-8") as f:
              job = json.load(f)

          print("JOB:", job.get("id"))
          print("THEME:", (job.get("payload") or {}).get("theme"))

          PY

            # =================================================
            # 3-A. Claim job
            # =================================================

            JOB_ID=$(python3 -c \
              'import json; print(json.load(open("/tmp/job.json"))["id"])')

            BASE_URL="${SUPABASE_URL%/}"
            BASE_URL="${BASE_URL%/rest/v1}"

            STARTED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

            HTTP_STATUS=$(curl \
              --silent \
              --show-error \
              --output /tmp/claim.json \
              --write-out "%{http_code}" \
              --request PATCH \
              --url "${BASE_URL}/rest/v1/research_jobs?id=eq.${JOB_ID}&status=eq.queued" \
              --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Content-Type: application/json" \
              --header "Prefer: return=representation" \
              --data "{\"status\":\"running\",\"started_at\":\"${STARTED_AT}\"}")

            echo "Claim HTTP status: ${HTTP_STATUS}"

            if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
              cat /tmp/claim.json
              continue
            fi


            # =================================================
            # 3-B. Build autonomous research prompt
            # =================================================

            python3 <<'PY'

          import json

          with open("/tmp/job.json", "r", encoding="utf-8") as f:
              job = json.load(f)

          payload = job.get("payload") or {}

          theme = str(
              payload.get("theme", "")
          ).strip()

          if not theme:
              raise SystemExit("Research theme is empty.")


          # -------------------------------------------------
          # Research protocol
          # -------------------------------------------------

          prompt = f"""

You are the core research engine of an autonomous mathematical research laboratory.

RESEARCH THEME
==============

{theme}


PRIMARY OBJECTIVE
=================

Do NOT simply answer the question.

Treat the theme as a research problem.

The goal is to discover mathematically meaningful progress,
not to produce a plausible-sounding explanation.


============================================================
RESEARCH MEMORY
============================================================

Previous research may exist in the database.

You MUST distinguish:

1. established mathematical facts
2. previously tested hypotheses
3. failed approaches
4. unresolved questions
5. genuinely new hypotheses

Never pretend a known result is new.


============================================================
ANTI-REDUNDANCY PROTOCOL
============================================================

Before proposing a direction:

A. Identify what is already mathematically known.

B. Identify standard textbook approaches.

C. Identify famous known approaches.

D. Identify approaches likely to reproduce existing mathematics.

E. Reject a direction if it is merely a restatement,
   renaming, or cosmetic reformulation of known mathematics.

F. Prefer structural differences.

G. Prefer unexplored combinations of known tools.

H. Prefer testable mathematical consequences.

I. Explicitly state why the proposed direction is
   different from the obvious approaches.


============================================================
NO HALLUCINATION PROTOCOL
============================================================

NEVER invent:

- papers
- authors
- theorems
- numerical results
- citations
- experimental results
- proof steps

If you cannot verify something,
say that it is unverified.

Never convert uncertainty into certainty.


============================================================
PROOF DISCIPLINE
============================================================

A proof must not contain unexplained logical jumps.

For every important implication:

A -> B

explain why B follows from A.

If a step depends on an unstated assumption,
identify the assumption.

If a proof cannot currently be completed,
do NOT call it a proof.

Call it:

candidate argument
or
partial argument
or
research direction


============================================================
COUNTEREXAMPLE PROTOCOL
============================================================

For every hypothesis:

1. Search conceptually for counterexamples.

2. Test extreme cases.

3. Test boundary cases.

4. Test degenerate cases.

5. Test small mathematical structures.

6. Test asymptotic behavior.

7. Test whether assumptions are actually necessary.

8. Attempt to construct an explicit counterexample.

If a counterexample is found,
the hypothesis must not be marked promising.


============================================================
MULTI-PROOF PROTOCOL
============================================================

When applicable, independently investigate:

1. Direct proof

2. Proof by contradiction

3. Contrapositive

4. Mathematical induction

5. Construction

6. Extremal argument

7. Invariant-based argument

8. Algebraic transformation

9. Analytic approach

10. Computational / numerical exploration

Do NOT force methods that are mathematically inappropriate.

Explain which methods are applicable and why.


============================================================
INDEPENDENT VERIFICATION
============================================================

A promising result must be checked from a substantially
different direction.

Do not merely repeat the same proof with different wording.

For example:

proof A -> contradiction

then verification B -> independent structural argument


============================================================
ROUTE CONTROL
============================================================

Every research direction has a route signature.

Examples:

analytic_zero_density
contradiction_functional_equation
prime_distribution
spectral_operator
algebraic_structure
counterexample_search

If the same route repeatedly produces no progress,
the route should be considered blocked.

Never endlessly repeat an unsuccessful route.


============================================================
MATHEMATICAL MODELING
============================================================

When useful, represent the mathematical structure as:

- graph
- function surface
- manifold-like structure
- dynamical system
- network
- geometric transformation
- parameter space

Explore transformations of the model.

Possible transformations include:

- scaling
- translation
- rotation
- reflection
- deformation
- parameter variation
- dimensional projection
- symmetry breaking
- normalization

A visualization is NOT evidence of a theorem.

Physical simulation is NOT proof.

Use physical-style reasoning only as a heuristic
for discovering mathematical structures.


============================================================
NOVELTY TEST
============================================================

Assign a novelty assessment:

known
variant_of_known
uncertain
potentially_new

Never call something new merely because it sounds new.


============================================================
RESEARCH RESULT
============================================================

Return ONLY valid JSON.

Required fields:

title
hypothesis
research_question
known_facts
novelty_assessment
novelty_reason
assumptions
approach
proof_strategies
counterexample_search
cross_domain_connection
mathematical_model
transformations
critical_gap
verification
next_steps
route_signature
route_reason
status
confidence

status must be one of:

candidate
promising
uncertain
rejected
needs_verification

confidence must be between 0 and 1.


============================================================
IMPORTANT
============================================================

A result can be promising without being proven.

⭕️ MUST NOT mean:

"the mathematical theorem has been proven."

⭕️ means:

"the research result passed the laboratory's current
verification criteria and deserves preservation/reverification."

"""

          with open(
              "/tmp/prompt.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(prompt)

          print("Research protocol created.")

          PY


            # =================================================
            # 3-C. Check cancellation
            # =================================================

            STATUS=$(curl \
              --silent \
              --show-error \
              --fail \
              --url "${BASE_URL}/rest/v1/research_jobs?select=status&id=eq.${JOB_ID}" \
              --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" |
              python3 -c \
              'import json,sys; a=json.load(sys.stdin); print(a[0]["status"] if a else "missing")')

            if [ "${STATUS}" != "running" ]; then

              echo "Job ${JOB_ID} is no longer running."

              continue

            fi


            # =================================================
            # 3-D. Fetch research memory
            # =================================================

            PROJECT_ID=$(python3 -c \
              'import json; print(json.load(open("/tmp/job.json"))["project_id"])')

            curl \
              --silent \
              --show-error \
              --fail \
              --url "${BASE_URL}/rest/v1/research_results?select=id,title,hypothesis,content,evaluation,confidence_level,created_at&project_id=eq.${PROJECT_ID}&order=created_at.desc&limit=50" \
              --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              > /tmp/history.json


            # =================================================
            # 3-E. Fetch human / AI memos
            # =================================================

            curl \
              --silent \
              --show-error \
              --fail \
              --url "${BASE_URL}/rest/v1/research_memos?select=id,title,content,created_at&project_id=eq.${PROJECT_ID}&order=created_at.desc&limit=50" \
              --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              > /tmp/memos.json


            # =================================================
            # 3-F. Build memory context
            # =================================================

            python3 <<'PY'

          import json

          with open("/tmp/history.json", "r", encoding="utf-8") as f:
              history = json.load(f)

          with open("/tmp/memos.json", "r", encoding="utf-8") as f:
              memos = json.load(f)


          memory = {
              "previous_research": history,
              "research_memos": memos
          }


          with open(
              "/tmp/memory.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  memory,
                  f,
                  ensure_ascii=False
              )

          print(
              "Memory loaded:",
              len(history),
              "research results,",
              len(memos),
              "memos"
          )

          PY


            # =================================================
            # 3-G. Add memory to prompt
            # =================================================

            python3 <<'PY'

          import json

          with open(
              "/tmp/prompt.txt",
              "r",
              encoding="utf-8"
          ) as f:

              prompt = f.read()

          with open(
              "/tmp/memory.json",
              "r",
              encoding="utf-8"
          ) as f:

              memory = json.load(f)


          memory_text = json.dumps(
              memory,
              ensure_ascii=False,
              indent=2
          )


          prompt += f"""

============================================================
DATABASE RESEARCH MEMORY
============================================================

The following is previous laboratory memory.

Use it to avoid repeating unsuccessful or already-known
directions.

IMPORTANT:

Previous research is evidence of what this laboratory tried.

It is NOT automatically mathematically correct.

------------------------------------------------------------
{memory_text}
------------------------------------------------------------

"""


          with open(
              "/tmp/final_prompt.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(prompt)

          PY


            # =================================================
            # 3-H. OpenRouter request
            # =================================================

            python3 <<'PY'

          import json

          with open(
              "/tmp/final_prompt.txt",
              "r",
              encoding="utf-8"
          ) as f:

              prompt = f.read()


          request = {

              "model":
                  "nvidia/nemotron-3-ultra-550b-a55b:free",

              "messages": [

                  {
                      "role": "system",

                      "content":
                          """
You are a rigorous mathematical research engine.

You must distinguish facts, conjectures,
heuristics, evidence and proofs.

Never fabricate citations.

Never claim an unresolved theorem is proven.

Do not merely reproduce textbook explanations.

Return valid JSON only.
"""
                  },

                  {
                      "role": "user",

                      "content": prompt
                  }

              ],

              "temperature": 0.15,

              "max_tokens": 12000

          }


          with open(
              "/tmp/request.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  request,
                  f,
                  ensure_ascii=False
              )

          PY


            HTTP_STATUS=$(curl \
              --silent \
              --show-error \
              --output /tmp/ai.json \
              --write-out "%{http_code}" \
              --request POST \
              --url "https://openrouter.ai/api/v1/chat/completions" \
              --header "Authorization: Bearer ${OPENROUTER_API_KEY}" \
              --header "Content-Type: application/json" \
              --data-binary @/tmp/request.json)

            echo "OpenRouter HTTP status: ${HTTP_STATUS}"


            if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then

              echo "OpenRouter failed."

              cat /tmp/ai.json

              curl \
                --silent \
                --show-error \
                --request PATCH \
                --url "${BASE_URL}/rest/v1/research_jobs?id=eq.${JOB_ID}&status=eq.running" \
                --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
                --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                --header "Content-Type: application/json" \
                --data "{\"status\":\"failed\",\"error_message\":\"OpenRouter HTTP ${HTTP_STATUS}\",\"finished_at\":\"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"}" \
                || true

              continue

            fi


            # =================================================
            # 3-I. Extract AI content
            # =================================================

            python3 <<'PY'

          import json

          with open(
              "/tmp/ai.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          try:

              content = (
                  data["choices"][0]
                  ["message"]["content"]
              )

          except Exception as e:

              print(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2
                  )
              )

              raise SystemExit(
                  f"Invalid AI response: {e}"
              )


          with open(
              "/tmp/ai_text.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(content)

          PY


            # =================================================
            # 3-J. Validate and normalize
            # =================================================

            python3 <<'PY'

          import json
          import re


          with open(
              "/tmp/ai_text.txt",
              "r",
              encoding="utf-8"
          ) as f:

              raw = f.read().strip()


          raw = re.sub(
              r"^```(?:json)?\s*",
              "",
              raw,
              flags=re.I
          )

          raw = re.sub(
              r"\s*```$",
              "",
              raw
          )


          try:

              result = json.loads(raw)

          except json.JSONDecodeError:

              match = re.search(
                  r"\{.*\}",
                  raw,
                  re.S
              )

              if not match:
                  raise SystemExit(
                      "AI JSON not found."
                  )

              result = json.loads(
                  match.group(0)
              )


          confidence_raw =
              result.get(
                  "confidence",
                  0
              )


          try:

              confidence =
                  float(
                      confidence_raw
                  )

          except:

              confidence = 0.0


          confidence =
              max(
                  0.0,
                  min(
                      1.0,
                      confidence
                  )
              )


          status =
              str(
                  result.get(
                      "status",
                      "uncertain"
                  )
              ).lower().strip()


          novelty =
              str(
                  result.get(
                      "novelty_assessment",
                      "uncertain"
                  )
              ).lower().strip()


          # -------------------------------------------------
          # Conservative evaluation
          # -------------------------------------------------

          if status == "rejected":

              evaluation = "❌"

          elif (
              status == "promising"
              and confidence >= 0.8
              and novelty
                  in [
                      "uncertain",
                      "potentially_new"
                  ]
          ):

              evaluation = "⭕️"

          else:

              evaluation = "△"


          # -------------------------------------------------
          # Never allow novelty claim alone to create proof.
          # -------------------------------------------------

          if novelty == "known":

              evaluation = "△"


          # -------------------------------------------------
          # Build research content
          # -------------------------------------------------

          content = {

              "research_question":
                  result.get(
                      "research_question"
                  ),

              "known_facts":
                  result.get(
                      "known_facts",
                      []
                  ),

              "novelty_assessment":
                  novelty,

              "novelty_reason":
                  result.get(
                      "novelty_reason"
                  ),

              "assumptions":
                  result.get(
                      "assumptions",
                      []
                  ),

              "approach":
                  result.get(
                      "approach",
                      []
                  ),

              "proof_strategies":
                  result.get(
                      "proof_strategies",
                      []
                  ),

              "counterexample_search":
                  result.get(
                      "counterexample_search",
                      []
                  ),

              "cross_domain_connection":
                  result.get(
                      "cross_domain_connection",
                      []
                  ),

              "mathematical_model":
                  result.get(
                      "mathematical_model"
                  ),

              "transformations":
                  result.get(
                      "transformations",
                      []
                  ),

              "critical_gap":
                  result.get(
                      "critical_gap"
                  ),

              "verification":
                  result.get(
                      "verification"
                  ),

              "next_steps":
                  result.get(
                      "next_steps",
                      []
                  ),

              "route_signature":
                  result.get(
                      "route_signature"
                  ),

              "route_reason":
                  result.get(
                      "route_reason"
                  ),

              "laboratory_note":
                  "⭕️ means research-worthy result, not proof of an unresolved theorem."

          }


          with open(
              "/tmp/job.json",
              "r",
              encoding="utf-8"
          ) as f:

              job = json.load(f)


          record = {

              "project_id":
                  job["project_id"],

              "title":
                  str(
                      result.get(
                          "title",
                          "AI研究結果"
                      )
                  ),

              "hypothesis":
                  str(
                      result.get(
                          "hypothesis",
                          ""
                      )
                  ),

              "content":
                  json.dumps(
                      content,
                      ensure_ascii=False
                  ),

              "status":
                  "pending",

              "evaluation":
                  evaluation,

              "confidence_level":
                  round(
                      confidence * 5
                  ),

              "is_human_saved":
                  False

          }


          with open(
              "/tmp/result.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  record,
                  f,
                  ensure_ascii=False
              )


          print(
              "Evaluation:",
              evaluation
          )

          print(
              "Confidence:",
              confidence
          )

          print(
              "Novelty:",
              novelty
          )

          PY


            # =================================================
            # 3-K. Save result
            # =================================================

            HTTP_STATUS=$(curl \
              --silent \
              --show-error \
              --output /tmp/save.json \
              --write-out "%{http_code}" \
              --request POST \
              --url "${BASE_URL}/rest/v1/research_results" \
              --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Content-Type: application/json" \
              --header "Prefer: return=minimal" \
              --data-binary @/tmp/result.json)

            echo "Save HTTP status: ${HTTP_STATUS}"


            if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then

              cat /tmp/save.json

              curl \
                --silent \
                --show-error \
                --request PATCH \
                --url "${BASE_URL}/rest/v1/research_jobs?id=eq.${JOB_ID}&status=eq.running" \
                --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
                --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                --header "Content-Type: application/json" \
                --data "{\"status\":\"failed\",\"error_message\":\"Research result save failed\",\"finished_at\":\"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"}" \
                || true

              continue

            fi


            # =================================================
            # 3-L. Complete job
            # =================================================

            FINISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")


            curl \
              --silent \
              --show-error \
              --fail \
              --request PATCH \
              --url "${BASE_URL}/rest/v1/research_jobs?id=eq.${JOB_ID}&status=eq.running" \
              --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Content-Type: application/json" \
              --header "Prefer: return=minimal" \
              --data "{\"status\":\"completed\",\"finished_at\":\"${FINISHED_AT}\"}"


            echo "JOB COMPLETED: ${JOB_ID}"

          done


      # =====================================================
      # 4. Automatic re-verification of saved/promising
      # =====================================================

      - name: Re-verification scan
        run: |

          set -e

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"


          curl \
            --silent \
            --show-error \
            --fail \
            --url "${BASE_URL}/rest/v1/research_results?select=id,project_id,title,hypothesis,content,evaluation,confidence_level,is_human_saved,created_at&project_id=eq.${{ env.PROJECT_ID }}&evaluation=eq.%E2%AD%95%EF%B8%8F&limit=10" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            > /tmp/promising.json || true


          python3 <<'PY'

          import json

          try:

              with open(
                  "/tmp/promising.json",
                  "r",
                  encoding="utf-8"
              ) as f:

                  rows = json.load(f)

          except:

              rows = []


          print(
              "Re-verification candidates:",
              len(rows)
          )

          PY


      # =====================================================
      # 5. Worker summary
      # =====================================================

      - name: Worker summary
        if: always()
        run: |

          echo ""
          echo "=============================================="
          echo "MATH RESEARCH LAB WORKER"
          echo "=============================================="
          echo ""
          echo "Queue processed."
          echo "Maximum jobs this run: ${MAX_JOBS_PER_RUN}"
          echo "Maximum research cycles: ${MAX_RESEARCH_CYCLES}"
          echo "Maximum route repetitions: ${MAX_ROUTE_REPETITIONS}"
          echo ""
          echo "Background worker finished."
